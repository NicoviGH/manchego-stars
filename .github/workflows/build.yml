name: build

# The heavy half: the unit tests and the real ROM build. Two jobs, not one, because
# `make test` and `make green` are independent and used to run back to back inside a single
# job -- 53s + 129s serialised for no reason. In parallel the wall clock is the ROM build
# alone (#382).
#
# A full `make` needs the copyrighted base ROM (gitignored) and the agbcc toolchain, so the
# ROM build here links against a MOCK base ROM -- see the `build` job.

on:
  push:
    branches: [main]
    # Prose with nothing derived from it. 98 of the last 200 commits were docs-only and 96
    # of those touched ONLY these files -- HANDOFF.md alone was 80 -- so skipping the
    # toolchain for them removes most of this workflow's wasted runs.
    #
    # Deliberately an ALLOWLIST of inert files, never `**.md`: docs/scenes/ is a GENERATED
    # book that tools/test_scene_preview.py regenerates and diffs, and AGENTS.md /
    # docs/CHAPTERS.md / docs/CLASSES.md are derived or linted. A broad glob would skip the
    # very tests that police those.
    #
    # Everything here is still covered by checks.yml, which has NO path filter -- a
    # docs-only change is still checked for drift, it just doesn't compile a GBA ROM.
    #
    # Listed twice because GitHub Actions does not support YAML anchors; keep the two lists
    # identical (tools/check.py check_build_workflow_filters_agree pins that).
    paths-ignore:
      - 'HANDOFF.md'
      - 'README.md'
      - 'CREDITS.md'
      - 'docs/decisions.md'
      - 'docs/PRD.md'
      - 'docs/roadmap.md'
  pull_request:
    paths-ignore:
      - 'HANDOFF.md'
      - 'README.md'
      - 'CREDITS.md'
      - 'docs/decisions.md'
      - 'docs/PRD.md'
      - 'docs/roadmap.md'
  # Manual run, optionally WITHOUT the vanilla-build cache: the proof that a cached build and
  # a clean one produce the same ROM (compare the "ROM checksum" step of both).
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build the decomp from scratch (skip the vanilla-build cache)'
        type: boolean
        default: false

jobs:
  # Unit tests (Python combat/difficulty/build + pure-Lua playtest logic). Needs the
  # submodule, which the decomp-reading tests (vanilla_decomp_text) and the Lua tests use.
  #
  # It also needs a HOST C toolchain, which is not obvious and cost this job a red run: the
  # suite is not pure logic. `test_map_tileset` and `test_map_retile_workflow` go through
  # gen_map_editor, which builds the decomp's own `gbagfx` to turn PNGs into 4bpp -- so
  # build-essential and libpng-dev are required here even though no ROM is linked.
  # What this job still skips is the expensive half: agbcc, the ARM toolchain and the
  # decomp build, which is why it finishes in ~1 minute against the ROM build's ~3.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev lua5.4
          # The Makefile probes for `lua`; ubuntu ships the binary as `lua5.4`.
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          python3 -m pip install ttp numpy pillow pyyaml

      - name: Unit tests (make test)
        run: make test

  # The real "make green" gate. Mirrors the fireemblem8u decomp's own build.yml: a
  # MOCK base ROM (random 16MB) lets `make` compile + link the full ROM without the
  # copyrighted original -- which is what we want (we diverge from vanilla anyway).
  # This catches real breakage: bad C, missing symbols, malformed data tables, and a
  # broken build_campaign.py injection.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev lua5.4
          # The Makefile probes for `lua`; ubuntu ships the binary as `lua5.4`.
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          python3 -m pip install ttp numpy pillow pyyaml

      # agbcc changes rarely; cache the built compiler (~2-3 min of every run otherwise).
      # Bump the key suffix to force a rebuild if agbcc upstream ever matters.
      - name: Cache agbcc
        id: agbcc-cache
        uses: actions/cache@v4
        with:
          path: agbcc
          key: agbcc-${{ runner.os }}-v1

      - name: Build agbcc (cache miss only)
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/pret/agbcc.git
          cd agbcc && ./build.sh

      - name: Install agbcc into the decomp
        run: cd agbcc && ./install.sh "$GITHUB_WORKSPACE/fireemblem8u"

      - name: Build decomp tools
        run: cd fireemblem8u && ./build_tools.sh

      # Deterministic, not /dev/urandom: vanilla `.s` files incbin from it, so a random mock
      # made every build unique -- no cached output could be reused and no two ROMs compared.
      - name: Mock base ROM (no copyrighted ROM needed to verify the build links)
        run: python3 -c "import random, sys; sys.stdout.buffer.write(random.Random(8).randbytes(16 << 20))" > fireemblem8u/baserom.gba

      # ~120s of every build was the VANILLA decomp's own assets (6,000 gbagfx conversions,
      # 2,200 compressions, the music) -- a function of the submodule commit and the toolchain
      # and nothing we author. So the vanilla build's outputs are cached on exactly those, and
      # `make` then rebuilds only what our injection touches. Sources are pinned to an old
      # mtime first so the restored outputs read as up to date; the decomp's rules depend on
      # sources only (never on tool binaries), and header deps ride in the cached .d files.
      # The ROM is compiled in build/fireemblem8u, a git worktree of the submodule (#408), so
      # that is where the cached outputs go and whose sources are pinned.
      - name: Build tree
        run: python3 tools/build_tree.py ensure

      # agbcc's headers too: "Install agbcc" rewrites them every run and every object depends
      # on them, so unpinned they rebuilt all 357 C files on every cache hit. Safe because the
      # cache key below hashes every file under tools/agbcc.
      - name: Pin decomp source mtimes
        run: |
          cd build/fireemblem8u
          git ls-files -z | xargs -0 touch -h -d '2000-01-01T00:00:00Z'
          touch -d '2000-01-01T00:00:00Z' "$GITHUB_WORKSPACE/fireemblem8u/baserom.gba"
          find "$GITHUB_WORKSPACE/fireemblem8u/tools/agbcc/include" -type f -print0 \
            | xargs -0 touch -d '2000-01-01T00:00:00Z'

      # The key names everything the cached objects were BUILT WITH, not labels someone bumps:
      # the submodule commit, the runner image, the ARM binutils version, and the agbcc
      # binaries actually installed (the agbcc cache rebuilds from pret/agbcc's tip on a miss).
      - name: Vanilla build cache key
        id: vanilla
        run: |
          toolchain=$( { echo "$ImageOS $ImageVersion"; arm-none-eabi-as --version | head -1;
                         find fireemblem8u/tools/agbcc -type f -print0 | sort -z | xargs -0 sha1sum; } \
                       | sha1sum | cut -c1-16 )
          echo "key=vanilla-build-${{ runner.os }}-$(git -C fireemblem8u rev-parse HEAD)-$toolchain-mock-v1" >> "$GITHUB_OUTPUT"

      # The last build's outputs, injected content included (#408). The vanilla cache alone
      # left ~1,500 conversions and 357 C files of OUR content to rebuild on every run. Keyed
      # on the vanilla key (the objects embed that compile) plus the run, and restored by
      # prefix: the newest build of this ref, else of main. A hit stands in for the vanilla
      # cache -- it is a superset of it. Correctness rides on the compiled record it carries
      # (.build-compiled): the injector rewinds a file to its recorded mtime only when its
      # bytes match, and leaves one that differs newer than its record (inject.warm).
      - name: Restore injected build
        id: injected-cache
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/restore@v4
        with:
          path: injected-build.tar
          key: injected-build-${{ steps.vanilla.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: injected-build-${{ steps.vanilla.outputs.key }}-

      - name: Unpack injected build (cache hit)
        id: injected
        if: steps.injected-cache.outputs.cache-matched-key != ''
        run: |
          tar -xf injected-build.tar
          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Restore vanilla build
        id: vanilla-cache
        if: ${{ !inputs.no_cache && steps.injected.outputs.hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: vanilla-build.tar
          key: ${{ steps.vanilla.outputs.key }}

      - name: Unpack vanilla build (cache hit)
        if: steps.vanilla-cache.outputs.cache-hit == 'true'
        run: tar -xf vanilla-build.tar -C build/fireemblem8u

      - name: Build vanilla decomp and save it (cache miss only)
        if: ${{ !inputs.no_cache && steps.injected.outputs.hit != 'true' && steps.vanilla-cache.outputs.cache-hit != 'true' }}
        run: |
          cd build/fireemblem8u
          git ls-files -o -z | sort -z > "$RUNNER_TEMP/before.lst"
          make fireemblem8.gba -j"$(nproc)"
          git ls-files -o -z | sort -z > "$RUNNER_TEMP/after.lst"
          comm -z -13 "$RUNNER_TEMP/before.lst" "$RUNNER_TEMP/after.lst" \
            | tar --format=posix --null -T - -cf "$GITHUB_WORKSPACE/vanilla-build.tar"

      - name: Save vanilla build
        if: ${{ !inputs.no_cache && steps.injected.outputs.hit != 'true' && steps.vanilla-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: vanilla-build.tar
          key: ${{ steps.vanilla.outputs.key }}

      - name: make green (inject campaign + build ROM)
        run: make CAMPAIGN=rime-of-the-frostmaiden

      # Every run saves, PRs included: a PR's next push restores its own last build first.
      - name: Pack injected build
        if: ${{ !inputs.no_cache }}
        run: |
          python3 tools/build_tree.py outputs | sed -z 's|^|build/fireemblem8u/|' \
            | tar --format=posix --null -T - -cf injected-build.tar
          tar --format=posix -rf injected-build.tar .build-compiled

      - name: Save injected build
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/save@v4
        with:
          path: injected-build.tar
          key: injected-build-${{ steps.vanilla.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: ROM checksum
        run: sha1sum build/fireemblem8u/fireemblem8.gba

      # Text is compiled from source, so the mock base ROM doesn't affect it. This is
      # the regression gate for the text-table corruption class (terminator parity,
      # runaway decodes) that has bitten twice before.
      - name: Verify ROM text decodes cleanly
        run: python3 tools/verify_text.py

      # Surface the campaign enemy-pressure curve (ours vs vanilla parity references) on
      # every build so balance spikes/sags and parity regressions are visible at a glance
      # (#48), AND hard-fail any chapter content has marked balance-final. PER-CHAPTER gate
      # (#48 (b)): `--check` enforces only chapters with `balance_locked: true` in their YAML,
      # so unwritten / mid-authoring chapters stay informational and never redden CI -- we
      # author chapters as we go and lock each one when it's balanced. With zero locks this
      # passes (enforces nothing). Reads the decomp HEAD, so it needs the submodule (above).
      - name: Enemy-pressure parity curve + per-chapter gate
        run: make CAMPAIGN=rime-of-the-frostmaiden difficulty-gate

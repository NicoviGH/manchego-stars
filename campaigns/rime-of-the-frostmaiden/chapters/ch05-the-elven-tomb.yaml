  # ── 9C8 — BOSS DEATH. One box. Already locked. ───────────────────────────────
  - trigger: boss_death
    slot: "vanilla 0x9C8"          # data_battlequotes.c, EVFLAG_DEFEAT_BOSS
    type: quote
    description: >
      Play it as a zealot's last OFFERING, proud and certain, never as regret (ravisin.md bans
      pathos). One box. TWIN = Saar's own 0x9C8, "Emperor Vigarde..... Glory to His....Majesty
      .....": a dying soldier's SALUTE — name the liege, then glorify. No accounting, no
      reproach; the last thing he does is praise. The earlier draft ("Auril... I gave you
      everything...") drifted off that shape twice over — it read as an invoice rather than a
      salute, putting Ravisin at the centre of her own death instead of her goddess, and it was
      the ONLY place in the whole chapter the goddess's proper name appeared. Everywhere else
      she is the reverent epithet ("the Frostmaiden": 9BC twice, 9C7 and this quote) and never appears, so
      a one-box death quote was the worst possible spot for a first-and-only lore drop
      (Nicolas, 2026-07-29). "The winter is yours" is a HANDOFF, which is truer to a chapter
      where killing her does not stop the cold.
      LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas). 1 box.
    script:                           # LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas)
      - ravisin: "Frostmaiden... the winter is yours..."
  - trigger: chapter_end
    slot: "vanilla 0x9C9"
    type: cutscene
    ea_file: events/ch05-ending.ea
    description: >
      Ravisin falls. The party adopts Basil — they REPOT her (she is already called Basil and
      joined on the map; there is no discovery and no naming beat, LOCKED 2026-07-23). They turn
      down the coast toward Bremen, where Ravisin woke something in the lake.
      MINED SKELETON — vanilla MSG_9C9 (34 boxes, `EventScr_Ch5_EndingScene`, ON-MAP so bubbles
      wrap at 29). Its beat order, which ours follows: (1) aftermath before anyone does business;
      (2) the ESCORT is thanked and becomes the scene's centre; (3) the party asks her a question
      and she TELLS THEM THE PLOT — the escort, not a party member, carries the chapter's forward
      information; (4) the party deliberates in front of her; (5) a closing box that turns the win
      into the next journey.
      WHO SITS IN WHICH SEAT: Natasha → BASIL (Basil is her donor and holds her role all chapter,
      so she inherits the information too — and that is WHY 0x9CA has to exist). Eirika → BRAULO (he
      speaks when a decision has to be made, then the party follows). Seth → split between
      PROF-RBG (who knows where Bremen is; he makes inquiries everywhere) and MARTY (the reason
      to go that isn't money). Meesmickle is DELIBERATELY ABSENT — he already spent his one line
      of the chapter on 0x9C4, and his bible is explicit that a few perfect quips beat a speaking
      role.
      BASIL CAN CARRY THIS AND SAHNAR CANNOT: Sahnar is optional (no recruit, no scene) and has
      been under a stone for four thousand years — she has no way to know about a lake. Basil is
      Ravisin's own attendant and reports what she HEARD Ravisin say, which is also how 9BB damns her
      ("she said it would still run"). Villains condemn themselves in reported speech.
      NO MOOSE (Nicolas, 2026-07-30). The moose is a CONVERTIBLE miniboss — the player may simply
      kill it — so the ending cannot assume it survived, and an earlier draft opened on it running
      home. Cutting it costs two payoffs that were moose-dependent (Pinky's "why isn't it
      running?" from 0x9C4, and 9BB's "it wouldn't eat them"); they are forfeit, not relocated.
      Do not reinstate them: a beat the player can delete is not a beat the ending can rest on.
      THE BREMEN HOOK IS ABOUT THE MONSTER, NOTHING ELSE (Nicolas, 2026-07-30). An earlier draft
      routed it through Sephek and closed on "the Frostmaiden has many hands", which implies the
      lake creature is another Child of Auril. IT IS NOT. Per ch06 it is Messie, an AWAKENED
      plesiosaur — woken by Ravisin exactly as the wolves and the moose were, and ORDERED to sink
      the boats. It is another of her victims, and ch06 lets Marty talk her down. So the hook says
      only what Basil heard: she woke a thing in the water and told it what to do.
      SAHNAR IS OPTIONAL — the berry exchange (boxes 6-11) can only play if she was recruited.
      Wiring owes a skip: without her, the scene runs Basil's repotting straight into Braulo's
      question. The berry is 9BB's promise paid ("One day I'll give her one"), so a player who
      never freed her simply never collects it. That is the correct cost of skipping the recruit.
      LOCKED 2026-07-30 (dialogue-pass, co-written with Nicolas) after two red-pen passes.
      19 boxes (twin: 34).

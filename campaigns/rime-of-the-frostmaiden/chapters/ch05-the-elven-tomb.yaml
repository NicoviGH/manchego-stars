  - trigger: sahnar_talk          # Basil (Natasha-donor) Talks the risen Sahnar (Joshua-donor)
    slot: "vanilla 0x9CC"          # the Talk recruit. Was mislabelled "9C6" until 2026-07-29;
                                   # the real 0x9C6 is Natasha's death quote. See SLOT-ID CAVEAT.
    type: dialogue
    ea_file: events/ch05-sahnar-recruit.ea
    description: >
      THE CHAPTER'S PAYOFF. Basil chaperoned safely to Sahnar → she turns and joins. The
      escort-recruit (Ch5's Joshua beat, twin `EventScr_089F2270`, 32 boxes; ours is 16 — the
      relationship was already built in 9BB, so this scene only has to turn her).
      The turn is NOT an argument won and NOT a rescue. Its mechanism, beat for beat off the
      twin: RECOGNITION → duty stated flatly → the other pleads → the recruit turns on
      something of their OWN (Joshua's coin comes up tails; Sahnar's 9C3 line "I was given a
      purpose" comes back over) → flip. Basil brings two proofs and no philosophy: (1) one of
      Ravisin's own creatures broke free, pack and all, "all it took was knowing they had a
      choice"; (2) the tomb's real desecrator is the witch herself. So Sahnar's purpose does
      NOT break — she keeps it, and her ENEMY resolves. She was misled, never bound.
      Written by Nicolas; boxed to GBA width here. Deliberate, do not "fix":
        · "...Basil?" is her exact first line from 9BB — the recognition IS the word. No
          introduction, no explanation; she never has to say who she is.
        · The wolf stays GENERIC ("a wolf", "his whole pack", "travelers") — Sahnar has no way
          to know Lupin, and 9BB established she knows only what Basil tells her.
        · "child" → "little one" is an ARC: cold while she is still the summoned guardian,
          then 9BB's name for her the moment she comes back to herself.
        · The scene ENDS on Basil's berry question, unanswered — 9BB's "One day I'll give her
          one" left open on purpose, going into the fight.
      LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas). 16 boxes, Sahnar 8 / Basil 8.
    script:                           # LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas)
      # (Basil is walked the last few steps under escort. Her killing edge is up.)
      - sahnar: "Far enough. The tomb is--"
      - sahnar: "......"
      - sahnar: "...Basil?"
      - basil: "Sahnar! I can't believe you're free!"
      - sahnar: "I am not free, child. I was summoned to fulfill my purpose."
      - basil: "That's actually why I'm here... Some of her creatures broke free."
      - sahnar: "...What?"
      - basil: "A wolf. Him and his whole pack. They're out there now, with travelers."
      - basil: >-
          All it took was knowing they had a choice... That we have a choice...
      - sahnar: "......"
      - sahnar: "My purpose... is to defend this tomb..."
      - basil: "From who? Your people are long gone..."
      - basil: "The witch has lost her way. She's disturbing the dead..."
      # (The turn: the purpose holds, the enemy resolves.)
      - sahnar: "Then my purpose has not changed. Only my true enemy has been revealed."
      - sahnar: "...Thank you, little one."
      # (Last box before gameplay resumes. She never answers.)
      - basil: "...Can I give you a berry now?"
    no_lupin_fallback:                # TEXT CHOSEN 2026-07-30 (Nicolas, L5) — WIRING NOT BUILT.
      boxes: [8]                      #   The locked script above is unchanged and still plays
                                      #   whenever Lupin WAS recruited.
      replaces:                       # anchored to the text, so an index cannot silently drift
        - "A wolf. Him and his whole pack. They're out there now, with travelers."
      reason: >-
        Box 8 is PROOF #1 — the evidence that turns Sahnar — and it is a wolf the player may never
        have recruited (ch04's parley is optional). Without him the proof changes SHAPE: it stops
        being evidence someone else already walked free and becomes Basil's argument that the two
        of THEM could. `lore/sahnar.md` supports the swap — she does not weigh the argument, she
        recognises the ARGUER — so the scene still turns on Basil rather than on the wolf.
        Box 9 ("All it took was knowing they had a choice... That we have a choice...") is
        unchanged in both branches; its "we" already includes him.
        OPEN: box 6 is kept at v0 (Nicolas), but "SOME of her creatures broke free" asserts a
        plural this branch has no evidence for — the wolf is the only other one. One word ("One
        of her creatures") closes it; flagged rather than changed, because v0 was an explicit pick.
      script:
        - basil: "There is nothing holding us here... We could go free as well."
  # ── 9C7 — BOSS TAUNT. One box. Vanilla's Saar taunt is ONE A-press. ──────────

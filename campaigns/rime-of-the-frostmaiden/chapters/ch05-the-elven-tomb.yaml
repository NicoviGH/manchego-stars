  - id: sahnar
    name: "Sahnar"
    count: 1
    class: myrmidon             # Joshua's exact class/donor — a fast, crit-threat sword duelist
    level: 5                    # Joshua's own level (UnitDef_088B5914, .level = 5). Was 6, the
                                # ONE field in this block that did not cite his bytes — every
                                # other line here quotes the decomp, and every GENERIC in this
                                # chapter already matches vanilla Ch5's levels (Mercenary L6,
                                # Soldier L5-6, Fighter/Archer L4-5), so the +1 was drift, not a
                                # decision. At 5 she measures 21.4 threat / pow 9 / spd 16 /

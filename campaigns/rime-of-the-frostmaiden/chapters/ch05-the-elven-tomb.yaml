      # chapter that stages a creature under a pid nothing dressed.
      source: "DeviantArt: 'Wyrdeer - full sprite' by Anarlaurendil (CC BY-SA 3.0)"
    # ── Battle animation (#25) ────────────────────────────────────────────────
    # NICOLAS'S OWN ART, not the vendored Wyrdeer the map sprite wears: one 1920x1080 master
    # of three poses, descaled to 88x64 on a common feet-anchor over a shared 14-colour
    # palette (tools/descale_battleframe.py --body 56 --noflip). The master reads left to

      - sahnar: "...Someone has come."
      - sahnar: "Four thousand years, and someone has finally come."
      - sahnar: "...I was given a purpose. To defend this tomb."
      # (One locked box, two authored presses at the 29-wrap -- see the note above.)
      - sahnar: "No one ever came."
      - sahnar: "I stopped counting somewhere in the middle."
      - sahnar: "...Well. Something has come now."
      - sahnar: "I will defend this tomb. It is my purpose."
  # ── 9C4 — CUT 2026-07-29 (Nicolas). Slot deliberately left empty. ─────────────
  # Was: "Basil, mid-escort, steeling herself" — vanilla's 4-box Natasha prayer (MSG_9C4),
  # which she spends psyching herself up to walk into danger and talk somebody down.
  # CUT because its only real job was to plant the berry ahead of the recruit, and 9BB
  # ALREADY plants it: "One day I'll give her one." Re-planting it one slot before the
  # payoff would have spent the setup twice and made 9C6 read as its own echo. The seven
  # slots of silence between 9BB and 9C6 are doing the work instead.
  # Drafted and rejected at the same sitting: three variants (berry / scared-going-anyway /
  # "little one"), all four boxes, all bubble-legal. Nothing salvageable is owed forward —
  # Basil's fear now lives inside the recruit scene itself, where it costs her something.
  # NB the old description here carried `basil.md`'s RETIRED "voice is spare (2-5 words)"
  # spec (retired 2026-07-23: it made her read as slow — her corpus twin is Ewan). Do not
  # resurrect it if this slot is ever refilled.
  # ── 0x9C4 — the LAST beat before the map: the moose triggers the fight ────────
  - trigger: chapter_start       # opening event list, LAST message
    slot: "vanilla 0x9C4"
    type: cutscene
    ea_file: events/ch05-opening.ea
    description: >
      Vanilla's 0x9C4 is Natasha alone, steeling herself, four boxes, immediately before the map
      loads — the escort stating her errand so the objective is her wish rather than a brief.
      We use the POSITION and not the content (Nicolas, 2026-07-29): this is where the fight
      starts, and it starts because the MOOSE does something.
      Structure is a setup/punchline across a wordless action, which is why Pinky's question moved
      here out of 0x9BE — a setup fifteen boxes from its punchline is not a setup:
        Pinky asks why it isn't running -> the moose bellows and charges -> Meesmickle answers the
        question sideways -> battle.
      THE MOOSE CANNOT SPEAK. ch04 established it as a "mute white ghost" and locked that
      2026-07-03, so the middle beat is pure stage direction. Its motion is also a ch04 PAYOFF
      inverted: in ch04's `moose_sighted` it breaks from a clearing and bolts AWAY. Here it breaks
      the same way and comes at them, because this time it is cornered and Ravisin holds it.
      Meesmickle is the right voice — dry, one sentence, "a wit, not a bully" (his bible), and the
      line is aimed at the universe's timing rather than at Pinky.
      RAVISIN STAYS SILENT through this. The fight begins on the quarry's terms, not hers; her
      first words on the map are the eruption (host message 0x9E4; vanilla anatomy 0x9C5).
      Basil's steeling-himself beat — the twin's actual content — is CUT (Nicolas, 2026-07-29).
      Not deferred, not homeless: cut. Her nerve is not a beat this chapter needs stated, and 0x9BB
      already establishes what she is walking toward.
      LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas). 2 boxes.
      WIRED 2026-08-14 (#25) at host message 0x9F1, as an ON-MAP bubble (wraps at 29) played
      AFTER the prep CALL alongside scenes 5 and 6 — the last thing before turn 1. The two boxes
      share ONE id: the wordless middle beat is a `stage_break:`, vanilla's `[BreakTalk]`, which
      pauses the message so the event script can act and `TEXTCONT` resumes it. Splitting the
      beat across two TEXTSHOWs would have cost a second id for nothing.
      THE CHARGE IS NET-ZERO, and that is a balance requirement rather than a staging taste
      (Nicolas, 2026-08-14): the moose breaks out of its pen on screen and is hauled back to
      (10,0) afterwards, off camera, so the fight begins from the locked position the parity
      read is grounded on. Its post is row 0 — the map's top edge — so there is no tile behind
      it to charge FROM; the lunge has to run forward and be checked. Ravisin's hold is the
      check, which this chapter already says out loud: she is the reason it is cornered at all.
    script:                           # LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas)
      # (The hollow. The moose stands at bay among the standing dead. Nothing has moved.)
      - pinky: "...It's not running. Why isn't it running?!"
      - stage_cut: "The moose throws its head back and BELLOWS -- full screen, no words -- then
          breaks and comes straight at them, until Ravisin's hold snaps it back."
      - meesmickle: "You had to ask?"
      # (Cue battle. -> PREP -> turn 1.)
  # ── 0x9D5/0x9D6 — the arena's systemic tutorial. Vanilla teaches it HERE, in Ch5. ──
  - trigger: arena_tile_visited   # flag-gated, like vanilla's own arena tutorial
    slot: "vanilla 0x9D5 + 0x9D6"
    type: tutorial
    description: >
      It IS the arena and it KEEPS THE NAME (decisions.md §Economy, superseded 2026-07-29), so
      vanilla's own tutorial text is reusable nearly verbatim -- the player learns one word, the
      word the game already uses. Vanilla teaches the arena in THIS chapter, so tutorial parity is
      owed here and not deferred. The twin is a flag-gated
      pair: 0x9D5 is one box naming the thing ("There's an [red]arena[/red] here."), 0x9D6 is five
      boxes of pure mechanics — one-on-one matches, win pays TWICE the entry fee, a loss means
      that unit "will not be able to fight in any future battles", and press B quickly to concede
      (lose the fee, keep the unit). Note vanilla puts the escape hatch in the tutorial, not in
      the fiction: a player who reads this knows how to bail.
      CHANNEL, per the onboarding C-hybrid: this is a DRY SYSTEMIC lesson (a wager, a payout
      multiplier, a permadeath risk, a panic button), so it rides vanilla-style tutorial boxes —
      NOT Wolfram's dialogue. His 0x9BE beat is the narrative seed and deliberately states no
      numbers; splitting them is what keeps his voice from turning into a rules manual.
      ONBOARDING LEDGER: `introduces: arena-wager` above owns this debut; regenerate
      `docs/ONBOARDING.md` with `gen_onboarding_index.py` (the concept debuts once, and
      `test_onboarding.py` gates both the ledger and the live wiring).
      RESOLVED 2026-07-29: no gear upgrades. That was the "Forge" label leaking a mechanic we do
      not have; Wolfram's 0x9BE lines promise practice and nothing else.
      TEXT = VANILLA'S, VERBATIM, and that is the finding rather than a shortcut. Because we kept
      the arena's mechanic AND its name, there is nothing left to reflavour: every clause is a rule
      (fee, doubling, permanent loss, the B-button concede) and rules are identical. Rewriting them
      could only introduce drift. The tutorial voice is the GAME's, not a character's — unattributed
      and red-highlighted — so it also carries no campaign flavour to update. The one thing we owe
      is that it fires on OUR arena tile, which Wolfram opened in 0x9BE.
      Deliberately NOT added: a flavour clause about the niches holding this place's champions. It
      would explain why a loss is permanent, but vanilla's tutorial boxes carry zero fiction and
      mixing the two is how a rules box stops reading as authoritative. If that fiction is wanted
      it belongs in Wolfram's mouth, not here.
      Note vanilla puts the ESCAPE HATCH in the tutorial rather than in the fiction — a player who
      reads this knows how to bail. Keep that; it is the most player-respecting box of the five.
      LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas). 6 boxes (1 + 5), = the twin.
    script:                           # LOCKED 2026-07-29 -- vanilla MSG_9D5 + MSG_9D6, verbatim.
      # (Unattributed tutorial voice, not a character. [ToggleRed] marks the highlighted terms in
      #  vanilla; the markup is a text-insertion detail, ROM-gated.)
      # -- MSG_9D5, 1 box: name the thing.
      - tutorial: "There's an [red]arena[/red] here."
      # -- MSG_9D6, 5 boxes: the rules, one per A-press.
      - tutorial: "Arenas play host to [red]one-on-one combat matches[/red]."
      - tutorial: "If you win a match, you'll earn [red]twice the amount of the entry fee[/red]."
      - tutorial: "If you lose, however, that unit [red]will not be able to fight in any future battles[/red]."
      - tutorial: "If your HP drops near zero in a fight, [red]press the B Button quickly[/red] to concede."
      - tutorial: "You'll lose your entry fee, but you'll save your unit to fight again."
  - trigger: eruption_turn        # scripted turn (~2/3/5, the Ch5 wave cadence) — EARTHQUAKE/TILECHANGE
    slot: "vanilla 0x9C5"        # anatomy/source only; ch05 writes this beat at host-owned 0x9E4
    type: scripted_event
    ea_file: events/ch05-eruption.ea
    description: >
      The tomb floor breaks (Phantom-Ship EARTHQUAKE + sequential TILECHANGE): undead
      REINFORCEMENTS erupt over turns and race the party for the spread reliquary
      reward-sites (the Ch5 village-raid, in undead dress).
      SAHNAR IS NOT ONE OF THEM, as of 2026-08-14 (Nicolas, #25). The quake used to crack her
      sarcophagus and she used to rise here; Ravisin now calls her up ON SCREEN in scene 3
      (`vanilla 0x9BD`), before the party has even crested the ridge, and she is on the arena
      tile from turn 1 exactly as vanilla's Joshua is. What Ravisin does to her is unchanged:
      she WAKES a watching guardian who has been undead and aware for millennia — she does NOT
      reanimate a fresh corpse and does NOT puppet her (lore/sahnar.md). Sahnar walks HOSTILE of
      her own will, believing the party are the intruders she was left for; a fast crit-Myrmidon
      (smells faintly of pumpkin spice). She flips only when Basil reaches her.
      DIALOGUE BUDGET — vanilla spends 3 boxes (`EventScr_089F22A4`, the bandits who join the
      fight mid-map); ours spends 4 because the wired reliquary race needs an explicit warning.
      The structural rule taken from the twin: **the ARRIVING FORCE speaks
      and the party never reacts.** Vanilla gives Eirika and Seth not one line here. So these
      boxes belong to the arriving side. (Phantom Ship's quake beat does the opposite —
      Ephraim reacts to it — but Ch11b is only our THEME base for the EARTHQUAKE/TILECHANGE
      mechanism; Ch5 is the parity twin and wins the shape.) Either way both twins agree the
      SPECTACLE lives in the event macros, never in the prose: nobody describes the horror.
      This is also Ravisin's FIRST SPOKEN LINE in the chapter proper — 9C2 stages her as a
      silent frost-robed figure at center, and what breaks the silence is her spending the
      permission Sephek granted in 9BC ("the one under the stone" is his phrase, handed back).
      RESOLVED 2026-07-29 (Nicolas): there was never a double-rising to design around. The line
      force is ALREADY STANDING when the party arrives — staged onto the board by LOAD1 across
      0x9BF/0x9C0 exactly as vanilla walks Saar's command on, so nothing "rises" in the opening.
      This beat is Ravisin SUMMONING MORE, in response to the party proving stronger than she
      allowed for. That is vanilla's escalation logic (its bandits arrive because the fight is
      going long) and it pays Sephek's 9BC warning twice: he told her not to take them lightly,
      and here she stops doing so.
      Hence the opening box: the summoning has to read as a RESPONSE, not a schedule. Without it
      the beat plays as a timed event and the player never learns their own pressure caused it.
      Nicolas's revision 2026-07-29 does that better than CLAUDE's draft did, three ways: she
      CREDITS SEPHEK by name, so 9BC's warning pays off out of the mouth of the person who
      brushed it aside; the summoning is a commander's order rather than the liturgy of "the
      Frostmaiden has need of you" (she is named plenty elsewhere and does not need a third
      mention); and "the BLADE under the stone" keeps Sahnar as inventory, echoing 9BD where
      Ravisin appraises her as exactly that.
      TWIN = EventScr_089F22A4, 3 boxes; ours is 4 after adding the race warning. Its structural
      rule is that the ARRIVING FORCE speaks while the party never reacts (vanilla gives Eirika
      and Seth no lines). Both twins
      agree the SPECTACLE lives in the event macros, never in the prose.
      THE RACE IS NAMED HERE, and that is what the second box buys (Nicolas, 2026-08-09). Vanilla
      spends its equivalent box on the raiders' intent — "steal our way through this pathetic
      town" — which is the only warning the player gets that the reward-sites are at stake. Ours
      said nothing about them, so the race (now actually wired, #25) would have announced itself
      with the engine's "The village was destroyed." popup, after a site was already gone.
      REVISED 2026-08-09 (Nicolas): all four boxes are Ravisin's, and Sahnar's "The tomb is
      closed. Turn back." is CUT. That box used to be the setup 0x9CC breaks from — she starts the
      same rote line at the recruit and stops at "Far enough. The tomb is--" because she has seen
      Basil. ACCEPTED as-is (Nicolas, 2026-08-09) after being raised: 0x9CC simply opens on the
      rote line cold. Recorded so a later pass does not "restore" a box that was cut on purpose.
      LOCKED 2026-08-09 (dialogue-pass, co-written with Nicolas). 4 boxes, all Ravisin.
    script:                           # LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas)
      # (EARTHQUAKE_START + sequential TILECHANGE; the floor breaks and more dead come up.
      #  Then LOAD1 — the sarcophagus cracks.)
      # (The response beat: her line force is losing, and she says WHOSE warning was right --
      #  9BC's briefing pays off by name, from the mouth of the person who dismissed it.)
      - ravisin: "Sephek was right. ...They've come further than I expected."
      # (The RACE, stated out loud -- the beat vanilla spends on its raiders' own "steal our way
      #  through this pathetic town". Without it the first the player learns of the race is the

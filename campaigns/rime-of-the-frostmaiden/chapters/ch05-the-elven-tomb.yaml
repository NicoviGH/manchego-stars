    # `frames:` wants — the list below is the corrected order, not the sheet order.
    #
    # --noflip because the master already faces LEFT, like FE8's own cer_at1 sheet and like
    # every frame set we have descaled so far; the engine H-flips for the right-hand side.
    # No --sharpen (it grains the white flank) and no --flat: the flat palette is tuned for
    # warm hues and collapsed the blood-red antlers to tan, which is a chroma wash-out of the
    # one accent the creature is recognised by.
    #
    # `clone_from: gwyllgi` is Nicolas's call (2026-08-15): the moose already DEPLOYS as
    # CLASS_GWYLLGI, and the donor's own anim (banim_cer_at1, animId 0xB1) is where the beast
    # cadence is read from — growl, snap, contact, one footfall away. That is the Gwyllgi's
    # script, NOT the Mauthe Doog's banim_mdg_at1 that Lupin's pounce borrows.
    battle_anim:

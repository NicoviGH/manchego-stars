  # ── CONVERTIBLE (#171): Ravisin summons Sahnar on screen in scene 3; Basil's Talk flips her ─
  # NO `arrives_turn` — she is on the map from TURN 1, which is vanilla's own shape: Ch5's
  # UnitDef_088B5914 LOAD1s Joshua at this same tile with this same sword right after the prep
  # CALL. `arrives_turn: 2` was OUR divergence, and it cost the story the beat that justifies
  # her: the player used to meet a hostile duelist because the data said so. Now they watch
  # Ravisin arm the weapon in scene 3 (`vanilla 0x9BD`) and then have to deal with it.

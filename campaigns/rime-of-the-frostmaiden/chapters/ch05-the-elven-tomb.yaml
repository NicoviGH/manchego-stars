                                # met, and does not stay: see `walks_to`.
    walks_to: [9, 7]            # …and then steps off it, exactly as vanilla's Joshua does
                                # (`MOVE(0x0, CHARACTER_JOSHUA, 9, 7)` in EventScr_Ch5_Beginning-
                                # Scene, immediately after his LOAD1). This is NOT decoration and
                                # dropping it cost us the whole ARENA: (12,6) is
                                # TERRAIN_ARENA_REGULAR and the tutorial's own trigger is
                                # `AREA(..., 12, 6, 12, 6)`, so a hostile parked there makes the
                                # arena unenterable for the entire chapter and silently kills the
                                # `arena-wager` debut (#264/#265). Vanilla walks him onto (9,7),
                                # TERRAIN_ROAD — no defensive bonus, in the open, two tiles clear
                                # of the arena mouth. The escort distance Basil must survive is
                                # measured to THIS tile, not the load tile.
    inventory:
      - id: killing-edge
        fe_base: killing-edge   # Joshua's killing-edge (30 crit) — the fragile-escort tension
    damage_type: slashing       # flavor label only
    ai_pattern: duelist_hold    # vanilla Joshua's own {0x7, 0x3, 0x9, 0x0} — strike anything that
                                # comes in range, NEVER move, and DO NOT TOUCH THE ESCORT. She
                                # stands guard at the arena. A turn-1 crit-Myrmidon on
                                # `aggressive` (pursue/charge) would hunt the squishies, which is
                                # a different chapter; one standing guard is the escort puzzle
                                # this chapter is built on.
                                # Sahnar is Joshua and Basil is Natasha, all the way down: AI_A_07
                                # is `ActionInRange_ExceptNatasha`, and the refusal that makes a
                                # fragile Cleric able to walk up to a Killing Edge lives in a
                                # character-id list, not in these bytes. `repoint_escort_safe_ai_list`
                                # points it at Basil at build time — the list has exactly one
                                # client in all of FE8 (this unit's donor), so nothing else moves.
    convertible: true           # #171 — the Joshua flip. Hostile crit-Myrmidon until fragile BASIL
                                # chaperones across to Talk her; then a +~0.9 kills/round back-half ally.
    parley:
      by: basil                 # the Natasha-donor Cleric, walked up under escort to Talk her
      result: become_allied
      recruits_npc: sahnar      # joins as a playable Myrmidon (npcs/sahnar.yaml)
    skin:                       # the moon-elf mummy; already art-planned (#25 issue thread)
      look: "Sahnar, hooded spectral moon-elf mummy"
      source: "FE-Repo: Battle Animations/Monsters - Basic Types/[Skeleton-Custom] [U] Specter by Alexsplode (native palette)"
    # roster grounded 2026-07-23 (rev.2) to FE8-Ch5 parity: 16 line + 6 eruption reinf + 1 convertible
    # (supersedes the 2026-06-06 boss-chapter 6→9 bump and the 2026-07-22 undead-monster-class rev.1).

# ── Sahnar's sarcophagus (RETIRED the 3-offering fetch-puzzle) ────────────────────
# Superseded 2026-07-15: the recruit is now the Basil→Sahnar chaperone Talk (the Joshua beat,
# above), which "affects how you play the level" the way vanilla Ch5's Natasha→Joshua does — a
# stronger hook than a fetch-quest that competes for turns. The brazier survives only as the
# narrative WAKE beat — and since 2026-08-14 (#25) that beat is RAVISIN'S, played on screen in
# scene 3 at the brazier's silver flame, not the turn-2 quake's. She calls Sahnar up HOSTILE
# before the party arrives; Basil must then reach her to flip her. Canon RotFM p.82-83's offerings
# (twig/pinecone/feather; we already dropped the severed hand) become set-dressing, not a gate.

# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
# SCENE MAP — ch05 follows vanilla FE8 Ch5's scene anatomy slot-for-slot (DECIDED 2026-07-23,
# Nicolas), with 9C4 CUT (2026-07-29) — so 14 of 15, not a literal 1:1. The anatomy is a
# CHECKLIST, not a quota: a slot whose job is already done elsewhere gets cut rather than filled.
# Not a length target either: we copy the SLOTS and what each one does, and pick each beat's
# register and box count while writing it. Read the twin's own scenes with:
#     python3 tools/vanilla_scene.py ch5 [SceneFragment]
# Anatomy + measured budgets: .claude/skills/dialogue-pass/references/scene-pacing.md
#
#   vanilla        channel   job in Ch5                          ours
#   ─────────────  ────────  ──────────────────────────────────  ──────────────────────────
#   0x9BA ( 3)     Text_BG   scene-setter: the arena/town        NOT ADOPTED (no arena; our
#                                                                 place beat is 9BE)
#   0x9BB (10)     on-map    the two RECRUITS meet, pre-battle   Basil + Sahnar through stone
#   0x9BC (17)     Text_BG   boss gets ORDERS from a superior    Sephek Kaltro → Ravisin
#   0x9BD ( 7)     Text_BG   subordinate shows DOUBT             Ravisin appraises the blade
#   0x9BE (19)     on-map    party ARRIVES; the PLACE            the ridge + the tomb seen
#   0x9BF ( 7)     on-map    thread ends; party OVERHEARS        CUT -- see the note below
#   0x9C0 ( 9)     on-map    stakes turn LETHAL, party ABSENT    CUT -- vanilla's motivation
#   0x9C1 ( 2)     on-map    party REACTS: two questions         CUT -- engine, unneeded here
#   0x9C2 ( 8)     on-map    recruit reaches party; BATTLE       Basil joins → battle
#   0x9C3 (12)     on-map    recruit's OWN scene (Joshua)        Sahnar in the sarcophagus
#   0x9C4 ( 4)     on-map    other recruit's beat before Talk    the MOOSE triggers the fight
#                                                                 (position reused, not content)
#   ══ everything above is ONE pre-map event list (98 boxes); below is triggered ══
#   0x9C5 ( 3)     on-map    mid-battle ESCALATION               the eruption (4 boxes;
#                                                                 hosted at 0x9E4)
#   0x9CC (32)     on-map    TALK-RECRUIT scene                  Basil Talks Sahnar (payoff)
#   0x9C6 ( 1)     quote     ESCORT-NPC death quote (Natasha)    Basil's death quote
#   0x9C7 ( 1)     quote     BOSS TAUNT — one box                Ravisin taunt
#   0x9C8 ( 1)     quote     BOSS DEATH — one box                Ravisin's death quote
#   0x9C9 (34)     on-map    ENDING exposition                   Ravisin falls → Bremen hook
#                                                                 (+ conditional Sahnar block)
#   0x9CA (24)     on-map    ENDING variant: "if she died"       ADOPTED -- the Basil-died branch
#   0x9CB (16)     on-map    ENDING coda: a villager thanks you  FOLDED into 0x9C9 (no slot)
#
# TRIGGERS ARE INHERITED WITH THE ANATOMY (corrected 2026-07-29, Nicolas caught it).
# 9BA-9C4 are ELEVEN messages inside ONE event list, `EventScr_Ch5_BeginningScene`, played
# start to finish BEFORE the map loads. They are not separately-triggered scenes, so there is
# no ordering to design between them and nothing can interleave: our 9C3 (Sahnar sealed in the
# dark) cannot race our eruption beat (the sarcophagus cracking), because 9C3 is over before the player
# ever takes a turn. Only three things below it carry real triggers, exactly as vanilla wires
# them: 9C5 anatomy = a mid-battle turn event (`EventScr_089F22A4`), 9C6 = a Talk
# (`EventScr_089F2270`), 9C9 = `EventScr_Ch5_EndingScene`.
# CHANNEL drives the LINE WIDTH we hand-box to: on-map bubbles wrap at 29 chars, Text_BG at
# ~42. Vanilla puts the two command scenes on a backdrop because they happen elsewhere -- which
# is why our 9BC/9BD (Sephek's briefing, Ravisin's errand) are backdrop scenes too.
#
# SLOT-ID CAVEAT (2026-07-29, CORRECTED same day): Ch5's messages live in TWO places, and an
# eventscript-only grep sees just one -- which produced a wrong caveat here (that 9C6/9C7/9C8
# "appear NOWHERE in the decomp"). They do. The authoritative map:
#   ch5-eventscript.h  0x9BA-0x9C4 (the one opening list) - 0x9C5 (mid-battle)
#                      0x9CC (the Talk recruit, EventScr_089F2270) - 0x9C9/0x9CA/0x9CB (ending)
#   data_battlequotes.c  0x9C6 = NATASHA's ch5 death quote (pid CHARACTER_NATASHA, no flag)
#                        0x9C7 = Saar BATTLE taunt (EVFLAG_BATTLE_QUOTES)
#                        0x9C8 = Saar DEATH quote (EVFLAG_DEFEAT_BOSS)
# So "9C6" was a BAD label for our recruit: the real 0x9C6 is a death quote. Our recruit is
# 0x9CC and is now labelled so. And 0x9C6 gives us a slot we had not accounted for at all --
# Natasha is BASIL's donor, so Basil owes a chapter-specific death quote too (see her slot).
# `vanilla_scene.py` used to read TEXTSHOW only and so HID every Text_BG scene -- it reported
# this opening as 8 messages / 71 boxes when it is 11 / 98, with 9BC and 9BD missing entirely.
# Fixed 2026-07-29; the tool now prints each message's id and channel. If a mined beat looks
# absent from a scene, suspect the miner before concluding vanilla lacks it.
# NOTE ON 9BC: vanilla's orders come from GLEN (a superior officer), never from Vigarde --
# so ours come from SEPHEK, not Auril. `lore/frostmaiden-voices.md` keeps the Frostmaiden
# OFF the page ("commands through frost giants and winter wolves"). Sephek is the prologue
# boss who rimed over and escaped: his return makes the Children of Auril concrete, earns
# Ravisin's "she has other hands" drop, and re-arms him for his Act-II death.
events:
  # ── 9BB — the two RECRUITS meet, before the party ever arrives ────────────────
  # ── 0x9BA — RELOCATED into 0x9BE as the Wolfram/Forge seed (Nicolas, 2026-07-29) ──
  #  Vanilla's 3-box cold open is Joshua wanting two things (arena money, that cleric), both of
  #  which pay off later. We have NO arena -- settled, decisions.md §Economy May 2026, Wolfram's
  #  Forge took its role -- EXCEPT that ADR is now superseded (decisions.md §Economy, 2026-07-29):
  #  the arena is KEPT and keeps its name, because the "Forge" label promised gear-smithing the
  #  arena cannot do. So the slot is repurposed rather than dropped: WOLFRAM finds, by metal-sense,
  #  that this place was an ARENA before a tomb was built into it -- the floor is full of
  #  blade-chips from centuries of sparring -- and offers to make it usable. Same job as the twin
  #  (a character states a want out loud, and it pays off later); it gives the arena an on-screen
  #  origin; and it gives Wolfram a role the campaign had left him out of.
  #  It sits INSIDE 0x9BE because 0x9BE is already the scene where
  #  each character reads the place through their own lens -- Lupin the tracks, Marty the magic,
  #  Pinky the moose -- so Wolfram reading the METAL belongs in that sequence, not beside it.
  #  See 0x9BE's script and the FORGE TUTORIAL slot below.
  - trigger: chapter_start       # opening event list, message 2 of 11 -- see TRIGGERS note
    slot: "vanilla 0x9BB"
    type: cutscene
    ea_file: events/ch05-basil-sahnar.ea
    description: >
      Basil visits the sarcophagus, as she does. Sahnar has been AWAKE in there for millennia
      (never asleep — npcs/sahnar.yaml), so they talk through the stone: the gentle shrub and
      the imprisoned queen, the only two kind things in a frost druid's tomb. Establishes BOTH
      recruits before either is a unit — vanilla spends 10 A-presses on the Joshua/Natasha
      meet-cute for exactly this reason — and it is why Basil later begs the party to free her:
      Sahnar is her friend, not a quest object. Their SECOND scene is the recruit (9C6), which is
      where the weight lands, so this one stays a window rather than a thesis.
      Ravisin is damned entirely in REPORTED SPEECH ("she said it would still run") and never
      diagnosed by Sahnar — Basil's doubt stays her own. Sahnar knows only what Basil tells her;
      she has no other window on the world. LOCKED 2026-07-23 (dialogue-pass, co-written with
      Nicolas). 19 boxes (Basil 12 / Sahnar 7 — the "16" here was wrong, and so is #25's scene
      table); the closing aside is hand-matched to Joshua's 3-box / 5-line cadence.
    script:                           # LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas)
      # (The tomb's eastern berm, before the party arrives. A frost-furred sarcophagus half-sunk
      #  in snow. A goodberry shrub hurries up on root-feet — she walks; she is not potted.)
      # "tonight" CUT 2026-08-13 (Nicolas), when the scene got its backdrop: BG_MS_ELVEN_TOMB is
      # a Winter DAY rip, and this was the only line that hard-asserted the hour. The doubling
      # ("came back ... came back") is Basil tumbling, not a leftover -- basil.md: she spills.
      - basil: "Sahnar! Sahnar, the moose came back, the white one, it came back--"
      - basil: "--and it's hurt. There are arrows in it. Three of them, in the shoulder. I counted."
      # (Sahnar's voice comes from inside the stone.)
      # SHE IS FACED ANYWAY, and that is a decision, not an oversight (Nicolas, 2026-08-13).
      # Basil cannot see her, so a portrait is literally wrong -- but vanilla's twin faces both
      # speakers, an unfaced speaker renders as a boxless full-width narration slab
      # (_script_to_message), and this scene's stated job is to establish BOTH recruits before
      # either is a unit. The portrait is how the player meets her. Do not "fix" it.
      - sahnar: "....Basil."
      - basil: >-
          She didn't take them out. I waited and I thought she was going to, and she just
          looked at it and said it would still run, and then she went inside.
      - basil: >-
          I gave it berries. It wouldn't eat them. I put them right where it could reach
          and it wouldn't eat them.
      - basil: "Why wouldn't she take them out? She made it. She made it, so why--"
      - sahnar: "I don't know."
      - basil: "...You always know things."
      - sahnar: "I know old things. I have never known why she does anything."
      - basil: >-
          ...I'm going to ask her again tomorrow. About the arrows. She might say yes
          if I ask her properly.
      - sahnar: "...She might."
      - basil: >-
          You could ask her! She'd listen to you, you're older than she is, you're older
          than everything--
      - sahnar: "......"
      - sahnar: "Don't worry about me, little one."
      - basil: "...All right."
      # "before dawn" KEPT against the Winter Day backdrop (Nicolas, 2026-08-13) -- here and in
      # Ravisin's "There is work before dawn" below. Only "tonight" was cut; these two read as
      # pre-dawn against overcast stone, and scene 4's backdrop was picked overcast too, so the
      # hour never contradicts what is on screen. Settled -- do not re-open it as a clash.
      - sahnar: "Go on, now. She'll want you before dawn."
      # (She goes. A few steps on root-feet. Then stops and looks back. The closing aside is
      #  Joshua's MSG_9BB shape beat for beat: observation -> wish -> resolve, 3 boxes/5 lines.)
      # SAHNAR LEAVES HERE, and the three boxes below are Basil alone talking about her absence.
      # Without this the stage direction was COMMENT ONLY and Sahnar stood at her podium through
      # "...And there she stays" (Nicolas, 2026-08-14). `exits:` emits [OpenX][ClearFace] -- FE8's
      # own ~16-frame face fade -- at exactly this point. Not a box: no A-press.
      - exits: sahnar
      - basil: "...And there she stays."
      - basil: "I wish I could share my berries with her."
      - basil: "One day I'll give her one."
  # ── 9BC — the boss gets her ORDERS from a superior (never from the big bad) ────
  - trigger: chapter_start       # opening event list, Text_BG backdrop (happens elsewhere)
    slot: "vanilla 0x9BC"
    type: cutscene
    ea_file: events/ch05-sephek-orders.ea
    description: >
      SEPHEK KALTRO returns (the prologue boss who rimed over and escaped) and gives Ravisin
      her orders in Auril's name — vanilla's Glen→Saar scene, our Children-of-Auril made
      concrete. Auril herself stays OFF the page (frostmaiden-voices.md). Pays off the
      prologue, earns Ravisin's "she has other hands" drop later in the chapter, and re-arms
      Sephek for his Act-II death. Voice: sephek-kaltro.md (serene, liturgical, pitying —
      never raises his voice) against ravisin.md (fervent, certain).
      MINED SKELETON — vanilla MSG_9BC's own beat order (17 boxes, Glen 12 / Saar 5, heavily
      LOPSIDED; the superior talks, the subordinate answers short). Read it with
      `python3 tools/vanilla_scene.py ch5`. Beat for beat:
        (1) superior greets by rank + a courtesy;  (2) "I bring orders from His Majesty" —
        authority ATTRIBUTED, big bad off-page;  (3-4) order one, spread over two redundant
        boxes;  (5) subordinate assents, short;  (6) "One more thing..." — its own A-press;
        (7-9) order two, bigger and nastier, plus a licence to be brutal ("tear this town
        apart");  (10-11) the subordinate ASKS PERMISSION to go further ("permission to
        execute her?");  (12) superior grants after a `...` beat;  (13-14) subordinate
        OVER-VOWS in zealot's language;  (15-16) superior closes with a benediction that is
        also a warning ("be sure his trust is not misplaced") + "That is all.";  (17) assent.
      Our mapping: Sephek is the measured superior, RAVISIN is the zealot subordinate (the
      Saar seat) — so her fervour is an over-vow answering his cool bookkeeping, and box 15's
      warning is where "she has other hands" enters the chapter. The permission beat is what
      sanctions the eruption's WAKING of Sahnar on-screen before it happens.
      LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas). NB the intelligence briefed is
      the PARTY (a company working the Ten-Towns, asking after the cold) — NOT the moose; neither
      of these two would spare a thought for a beast. Auril is named in reverent epithet ("the
      Frostmaiden") and never appears.
    script:                           # LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas)
      # (Somewhere in the tomb, before the party arrives. Sephek Kaltro — the prologue's
      #  frost-druid executioner, who rimed over and vanished — has come to give orders.)
      - sephek: "Ravisin. ...You have kept the woods well."
      - sephek: "I bring the Frostmaiden's will."
      - sephek: "There is a company moving through the Ten-Towns."
      - sephek: >-
          They have been asking about the cold. Where it comes from, and who serves it.
      - sephek: "They are to be stopped here."
      - ravisin: "...They will be."
      - sephek: "One more thing."
      # "them" -> "SOME of them", and the crossing dropped (Nicolas, 2026-08-13). The old line
      # was factually wrong: ch00's crossing party is Hlin and Scramsax, who are the company's
      # EMPLOYERS and not in it -- Sephek has never met these people. Naming no place leaves the
      # claim loose enough to be true of any Ten-Towns encounter instead of contradicted by one.
      - sephek: "I have met some of them myself."
      # "warmer" -> "TOUGHER" (Nicolas, 2026-08-13). This box's job is a WARNING, and "warm" is
      # the cult's own word for the living-and-sick (ravisin.md: "warmth is a sickness") -- so
      # it read as a dismissal and undercut "Do not take them lightly" in the same breath.
      - sephek: >-
          Do not take them lightly. They are tougher than they look, and they do not frighten.
      # (The permission beat — vanilla's "do we have permission to execute her?" seat. This is
      #  what SANCTIONS the summon: Ravisin calls Sahnar up under orders, not on a whim.
      #  Since 2026-08-14 (#25) she spends it in the VERY NEXT SCENE, and "If they press you"
      #  is a condition she does not wait for — which is the read: she has just been told the
      #  stone she walked past a thousand times holds a queen's blade, and 9BD is her
      #  discovering she owns an asset. Eager, not disciplined. Her turn-2 "Sephek was right"
      #  then lands harder, not softer: she spent the permission EARLY and it still was not
      #  enough.)
      - sephek: "If they press you, you may wake the warrior. The one under the stone."
      - ravisin: "...The elf?"
      - sephek: "She was a queen's blade once. She will serve well enough."
      - ravisin: "Consider it done. I will take them, and the winter will keep them."
      - sephek: >-
          The Frostmaiden is watching this place, Ravisin. ...See that she is pleased
          with what she finds.
      - sephek: "That is all."
      # Her closing liturgy, extended 2026-08-13 (Nicolas) from a flat assent into the scene's
      # villain button. THIRD person: the only person on stage is Sephek, and "your names" put
      # the sentence on her own superior. She is pronouncing it over the company, who are not
      # here to hear it, which is what makes it liturgy rather than a threat.
      - ravisin: >-
          ...The snow shall erase their names. The trees will forget their faces.
          According to her grand design...
  # ── 9BD — a subordinate shows DOUBT (foreshadows their own arc) ────────────────
  - trigger: chapter_start       # opening event list, Text_BG backdrop (happens elsewhere)
    slot: "vanilla 0x9BD"
    type: cutscene
    ea_file: events/ch05-basil-doubt.ea
    description: >
      Ravisin + Basil, alone after Sephek leaves. She appraises the warrior she has just been
      given leave to use; Basil asks after her — her friend, though she never says so — and is
      shut down and handed a chore.
      MINED SKELETON — vanilla MSG_9BD (Cormag + Glen, 7 boxes). NB the DOUBT there belongs to
      the SUPERIOR, not the subordinate: Glen reflects on the zeal he has just watched, lets a
      crack show ("if only I could hold such conviction in the righteousness of our emperor"),
      Cormag notices and asks ("Something troubling you, Brother?"), and Glen deflects ("No...
      Pay no mind to me") then changes the subject to logistics ("From here, we ride northeast,
      back to the fort"), and Cormag assents ("Very well"). Read it with
      `python3 tools/vanilla_scene.py ch5`.
      Our swap: Ravisin CANNOT doubt (ravisin.md banned list), so the shape is kept and the
      content inverted — she makes an oblique remark, Basil misreads it as feeling, and her
      deflection reveals there was never any feeling to read. She has always KNOWN Sahnar is
      under that stone (consistent with 9BC's "...The elf?"); what damns her is that she walked
      past a thousand times and only valued her once someone else pointed. Basil never reveals
      that she knows Sahnar — that stays her secret for the recruit to spend.
      LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas).
    script:                           # LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas)
      # THE SUMMON, and it costs NO BOX (Nicolas, 2026-08-14 — "you don't need to even add
      # lines"). Sahnar is simply ON SCREEN for this scene: no A-press, no dialogue, no
      # ceremony, which is the absent-mindedness the beat wanted and could not have got from a
      # line. The summon reads from the CONTRAST — she is not there in scene 2 and she is here,
      # standing at Ravisin's shoulder, for the whole of scene 3. The seven locked boxes are
      # untouched and the scene's quiet is intact, so Basil's beat still owns it.
      # What the staging buys: "It never once occurred to me she might be of use" is an
      # appraisal delivered to her face, Basil's question is asked with her friend standing
      # there, and "It's not your concern." is said over her.
      # SHE IS STAGED AT THE TOP because the engine gives no other option, not as a preference.
      # `TalkPrepNextChar` reopens the talk bubble whenever the active face differs from the
      # speaking one, so a face loaded MID-message opens a bubble of its own and the scene plays
      # with two stacked bubbles — which is exactly what the first cut shipped, and what Nicolas
      # caught on film. Vanilla's silent faces are always preloaded before the first box
      # (MSG_0954, MSG_095D, MSG_095E). Long form: SCRIPT_DIRECTIVES in build_campaign.py.
      - present: sahnar
      # (The tomb, after Sephek has gone. Ravisin looking toward the sarcophagus on the berm.)
      - ravisin: "A queen's blade. I have walked past that stone a thousand times."
      - ravisin: "It never once occurred to me she might be of use."
      # (Basil knows exactly who is under that stone. She still cannot say so — and now she has
      #  to hold that with Sahnar on screen, which is the pressure sahnar.md/basil.md wanted:
      #  her secret stays hers for the recruit to spend.)
      - basil: "...What will you do with her?"
      - ravisin: "It's not your concern."
      - ravisin: "Come. There is work before dawn."
      # ("MY berries" — they were never hers to give; cf. 9BB, where she hands them out freely.)
      - ravisin: "Prepare my berries."
      - basil: "...Yes."
  # ── 9BE — the party ARRIVES; the PLACE ────────────────────────────────────────
  - trigger: chapter_start
    slot: "vanilla 0x9BE"
    type: cutscene                    # Cutscene 1 — PRE-MAP (Text_BG). Picks up ch04's thread; NO Ravisin
    ea_file: events/ch05-opening.ea   #   reveal (she stays silent, saved for the eruption).
    description: >
      The party crests the ridge to an iced elven GATEWAY of standing stones (open arch, not a
      door) and the moonlit sunken hollow beyond — the open-air tomb. Lupin reads the moose's
      trail here (ch04 payoff); Marty senses a familiar death-craft and trails off; Pinky spots
      the cornered moose. Then 9BF picks the thread up.
      NB Marty's "...This magic is familiar..." was originally planted to seed a Marty/Ravisin
      villain-foil thread that is now RETIRED (decisions.md 2026-07-29). The line STAYS: a
      spore druid recognising another druid's death-craft needs no thread to be legible, and it
      is what makes him the one who reads this place. It just no longer owes a payoff.
      REOPENED + RELOCKED 2026-07-29: vanilla's 0x9BA slot was folded in here as WOLFRAM's Forge
      seed (Nicolas's call). The scene's shape is "each character reads this place by what they
      personally notice", so Wolfram reading the metal is the same beat as Lupin reading tracks;
      he goes before Marty so the dread and Pinky's alarm stay adjacent and Pinky keeps the last
      word. 7 boxes now, against the twin's combined 3 + 19 = 22, so well inside budget.
      Pinky's "...It's not running. Why isn't it running?!" MOVED to the 0x9C4 trigger beat
      (Nicolas, 2026-07-29) — it is the setup for a joke, and a setup fifteen boxes from its
      punchline is not a setup. He keeps the spotting line, which is the right note to end an
      arrival scene on: the party has found what it came for.
      LOCKED 2026-07-23, extended 2026-07-29 (dialogue-pass, co-written with Nicolas). Hand-boxed
      to GBA width (~29-30 ch/line, 2 lines/box); [A]/[LF] encoding is ROM-gated.
    script:                           # LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas)
      # (Night. An iced elven gateway of standing stones — open arch, no roof, no door — and
      #  beyond it the ground falls into a wide moonlit hollow: the open-air tomb. The moose's
      #  trail leads down into it.)
      - lupin: "The trail leads here. ...It came home."
      # (0x9BA relocated here, 2026-07-29: Wolfram reads the place the way the others do -- by
      #  what he can sense. Senses FIRST, then names it (wolfram.md diction rule). This is the
      #  Forge's on-screen origin; the mechanics get taught separately, see the FORGE TUTORIAL.)
      # (Senses first, then the name (wolfram.md). He deduces ONLY from the metal, and never
      #  claims a who or a when. "TRAINING arena" is a read a metallurgist can actually make
      #  from the WEAR PATTERN: a battle leaves bodies and broken weapons, while thousands of
      #  small chips spread evenly through a floor means repeated, sustained, non-lethal
      #  contact. It is still his inference, not the narrator's fact -- canon built this place
      #  for oratory (lore/sahnar.md §Source canon) and he is a smith, not a historian.)
      - wolfram: "...Hold on. *(sniffs)* Iron. Bronze. Something older I can't name."
      - wolfram: "It's in the stone. Chips of it all through the floor. Blade metal."
      - wolfram: "Struck off edges. There was fighting here -- a great deal of it."
      # (He names the mechanic in-world. NO gear promise -- the arena does not touch equipment.)
      - wolfram: "...This was a training arena. I can get it up and running."
      - marty: "...This magic is familiar..."               # trails off — the hook, never explained here
      - pinky: "Father, I see it! The moose--in the hollow."
    no_lupin_fallback:                # TEXT CHOSEN 2026-07-30 (Nicolas, L3); WIRED 2026-08-13 (#25).
      boxes: [1]                      #   The locked script above is unchanged and still plays
                                      #   whenever the ch04 parley HAPPENED.
      replaces:                       # anchored to the text, so an index cannot silently drift
        - "The trail leads here. ...It came home."
      reason: >-
        Box 1 is the FIRST LINE OF THE CHAPTER and it is Lupin's, so a no-parley player opens ch05
        on a speaker who is not there. PINKY takes it, continuing the tracking thread from ch04's
        own no-Lupin fallback — so the branch reads as one substitution rather than a patchwork of
        stand-ins. He also already closes this scene ("Father, I see it! The moose--in the
        hollow."), which gives him its bookends and keeps the arrival framed as the boy finding
        things his father can use.
      script:
        - pinky: "The tracks stop here, Father. ...It came home."
  # ── 0x9BF + 0x9C0 — CUT 2026-07-29 (Nicolas). 16 boxes buying nothing. ────────
  #  Vanilla's pair is the party OVERHEARING an incident and deciding to investigate. Its three
  #  jobs, and why each is already done or unavailable here:
  #    (1) introduce the recruit-to-be by showing her in danger -> Basil introduces HERSELF in
  #        0x9C2, which is better; watching her bullied first would turn "Oh! Tourists. ...We
  #        don't get many." from a surprise into surveillance and kill the joke;
  #    (2) establish the enemy as lethal in their own words -> we came here to fight, so there is
  #        nothing to establish;
  #    (3) hand the party a moral reason to join a war that is not theirs -> ours have tracked the
  #        moose since ch04 and arrive on purpose. Vanilla needed the stumble as a MOTIVATION
  #        ENGINE (Eirika's people are travellers with no cause); borrowing it would convert a
  #        deliberate hunt into an accident.
  #  The slots' only other job was mechanical -- LOAD1 staging the guardians -- and staging needs
  #  no dialogue.
  #  0x9C1 IS CUT TOO (Nicolas, 2026-07-29) -- the whole overhear-and-react block goes, which was
  #  his original call; CLAUDE argued to keep its 2 boxes and was overruled. Recorded consequence:
  #  NOBODY IN THE PARTY EVER ACKNOWLEDGES the sixteen standing dead, and the player is looking
  #  right at them. That is a real gap, not a neutral saving. It is also cheap to close later
  #  WITHOUT restoring a slot: the moose-trigger beat (0x9C4's position, still unwritten) is the
  #  last thing before the map and can absorb one clause of acknowledgement if we want it. Do not
  #  reopen this as a slot -- fold it there or leave it.
  # ── 9C2 — the recruit reaches the party; BATTLE ───────────────────────────────
  - trigger: chapter_start       # opening event list, ON-MAP (bubbles ≤29 ch/line)
    slot: "vanilla 0x9C2"
    type: cutscene
    ea_file: events/ch05-basil-joins.ea
    description: >
      Party deployed at the stair-foot; the moose at bay; Ravisin a SILENT frost-robed figure at
      center among the risen dead (shown on the map, never narrated). Basil — a GREEN ally shrub —
      trundles up, cracks the tourist joke, notices LUPIN (a fellow awoken creature, now free),
      and the thought dawns → she asks to be brought to Sahnar and JOINS (green → player unit). Her
      "she lost her way" line on Ravisin is DEFERRED to the eruption (once she's formally
      introduced). LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas). Hand-boxed to GBA
      width. Wiring: Basil enters green, converts to a player unit on the join.
      WIRED 2026-08-14 (#25) at host id 0x9EE, no-Lupin arm at 0x9EF. The opening's FIRST on-map
      beat, so it wraps at the talk bubble's 29 and not the backdrop scenes' 42.
      PLACEMENT is the one thing this scene does NOT inherit from its twin. Vanilla plays 0x9C2
      before its prep CALL because it LOAD1s Eirika's group onto the street first; our party is
      placed BY prep (the ally table is never LOADed on a prep chapter), so before the CALL the
      field holds the risen line, Ravisin and a green shrub with nobody to be talking to. The beat
      therefore plays AFTER prep, in vanilla's own after-prep shape — FADU(16), CUMO to the
      speaker, STAL/CURE, then the text — which is exactly what its own 0x9C3/0x9C4 do. It also
      lands adjacent to the CUSA that was already there, so the ask on box 3 and the green→blue
      flip that answers it are one beat instead of two across a screen.
    script:                           # LOCKED 2026-07-23 (dialogue-pass, co-written with Nicolas)
      # (A goodberry shrub — GREEN — trundles up through the snow toward the party.)
      - basil: "Oh! Tourists. In the tomb. ...We don't get many."
      # (Basil notices Lupin — a wolf Ravisin awakened, now traveling free with the party.)
      - basil: "...Wolf. You're hers. Awoken. But you're free? With them?"
      # (The thought dawns; Basil turns to the party and JOINS — green → the party's colors.)
      - basil: "...I wonder. Sahnar. ...She needs me. Take me to her?"
    no_lupin_fallback:                # TEXT CHOSEN 2026-07-30 (Nicolas, L4); BOXED + WIRED
      boxes: [2]                      #   2026-08-14 (#25). The locked script above is unchanged
                                      #   and still plays whenever Lupin WAS recruited.
      replaces:                       # anchored to the text, so an index cannot silently drift
        - "...Wolf. You're hers. Awoken. But you're free? With them?"
      reason: >-
        ch04's Lupin recruit is gated on `parley: by: marty`, and the ch04 difficulty model
        explicitly prices a no-parley path — so a player can reach ch05 with no wolf on the field
        and box 2 has no referent. The fallback moves Basil's trigger from Lupin to the PARTY
        ITSELF: everyone she has ever met belonged to Ravisin, so people who belong to nobody are the
        whole revelation. Arguably the purer version — it needs no other unit to exist.
        Boxes 1 and 3 are unchanged in both branches.
      # ONE replaced box, TWO boxes of substitute — the nested list is the shape that says so.
      # The line was chosen as PROSE and is 74 characters; this scene is the opening's first
      # ON-MAP beat, so it wraps at the talk bubble's 29 and not the backdrop scenes' 42, and it
      # simply does not fit one box. Left flowed, the wrapper picked the A-press for us and put it
      # mid-clause ("You just-- came" / "here. On your own."), which is the failure the reliquary
      # lines already taught: the authored A-press breaks ARE the pacing.
      # BREAK CHOSEN 2026-08-14 (Nicolas): after the shock, not at the sentence boundary. Box 2a
      # is the realisation landing on her; 2b is then one unbroken tumble, which is her register
      # (lore/basil.md §Voice — "runs on when she cares", corpus twin Ewan). Splitting on the full
      # stop instead would have cut the run-on in half and buttoned 2a on "one of you.", which is
      # not where the beat turns. The no-Lupin arm is 4 A-presses against the locked arm's 3;
      # arms are not required to match length, only to each stand up.
      script:
        - - basil: "...You're none of hers."
          - basil: "Not one of you. You just-- came here. On your own."
  # ── 9C3 — the RECRUIT'S OWN scene (vanilla gives Joshua 12 A-presses) ─────────
  - trigger: chapter_start       # opening event list, LAST message -- still before player phase
    slot: "vanilla 0x9C3"
    type: cutscene
    ea_file: events/ch05-sahnar-alone.ea
    description: >
      SAHNAR alone in the sarcophagus — awake, composed after millennia of it (lore/sahnar.md:
      stoic, courtly, never asks to be pitied). Vanilla gives Joshua a whole scene of his own
      before you fight him — his coin, his luck, spoken to nobody — so the recruit is a person
      first and a red unit second. This is that, and it is the ONLY place the player meets
      Sahnar before she walks hostile.
      Constraints that shaped it, all Nicolas's: NO battle noise reaches her (she is under
      stone and the fight is not hers yet — she registers only that something has come);
      SELF-DIRECTED, like Joshua's, not addressed to Basil or anyone; NO proper nouns (name-drops
      from her age never pay off in our story); and her purpose was GIVEN to her by the gods,
      never chosen — the researched lore, not a martyr's bargain. She ends BELIEVING she will
      defend this tomb, which is what makes 9C6 a revelation rather than a rescue: Basil does
      not free a prisoner, he tells her what she is actually defending.
      LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas). 6 boxes.
      WIRED 2026-08-14 (#25) at host id 0x9F0, as a PLAIN ON-MAP BUBBLE — the twin's channel
      taken whole, wrapping at 29. It only became affordable that day: while Sahnar was a
      turn-2 riser there was nothing on the field for a bubble to anchor to, and this scene was
      priced as needing a BACKDROP of its own. Ravisin's scene-3 summon puts her on the arena
      tile from turn 1, so the beat is vanilla's 0x9C3 exactly — CUMO_AT(12, 6), STAL/CURE, the
      LOAD1, then the text — and all six locked boxes survive untouched. The staging shifts and
      the writing does not: "...Someone has come." reads as well standing in the amphitheatre as
      lying under a lid, and she is still speaking to nobody.
      NO no_lupin_fallback: she has never met the wolf and never mentions him, so this is one
      arm and one id.
      ONE BOX GAINED AN AUTHORED A-PRESS, and the wording is untouched — 7 presses, not 6. The
      scene was boxed against the backdrop's 42 and now plays at the bubble's 29, and "No one
      ever came. I stopped counting somewhere in the middle." is 60 characters: it needs three
      lines and a box holds two. Left flowed, the wrapper chose the A-press for us and put it
      mid-clause ("I stopped counting somewhere in the" / "middle."), which is the failure the
      reliquary lines and scene 5's fallback already taught — the authored A-press breaks ARE
      the pacing. Break placed at the full stop, which is also the better read: "No one ever
      came." lands as its own flat beat, and the understatement she is budgeted one of per
      scene ("I stopped counting somewhere in the middle") gets the press to itself instead of
      trailing a sentence it is the punchline to. PROPOSED 2026-08-14 — Nicolas owns where an
      A-press goes (cf. his scene-5 break, which deliberately did NOT fall on the full stop).
    script:                           # LOCKED 2026-07-29 (dialogue-pass, co-written with Nicolas)
      # (Above the sarcophagus now, on the arena tile Ravisin called her up onto in 9BD. She
      #  registers the arrival the way old stone feels a footfall, and speaks to nobody, as

  # ── 0x9CA — vanilla's "escort died" ENDING VARIANT. ADOPTED 2026-07-30. ───────
  - trigger: chapter_end
    slot: "vanilla 0x9CA"
    type: cutscene
    ea_file: events/ch05-ending-basil-lost.ea
    description: >
      ADOPTED (2026-07-30), reversing CLAUDE's earlier "not adopted" — which read it as duplicate
      exposition and missed what it is FOR: it is the reason a player can fail the escort and
      still understand the story. Vanilla ships its ending twice so the plot survives the loss.
      MINED — and the mining is the whole finding, because it shows how CHEAP the branch is meant
      to be. Vanilla's 0x9CA (24 boxes) is not a second scene; it is 0x9C9's back half with a
      different delivery bolted on the front:
        · the same facts arrive in FRAGMENTS, interrupted by the party telling her to stop
          talking ("Stop, you mustn't speak....."), so the player gets less and feels the loss;
        · she dies mid-scene and someone says so flatly ("....She's dead.");
        · then the deliberation runs NEARLY VERBATIM from 0x9C9, with exactly ONE line changed
          to mark what was lost — "If she had lived, we might have learned more, but...." — and
          the closing box repeated word for word.
      Ours does the same, at the same discount: 13 boxes against 0x9C9's 18, and the closing run
      is 0x9C9's own, with Braulo's final box carrying the one changed clause.
      THE CONCEIT IS INHERITED WHOLESALE. Natasha's map death is deferred to the cutscene — she
      is mortally wounded there, whenever she actually fell. Basil is a broken shrub in the snow
      still talking, whether she went down on turn 2 or turn 12. It reads better for a plant than
      it does for a person.
      WHAT THE LOSS COSTS, deliberately: no repot, no pot, no berry. If Basil died before the
      Talk, Sahnar was never recruited (Basil is the only one who can turn her); if she died after,
      she is a party member. Either way she does NOT speak here — see the note below.
      NOT NESTED (2026-07-30): no second conditional for a recruited Sahnar over the body. One
      box from her would be the strongest line in the chapter, and it is deliberately not taken,
      because vanilla's own death branch is a straight line — it exists to carry information, not
      to be dramatised, and doubling the conditionals doubles the wiring for a scene most players
      never see. Recorded rather than dropped: it is cheap to add later if Nicolas wants it.
      Nicolas's two 0x9C9 corrections apply here identically, because this IS that ending:
        · NO MOOSE. It is convertible, so the player may have killed it; the draft had Basil ask
          "did it go?" and Pinky answer that it runs. Cut, same rule as 0x9C9.
        · The hook is the MONSTER only. "...she has many hands" is cut — it framed the lake
          creature as another Child of Auril when per ch06 it is another of Ravisin's victims,
          which would have poisoned ch06's talk-her-down option a chapter early. Basil now reports
          only the order he heard her give.
      Also cut, found while applying those: "Is she still in there? The one under the stone?"
      assumed Sahnar had NOT been recruited, and Basil can die on either side of that. "Tell her I
      had one for her" works in both worlds and is the harder line anyway.
      LOCKED 2026-07-30 (dialogue-pass, co-written with Nicolas) after two red-pen passes.
      10 boxes; twin is 24.
    status: locked                    # ADOPTED + LOCKED 2026-07-30 after two red-pen passes

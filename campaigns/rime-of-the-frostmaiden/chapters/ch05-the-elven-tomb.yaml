      #  29-column wrap, and dropping it also stops two boxes in four opening on the same tic.)
      - ravisin: "I better make sure they don't get to the reliquaries..."
      - ravisin: "No matter. The dead will destroy them first."
      # (9BC callback: "the warrior... the one under the stone", now spent. "BLADE" not "one" --
      #  she appraised Sahnar as a blade in 9BD and still thinks of her as inventory.)
      # TENSE FIXED 2026-08-14 (#25). Was "...And the blade under the stone... I'll use her
      # too." — a promise, which went stale the moment the summon moved into scene 3: she
      # already used her, and the player watched it. Only the tense moves. "The blade under the

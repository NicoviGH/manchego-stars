  # ── 0x9CB — vanilla's ending CODA. FOLDED INTO 0x9C9 (2026-07-30). No separate slot. ──
  # Vanilla's 16-box coda: a townsman recognises Eirika, thanks her for driving off Saar,
  # apologises that he can do nothing for her, and promises the town will "wait unbowed" for the
  # day of liberation. Its job is to make the VICTORY LOCAL — someone who LIVES here says what the
  # win meant, so the chapter ends on a resident's hope rather than on the party's logistics.
  # DECIDED (Nicolas, 2026-07-29): not dropped, folded into the post-battle scenes rather than
  # staged as a separate coda — no inventing a village at a tomb. EXECUTED 2026-07-30 in 0x9C9,
  # and here is where each of the coda's three jobs actually landed, so nobody re-opens the slot
  # looking for them:
  #   (1) a RESIDENT says what the win meant  -> Basil's "...I don't have to prepare her berries."
  #       The hollow is the only place she has ever been; that line is the whole coda in one box.
  #   (2) the resident's own future           -> the repot. Vanilla's townsman apologises that he
  #       can do nothing and stays behind to wait; ours can do something, and comes along. The
  #       coda INVERTED is the strongest use of it available to us.
  #   (3) a second resident, if earned        -> the conditional Sahnar block. Her home, her tomb,
  #       her purpose handed back to her one scene earlier — and it is where the berry finally
  #       gets eaten. Gated on the recruit, so the coda's warmth is something the player wins.
  # Nothing is owed forward. Do NOT restore this as a slot.
# ── Economy (FE8 Ch5 parity — the party's power-spike chapter) ────────────────────
# Ch5's real economy (verified from HEAD via the #170 extractor): ~27,760g across 4 village
# gifts + 2 shops — Guiding Ring 10,000 + Dracoshield 8,000 (Def) + Secret Book 8,000 (Skl)
# + Armorslayer 1,260 + Torch 500, plus an Armory + Vendor. We MATCH the magnitude and the
# delivery channels (this is the first chapter at the FE8-Ch5 reward tier — §Reward budget):
economy:
  reward_sites:                # the "villages" of Ch5, retiled as elven reliquary niches spread to the
                                 # map edges; the eruption's undead race to desecrate them (save-all bonus).
    - gift: booster-def          # ≈ Ch5 Dracoshield (+Def) — first stat-booster in the campaign
    - gift: booster-skl          # ≈ Ch5 Secret Book (+Skl)
    - gift: armorslayer          # ≈ Ch5 Armorslayer (vanilla's answer to its Armor-Knight boss;
                                 #   ours has no armour to slay, so it reads as a plain strong sword)
    - gift: torch                # ≈ Ch5 Torch (flavored an elven everburning lamp)
  elven_store:                   # ≈ Ch5's Armory + Vendor — an ancient elven quartermaster's reliquary
    armory: true                 #   the party requisitions (narrative: the tomb kept its stores)
    vendor: true
  save_all_bonus: guiding-ring   # vanilla Ch5's own save-all-villages reward, kept as itself.
                                 # It is the chapter's promotion FORESHADOW (decisions.md — the
                                 # promotion seam): nobody is near level 10 in the MVP, so it sits
                                 # in the convoy humming, exactly the Chekhov's gun the retired
                                 # "crest of cold iron" was invented to be — except this one is a
                                 # real item, and the player has to save all four sites to get it.
                                 # Items are vanilla's unless there is a reason (Nicolas,
                                 # 2026-08-09); the Goodberry and Tourmaline are the only renames.

# ── Reward sites (the "villages") ────────────────────────────────────────────────
# WIRING for the economy block above. `economy.reward_sites` states the DESIGN; this states
# what the build reads: a tile, and what visiting it hands over. Without this the gifts are
# prose -- `difficulty.py:chapter_economy` counts only `villages[].visit_reward`, which is why
# ch05 priced at 350g against the twin's ~27,760g while the gifts were "already decided".
# TILES are vanilla Ch5's own village coordinates, preserved by the retile (the map carries
# TERRAIN_VILLAGE_REGULAR on exactly these four -- see decisions.md, a retile inherits vanilla's
# terrain). Placement is vanilla's, not ours, the same call as ch04's cottage.
# `assert_village_tiles_visitable` rejects any of these standing on scenery.
# THE RESIDENTS ARE THE TOMB'S OWN DEAD (Nicolas, 2026-08-08). No village at a tomb, so the four
# sites are answered by four risen elves, not villagers. WHY THEY HELP YOU WHEN THE REST OF THE
# TOMB ATTACKS: Ravisin's waking caught these four WRONG -- they came back as themselves, with
# memory, and they resent what she is doing to their house. That is the same mechanism as Sahnar
# (woken, misled, never bound -- lore/sahnar.md) and as ch04's pack ("all it took was knowing they
# had a choice"), so the visits quietly pre-load the proof Basil later spends on Sahnar in 0x9CC.
# It is stated ONCE, in two lines, and never explained: reliquary-east's "Some of us put them
# down" and reliquary-south's "Some of them liked being told".
#
# TIMELINE -- THE ERROR THIS BLOCK EXISTS TO PREVENT (Nicolas caught it in draft, 2026-08-08):
# they have been DEAD four thousand years and AWAKE about two. Ravisin woke them with the
# Everlasting Rime, which is two years old (ch00/ch01 both state it; opening-montage.yaml: "not
# felt the warmth of the sun in over two years"). An earlier draft had all four narrating four
# millennia of experience, which is FALSE and, worse, hands out Sahnar's one defining trait --
# she alone was awake for it, and that ordeal IS her character. Every resident here dates from
# the WAKING ("two winters on my feet"), and the contrast is now load-bearing in the mage's
# "His sister was awake the whole time. ...Don't ask." -- it establishes her ordeal before you
# meet her, from someone who would know.
#
# PACING: 25 boxes across four sites against vanilla Ch5's own 26 (mined from HEAD, 6/7/6/6).
# Box lengths are UNEVEN on purpose -- vanilla drops to a one-line box for punctuation ("Ah, but
# I'm an old man now...", "Please, traveler, take this sword.") and a set of identical two-line
# boxes reads as monotone. Every handover gets its own box, as three of vanilla's four do.
# LORE RIDES UNDER CHARACTER, not over it: vanilla spends its village budget on somebody's small
# private business (a packing list, an old man's vanity, a dancer's over-tipping), so each of
# ours is interrupted mid-task and the tomb's history arrives only where the task produces it.
# Orem/the amphitheatre come from lore/sahnar.md §Source canon; Corellon, Arvandor and Ostoria
# stay OFF the page as before -- named as events ("a god took him up alive"), never as proper
# nouns the story cannot pay off. Ravisin is never named: they were asleep, they don't know it.
villages:
  - id: reliquary-north            # vanilla Ch5 village (5,1)
    tile: [5, 1]
    visit_reward:
      - id: torch                  # = Ch5's Torch, reflavoured an elven everburning lamp.
        amount: 1                  # Vanilla's own gift for THIS tile -- see the note below.
    # LOCKED 2026-08-08 (dialogue-pass, co-written with Nicolas). Speaker: the CANTOR, who sang
    # here when the place was an amphitheatre. Private business = warming up; the lore ("tiers all
    # the way up that wall") arrives because he is SINGING, not because he is explaining.
    # THE LAMP IS ESTABLISHED BEFORE IT IS GIVEN (Nicolas: "the torch comes out of nowhere") --
    # it is the venue's own stage lighting, a hundred along the rim, exactly as vanilla folds its
    # Torch into Amelia's packing list rather than producing it cold.
    # Box 4 is vanilla-register: FE8 says "sleep" for death, never the blunt word ("I can only
    # grant you eternal sleep" / "I cannot sleep. I have not yet--", MSG_BAA), and Lyon will not
    # say "dead" of himself ("I'm almost completely gone", MSG_BBC). An earlier "Then I was dead.
    # Then I wasn't." was cut as off-register and too clipped for the FE8 script.
    visit_text:
      - "Stand there. Just there. ...Yes. That's where the sound gathers."
      - "I sang here. Right here. Tiers of them all the way up that wall, and me below."
      - "Lamps all along the rim, a hundred of them. Elven work. They don't go out."
      - "Then I slept. ...Not long enough, as it turns out."
      - "Two winters on my feet, and the witch has not once asked me for a song."
      - "...Take a lamp. Nobody's sitting up there to need it. Say something on your way out."
  - id: reliquary-west             # vanilla Ch5 village ~(5,6)
    tile: [5, 6]
    visit_reward:
      - id: booster-skl            # = Ch5's Secret Book (+Skl)
        amount: 1
    # LOCKED 2026-08-08 (dialogue-pass, co-written with Nicolas). Speaker: the MAGE, the tomb's
    # archivist. Register twin is vanilla's own Secret Book village (MSG_9CF): an old man who only
    # mentions his life's knowledge because he is afraid it dies with him, and hands over a book
    # he wrote for that reason. Ours has the same engine -- he is evacuating the archive because
    # the party is about to fight in it, which is what makes Orem come up at all (Nicolas: "he
    # kinda brings up the chieftain out of nowhere"). Box 2 sets the stakes box 7 pays off.
    # 7 boxes against vanilla's 6, deliberately: the extra box buys "He came back dead."
    visit_text:
      - "Mm. Visitors. Don't touch the-- ...you touched it. It's fine."
      - "You'll be fighting in here, I expect. ...Everyone always fights in here."
      - "It's a history. This house, and the man they built it for. Orem."
      - "A god took him up alive. They raised the seats for him to come back and tell it."
      - "He came back dead. So: a tomb."
      - "We all woke two winters ago. His sister was awake the whole time. ...Don't ask."
      - "Take the record with you. If the roof comes in, I'd rather it weren't under it."
  - id: reliquary-east             # vanilla Ch5 village ~(12,10)
    tile: [12, 10]
    visit_reward:
      - id: armorslayer            # = Ch5's Armorslayer. We field no armour, so it reads as a
        amount: 1                  #   plain strong sword (see economy.reward_sites).
    # LOCKED 2026-08-08 (dialogue-pass, co-written with Nicolas). Speaker: the QUARTERMASTER, who
    # woke up and went straight back to counting stock. Register twin is vanilla's own Armorslayer
    # village (MSG_9CD), the one site that is plainly useful: it states what the weapon does in
    # flat words ("It'll cut through even the strongest armor") and sends you off. Ours does the
    # same. A draft ended on "It remembers bigger things" -- cut 2026-08-08 (Nicolas: "sounds
    # silly"); it was mood-narration in a quartermaster's mouth, which the craft check calls dead.
    visit_text:
      - "Weapon check. Hold it up. ...Mm. That'll do for people."
      - "We came north out of the giants' camps, the lot of us. Carried this rack with us."
      - "Witch woke me two winters back, put a spear in my hand, pointed me at the door."
      - "Some of us put them down."
      - "Take this instead. Armorslayer. It'll go through the heaviest plate they've got."
      - "Sign for it. ...I'm joking. Go on."
  - id: reliquary-south            # vanilla Ch5 village (12,19)
    tile: [12, 19]
    visit_reward:
      - id: booster-def            # = Ch5's Dracoshield (+Def). First stat-booster in the campaign,
        amount: 1                  # and vanilla puts it HERE on purpose -- see the note below.
    # LOCKED 2026-08-09 (dialogue-pass, co-written with Nicolas). Speaker: the one who talks too
    # much and buries the lede. The handover carries NO tactical advice (Nicolas: "the instructions
    # are a bit on the nose... vanilla is more subtle"); vanilla's dancer gives no usage note at
    # all, only her own reason for parting with it, so his is that it has sat on a stand since
    # before he was bones -- which also ties this site back to the mage's Orem.
    #
    # DO NOT WRITE A CHARACTER OUT OF AN ASSET FILENAME (Nicolas, 2026-08-09). A cut box read
    # "Don't mind the grin. It's the face I've got." -- a reaction to this mug being named
    # `Skeleton (Full Smile)`. That name is a VARIANT LABEL, not an expression: the file differs
    # from reliquary-east's by 65 pixels of lower jaw (east is missing teeth, this one is not), and
    # every skull shows its teeth regardless. A skeleton remarking on his own grin is remarking on
    # nothing. What replaced it does the same job -- defusing "you are a skeleton and I am not" --
    # from the character's side: he asks whether he is frightening them.
    #
    # WHY THE WAKING BEAT IS NOT HERE: two boxes ("She opened every box in this house and left all
    # the lids off" / "Some of them liked being told") were cut 2026-08-09 as duplication --
    # reliquary-east already carries the waking and the refusal, and the fact lands harder stated
    # once. This site is the shortest of the four now, and that is fine: it is pure character.
    #
    # The "shouting outside" is a second, quieter warning, and it is now literally true: this is
    # the site the turn-2 raiders spawn beside, and it is the one `ch05raid` watches fall. It was
    # written to promise nothing back when the race was prose; the race is wired (#25), so the
    # line stands as-is and simply means what it says. The loud warning is Ravisin's, in host
    # message 0x9E4 (the beat mined from vanilla 0x9C5).
    visit_text:
      - "Hello! Hello. Oh, you're warm. Nothing has been warm in two years."
      - "Sorry. Sorry. I'll slow down."
      - "I'm not frightening you, am I."
      - "There's a great deal of shouting outside, by the way. I should have led with that."
      - "Orem's shield-plate. It's been on a stand since before I was bones. Take it."
      - "Go on. ...I'd like you to win. I'd like very much for you to win."
# WHICH GIFT SITS ON WHICH TILE IS VANILLA'S, NOT OURS (corrected 2026-08-07, decomp-verified via
# each village script's SVAL(EVT_SLOT_3, <item id>)). booster-def and torch were swapped, which read
# as harmless -- same four items, same total, and the parity gate counts the SET, not the tiles --
# but it inverts the chapter's risk/reward. (12,19) is the SOUTH-EAST site, and the turn-2 eruption
# pair spawns at (14,16)/(14,15), right beside it: vanilla puts its RICHEST gift (Dracoshield,
# 8000g) on the site the first raiders reach, and its cheapest (Torch, 500g) at (5,1), which sits
# behind the whole enemy line and is the safest on the map. Swapping them pays the most for the
# safest errand, which is exactly backwards for a chapter whose structure IS the race for the
# reward-sites. The placement is vanilla's, like every other placement on this retile.
# THE RACE (#25). Each site carries an event id -- CH05_VILLAGE_FLAGS, EVFLAG_TMP(9..12) -- and
# that one number is the whole mechanism. `Village(eid, ..)` puts it on BOTH the visit and the
# destruction LOCA one tile north, so reaching a site first both banks the gift and disarms the
# raider hook; a site that falls instead flips to ruins (ch05_map_changes) and never sets its id.
# The save-all-four bonus is NOT a visit_reward -- it is handed out at the ENDING, gated on all
# four ids, exactly as vanilla does it (`economy.save_all_bonus` is its declaration).
# Proven in-engine by `ch05raid` (a site CAN be lost) and `ch05crest` (all four pays out); the
# two exist because ch05village/ch05reliquaries only ever walk a unit to a door.
# All four `visit_text` blocks are WRITTEN and LOCKED (2026-08-08), and all four speak with a
# FACE over BG_INTERIOR_BROWN -- the FE-Repo Eden/L95 skeleton mugs, dressed onto collision-free
# vanilla slots by `inject_ch05_visit_faces` (the chwinga pattern).

# ── Post-Chapter ─────────────────────────────────────────────────────────────────
post_chapter:
  gold_reward: 350
  available_shops: [elven-reliquary]   # the in-tomb elven store (Armory + Vendor); see economy block
  units_available_to_recruit:
    - id: sahnar                         # Myrmidon (sword duelist); see npcs/sahnar.yaml
      description: "Sahnar (she/her), the reawakened elven royal — a moon-elf mummy, recruited via Basil's Talk (the Joshua beat). Playable Myrmidon."
    - id: basil                          # Cleric — 2nd healer (role LOCKED 2026-06-20, class 2026-08-08); see npcs/basil.yaml
      description: >
        Basil, the sentient goodberry shrub — now a PLAYABLE healer (Cleric). Her
        Goodberries are the cosmetic skin on a vanilla heal staff; she is also the
        in-fiction source of the party's reflavored Vulneraries in the shop.
  unlocks_chapter: ch06-the-maer-monster

design_notes: >
  Our FE8 Ch5 (The Empire's Reach) 1:1 — DefeatBoss, retiling Ch5's open spread field as an
  elven-tomb depression and emulating its two memorable set-pieces (decisions.md 2026-07-15):
    - The Natasha→Joshua escort → BASIL (Natasha-donor Cleric) chaperoned to Talk SAHNAR
      (Joshua-donor Myrmidon), who rises as a hostile crit-threat and flips on the Talk. The
      donors were chosen for exactly this; the escort defines how you play the map.
    - The village-raid race → the Phantom-Ship ERUPTION (injected EARTHQUAKE/TILECHANGE)
      spawns undead over turns that raid the spread elven-reliquary reward-sites, on vanilla
      Ch5's own raider AI; securing all four earns vanilla's own Guiding Ring at the ending.
  Ravisin is the canonical frost druid and the villain thread tying the white moose (ch04) →
  this tomb → Messie (ch06): she awakened them all. She DROPS NOTHING, as vanilla Ch5's boss
  does not (the chapter has zero droppers); the promotion Chekhov's gun for the Ch8→9 seam is
  the save-all Guiding Ring, which the player has to race for. Basil joins as our second healer (Cleric) —
  the goodberry shrub as a literal heal-staff unit (LOCKED 2026-06-20). No fog: the tension is
  the escort + eruption race, not vision. Map + roster build at the slice; targets checked via
  `make difficulty` (economy #170 + convertible/reinforcement dynamics #171).
  ENEMY IDENTITY (rev.2, 2026-07-23): the force is RISEN ELVEN TOMB-GUARDIANS on vanilla FE8
  infantry classes, skinned undead (the ch01 "vanilla class, our skin" pattern via
  enemy_class_reskins). This keeps ch05 the TOMB (the dead) and OFF ch04's turf (the wolf hunt):
  wolves are CUT, the lone beast is the cornered White Moose (ch04 payoff). Living-class stats
  also mean clear-load parity is free (no glassy monster-class doubling; decisions.md). Per-unit
  `skin:` names the intended FE-Repo asset (sword/bow guardians = real skeleton anims; lance/axe/
  armor = frost palette-swaps) for the build-slice art track. The wolf ANIMS I scouted (Gwyllgi
  repals, Hellhounds) are logged for CH04's beast pack — see issue #24.

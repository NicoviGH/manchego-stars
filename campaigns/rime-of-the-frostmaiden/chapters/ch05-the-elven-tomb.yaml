# ── Narrative ──────────────────────────────────────────────────────────────────
narrative: >
  The white moose's trail ends at an ancient elven tomb — the refuge of Ravisin, an
  acolyte of Auril who awakens the wild and raises the frozen dead to serve the
  Frostmaiden's endless winter, snuffing every warm hearth clinging to the ice (the
  same druid who awakened Messie, out in Maer Dualdon). Cornered at last, the moose
  makes its stand beside her, and Ravisin fights to the death for her goddess. When
  she tears the tomb open she WAKES its guardian — Sahnar, an ancient elven royal left
  awake and watching for millennia — who comes willingly, believing the party are the
  intruders she was left to stop. She is MISLED, not puppeted. The party turn her by
  chaperoning the goodberry shrub, Basil, across to tell her the truth. They repot Basil
  and take her along, and turn down the coast toward Bremen.

# ── Map ────────────────────────────────────────────────────────────────────────
map:
  file: maps/ch05-the-elven-tomb.mar
  tileset: port-or-town-winter  # vendored FE-Repo winter port/town chips (#25); stem 'PortTown'
  size: "15×21"                 # 1:1 retile of the vanilla Ch5 layout — terrain drift vs vanilla: 0
  vanilla_layout: Ch5Map        # what the retile repaints; a retile INHERITS vanilla's terrain
  # DESIGN CONSTRAINT (decisions.md): retile Ch5's OPEN spread-village field, not an enclosed
  # ship/corridor. Both features that make Ch5 play like Ch5 survive the retile intact, because
  # the terrain is vanilla's byte-for-byte:
  #  (1) reward-sites SPREAD to the corners — the four VILLAGE_REGULAR tiles still sit at
  #      (5,1) (5,6) (12,10) (12,19), so the party must SPLIT and race; here they are elven
  #      reliquary niches the eruption's dead raid (see `villages:` below);
  #  (2) OPEN lanes so our mounted units (Baxby, Lupin) matter (a corridor neuters cavalry).
  # The other named tiles vanilla put on this field and we inherit: ARMORY (2,1), VENDOR (6,10),
  # and ARENA_REGULAR (12,6) — the arena tile the arena-wager debut above is wired to.
  # Impassable is FENCE_REGULAR + TILE_2E (the pillar/statue rings); the two halves of the field
  # meet at the open row-15 corridor and the four STAIRS at (1,14) (3,14) (9,14) (10,14).
  description: >
    An open-air elven tomb — a snowy sunken depression ringed by crystal pillars and
    statues (cover/chokepoints), NOT a claustrophobic crypt. The moon dial sits at
    center, the gazebo brazier to one side, the sarcophagus on the eastern berm.
    IT WAS AN AMPHITHEATRE FIRST — CANON, verified 2026-07-29. RotFM: the site was built
    as an amphitheatre so Orem could tell the elves of his ascension, and was refashioned
    into his tomb when he died (lore/sahnar.md §Source canon). Not invented to justify an
    arena tile: the geometry above is already amphitheatre-shaped (a sunken bowl, rings of
    pillars and statues, a dial at the focus), so our shape matched the canon before we
    knew the canon. Wolfram finds it by metal-sense in 0x9BE; decisions.md §Economy carries
    the full call. CAVEAT: canon's amphitheatre was built for ORATORY. Wolfram calling it
    an arena is an INFERENCE from the only evidence he has — chips struck off blade edges,
    therefore blades met here — and he is a smith, not a historian. He never claims to know
    who fought, why, or that anyone trained. Keeping it his deduction rather than the
    narrator's assertion is what lets our arena and the canon both stand.
    Ravisin holds the central depression with the cornered white moose; risen elven
    tomb-guardians (spear-guards, axe-reavers) clog the approaches. Elven reliquary niches are
    spread to the map's edges (the reward-sites the eruption's dead race to desecrate). Open
    lanes between the pillars keep cavalry relevant. ENTRANCE = an open elven GATEWAY (a worn
    arch / standing stones at the rim), descending a stair into the open-air hollow — NOT a
    door into an enclosed crypt (ch04's "worked door" reads as this gateway).

# ── Objective ──────────────────────────────────────────────────────────────────
objective:
  type: defeat_boss                      # our FIRST clean boss kill (objective rotation — see decisions.md)
  description: "Defeat Ravisin, the frost druid (her guardians and the moose needn't all fall)"
  secondary:
    - type: talk_recruit
      description: >
        Recruit Sahnar the Joshua way (this IS Ch5's memorable beat). Sahnar rises as
        a HOSTILE guardian — a fast, crit-threat Myrmidon mummy (killing-edge, Joshua's
        exact donor), WOKEN by Ravisin and fighting of her own will in the belief that she is
        finally doing her duty — and the only way to turn her is to walk fragile BASIL up to her
        to Talk (Basil is our Natasha: her exact donor, a frail Cleric). Only Basil can turn her,
        because Sahnar does not weigh the argument — she RECOGNISES the arguer (9C6: her purpose holds,
        her enemy resolves). So you must chaperone a weak healer across the depression to the
        deadly duelist, clearing a safe pocket first — the escort-recruit that defines how
        you play Ch5. Optional; free her and she fights the back half (recruit swing
        ~+1.0 kills/round, #171).
    - type: brazier_flavor
      description: >
        The gazebo brazier (silver flame) is RAVISIN'S INSTRUMENT, not the eruption's flavour
        — she is standing at it when she calls Sahnar up in scene 3 (`vanilla 0x9BD`), before
        the party ever reaches the hollow. Re-pointed 2026-08-14 (#25) when the summon moved
        off the turn-2 quake and onto the screen: the brazier stopped being an unattended
        atmosphere prop and became the thing the villain uses. Still optional set-dressing on
        the map itself, and still not the recruit gate (superseded by the chaperone Talk
        above; see decisions.md).

win_condition: boss_defeated
lose_condition: all_player_units_defeated

difficulty_note: >
  Our first real boss. Roster GROUNDED (rev.3, 2026-07-23, #25) to the FE8 Ch5 bar — verdict
  PARITY (within band): threat/slot 12.4 (x1.08) · clear-load/slot 4.8 (x0.84); ours reads
  line 16 · reinf 6 · convertible 1 — the twin's structure exactly, with Sahnar the one true
  convertible (Basil's Talk). The force is RISEN
  ELVEN GUARDIANS on vanilla FE8 infantry classes, skinned undead — the ch01 "vanilla class,
  our skin" pattern. Because the stats ARE living-class stats, clear-load parity comes for
  free: the earlier glassy problem (undead monster classes get doubled → die in 1 round;
  decisions.md) doesn't arise.
  COMPOSITION tracks the twin, not just the totals (2026-07-23): Soldier 6, Archer 3,
  Mercenary 1, Myrmidon 1 match Ch5 exactly, and the axe block is 10 of 23 (~43%) against
  vanilla's 11 (~48%, its 6 Brigands + 5 Fighters) — Ch5 is an AXE-HEAVY map and that shapes
  the weapon triangle the player actually plays against, which the per-slot averages can't see.
  Ravisin is a vanilla FE8 Druid — heavy dark-magic (FE MAG vs RES) at 1-2 range — so
  squishy/low-RES units must respect her threat range; the pillars give cover to bait her out.
  She carries a PERSONAL boss line (see her entry) putting her at ~13.4 rounds to kill, the
  vanilla Saar bar. Two Ch5 dynamics do the real work and pay the STATIC bar DOWN:
    - CONVERTIBLE Sahnar (the Joshua flip): a hostile crit-Myrmidon until Basil Talks
      her, then a +1.0 kills/round ally for the back half. Self-balancing risk→advantage.
    - REINFORCEMENT eruption: the dead arrive over turns (arrives_turn), not a turn-1 alpha —
      so the turn-1 threat reads 9.9 (≈ vanilla's 9.0), below the static 12.7.
      SAHNAR IS NOT ONE OF THEM (2026-08-14, #25 — Ravisin summons her in scene 3), and the
      re-price this looked like it owed turns out to be ALREADY PAID: `difficulty.py`
      (`_split_force`) buckets a `convertible: true` enemy before it ever reads `arrives_turn`,
      and the turn-1 field is `line + convertibles` — so the model has been pricing her as
      present on turn 1 the whole time. `make difficulty CH=ch05` after the move: line 15 ·
      reinf 6 · convertible 2 · turn-1 9.9, byte-identical, verdict still PARITY. The
      comparison is also honest in both directions, which #25 doubted: vanilla's own 9.0
      counts Joshua the same way, off its CHAR targets. What actually changed was this note's
      CLAIM — it used to say Sahnar arrived with the eruption, and the number never agreed.
      Her `duelist_hold` AI never moves either, so what she adds is threat the player chooses
      to walk into rather than threat that comes to them.
    - Untapped headroom: Lupin (+1.0) is a clean all-chapter combatant the static party
      number (6.27) omits; Basil is the fragile recruiter, not a fighter.
  No fog — the tension is the escort + the eruption race, not obscured vision. Keep it a
  clean DefeatBoss so Ravisin is the climax. (Playtest remains the arbiter; the static bar
  is a proxy — spatial check + `--ch05-boot` playtest still owed at the build slice.)

# ── Deployment ──────────────────────────────────────────────────────────────────
deployment:
  prep_screen: true            # STANDING PROTOCOL since ch01, not a per-chapter call and NOT a
                               # divergence: decisions.md "How the deploy cap + prep screen are
                               # actually wired" (2026-06-10) -- "the cap is the parity; Pick Units
                               # only chooses which PCs fill it". Vanilla Ch5 has no PREP macro and
                               # force-deploys its nine; we field the same NINE and let the player
                               # pick them. Mechanism: CALL(EventScr_08591FD8) (the shared
                               # CLEAN/PREP/CLEAN script) at the end of the beginning scene; the cap
                               # is the ally UnitDefinition table's entry count.
                               # Do NOT consult `hasPrepScreen` in chapter_settings.json to answer
                               # this -- that field is DEAD (FE7 leftover, chapterdata.h:37) and
                               # reads false for every chapter, including ones that plainly have
                               # prep. It is registered in check.py DEAD_CONCEPTS for that reason.
  deploy_limit: 9              # = vanilla FE8 Ch5's 9 player slots (fe8-pacing-reference.md §1b,
                               # decomp-verified). A DIFFICULTY lever, not a map count — the field
                               # size is set by parity, and the map is painted to provide 9 start
                               # tiles (decisions.md §Field parity). Grounds the /slot parity read.
  note: >
    Deployable pool by Ch5: 7 PCs + Pinky + Baxby (Cav) + Trex (Thief) + Lupin
    (beast-Cav, won in ch04 — a clean all-chapter combatant, +1.0 kills/round the static
    party number omits). Basil (Cleric) is present from the start as the fragile RECRUITER
    (must be fielded and protected to Talk Sahnar — the Natasha role), NOT a fighter.
    Sahnar is NOT in the starting field — she rises mid-combat as a HOSTILE convertible
    (the Joshua flip) and joins only once Basil Talks her. With deploy_limit 9 and a pool
    of 10 (7 PCs + Pinky + Baxby + Trex + Lupin, minus Basil-as-recruiter tradeoffs), the
    player leaves one unit home — a real cut for a boss chapter.
  deploy_slots:                # vanilla Ch5's OWN nine player start tiles (UnitDef_Event_Ch5Ally),
                               # lifted 1:1 like every other placement on this retile. Vanilla
                               # force-deploys exactly nine here and our cap is nine, so the tiles
                               # and the cap agree without tuning either. They form the south
                               # pocket (rows 16-19, x 3-7); the party leaves it through the row-15
                               # corridor and the four stairs, which is the chapter's approach.
    - [6, 17]                  # lord tile (vanilla Eirika's)
    - [5, 18]
    - [5, 16]
    - [4, 19]
    - [3, 16]
    - [6, 19]
    - [7, 18]
    - [4, 17]
    - [3, 18]

# ── Enemy Units (vanilla FE — grounded to FE8-Ch5 parity, #25) ────────────────────
# Grounding pass rev.2 (2026-07-23): the force is now RISEN ELVEN TOMB-GUARDIANS on the
# vanilla FE8 infantry classes (Soldier/Fighter/Mercenary/Archer/Armor-Knight/Myrmidon) —
# the same "vanilla class, our skin" pattern ch01 uses (goblin-skinned Soldiers/Fighters,
# campaign.yaml `enemy_class_reskins`). Two payoffs:
#   1. PARITY BY CONSTRUCTION — living-class stats ARE the vanilla Ch5 twin's stats, so the
#      glassy monster-class problem (mogall/revenant get doubled → die in 1 round; decisions.md
#      "undead reskins read glassy") simply doesn't arise. The Armor-Knight is the Def-sink the
#      undead palette couldn't produce.
#   2. STORY SEPARATION FROM CH04 — ch04 is the BEAST chapter (the wolf hunt, Marty's parley).
#      ch05 is the TOMB: the dead, not more wolves. Ravisin awakened the living in ch04; here she
#      has raised the DEAD (an escalation). Wolves are CUT (2026-07-23, Nicolas). The lone beast
#      is the White Moose — the ch04 quarry finally cornered (payoff, not a repeat).
# Structure preserved: 16 line + 6 eruption reinf + 1 convertible (Sahnar) = vanilla's line 16 ·
# reinf 6 · convertible 1. Weapons modeled via `inventory.fe_base`; eruption tagged
# `arrives_turn` (#177); Sahnar `convertible` (#171). No item drops — the Ch5 twin carries none.
# Per-unit `skin:` = the intended reskin for the ART track (build-slice: rides
# `enemy_class_reskins` in campaign.yaml + inject_enemy_class_battle_anims). `source:
# palette_swap` = frost/pale recolour of the vanilla frame (no FE-Repo undead anim in that
# weapon mode); a "FE-Repo: …" source = a borrowable custom anim (all [U] free-to-use).
enemy_units:
  # ── The boss: Ravisin, frost druid (holds the northern rim) ─────────────────
  # PLACEMENT, here and below: every line unit stands on one of vanilla Ch5's OWN sixteen
  # fighting tiles, one-for-one. Vanilla parks its line off-field and walks it in via REDA,
  # so the tile to lift is the REDA DESTINATION, not the .xPosition (which is a staging tile
  # like (10,0) or (0,0) for seven different units). Same call as the reliquary sites and
  # ch04's cottage: on a 1:1 retile the placement is vanilla's, not ours — which is also what
  # keeps `make difficulty CH=ch05` measuring the twin it claims to.
  - id: ravisin
    name: "Ravisin"
    is_boss: true
    count: 1
    positions: [[13, 1]]        # vanilla Saar's GuardTile destination (REDA_088B5540) — TERRAIN_ROAD,
                                # which is what the boss-archetype note below already assumed
    class: druid                # vanilla FE8 Druid (baseRanks: Anima D, Dark C, Staff E)
    level: 7
    weapon: flux-tome           # FE8 Flux (Dark) — the Druid's class-native tome; flavored "Killing Frost"
    inventory:
      - id: killing-frost
        fe_base: flux           # FE8 Flux — dark magic (FE MAG vs RES) at 1-2 range
    damage_type: cold           # flavor label only
    ai_pattern: hold_position   # = vanilla Saar's GuardTileAI posture (decomp: .ai {GuardTileAI,0x9,0x20})
    boss_tile: moon_dial        # she holds the moon dial at the centre — retiled as a dais
                                # (flavour + AI anchor; NO terrain bonus, see below)
    personal:                   # FE8's OWN boss mechanism — a named boss is class base + a
      baseHP: 15                # personal line. Vanilla Saar is an Armor Knight *plus*
      baseDef: 5                # HP+13/Pow+6/Skl+5/Spd+3/Def+2/Res+3/Lck+4; that line is most
      basePow: 4                # of why he reads as a wall. This puts Ravisin at ~13 rounds to
      baseSkl: 3                # kill — Saar's bar — while she stays a Druid with Flux and her
      baseRes: 3                # existing art. Zero art cost, no custom class, pure vanilla.
      baseLck: 3
    # BOSS-ARCHETYPE NOTE (2026-07-23, decomp-verified — supersedes the throne/bodyguard fix):
    # FE8 has NO tanky mage class (best magic Def is 5: Sage/Mage-Knight/Gorgon, all 10% Def
    # growth), so swapping her class can't work. But the class was never the reason vanilla
    # bosses are walls — the PERSONAL LINE is. Saar also stands on TERRAIN_ROAD (checked, not
    # assumed): his wall is 100% class+personal, ZERO terrain. So:
    #   - NO throne tile. Personal Def and terrain STACK: HP+15/Def+5 on a throne makes her
    #     undentable by the parity yardstick (inf). One lever, not two.
    #   - NO armour bodyguards. With a real boss line the `frost-sentinel` scaffolding is
    #     redundant (removed 2026-07-23, Nicolas) — the boss carries her own fight.
    death_quote: "Auril… I gave you everything…"
    skin:
      # APPROVED 2026-08-10 (Nicolas): Garytop's F2E Aversa mug, exact palette edit only.
      # Silver hair -> auburn/chestnut; warm skin -> frost-pale. Preserve the original brown
      # face/chest markings, black feather mantle, crown, expressions, geometry and alpha.
      # Regenerate with portraits/ravisin.py; no generative artwork and no pixel reshaping.
      look: "Ravisin, frost druid (auburn hair, frost-pale skin, black feather mantle)"
      source: "FE-Repo Aversa {Garytop} [F2E] — deterministic hair/skin palette swap"
    map_sprite:                 # SHIPPED (map_sprites/ravisin{,_mu}.png); palette by Nicolas
      base: Druid               # read for FRAME SIZE ONLY (16x16). The wait row's first field
                                # is `pattern`, which the decomp calls unused and the injector
                                # writes as 0 — so the vanilla Druid row being 2-frame while
                                # this sheet is 3 is not a conflict.
      source: "Druid Hoodless (F) {Ultra-Fenix, Velvet Kitsune} — FE-Repo Map Sprites/Magi - Dark-Type"
      recipe: >
        vendored whole, converted onto the cast palette (map_sprite_tool.recolour), then
        final index swaps applied by Nicolas in map_sprite_swapper to match the BATTLE ANIM:
        black robe (cast idx 1/2), near-white skin (4), auburn hair (8). Chosen HOODLESS on
        purpose — her bust and her battle anim both are, and the stock CLASS_DRUID sprite is
        a hooded man, which is the mismatch this closes.
      palette: cast             # she never changes faction (hostile from spawn, never
                                # recruited or converted), so nothing is lost by leaving the
                                # faction ramp — and only the cast bank holds her exact
                                # black/white/auburn. Bound via gMapPaletteOverride on her RAW
                                # pid, like the moose; see SCRIPTED_NEUTRAL_SPRITES.
      credit: "Ultra-Fenix, Velvet Kitsune (FE-Repo); see CREDITS.md"
    # She fought as vanilla's MALE druid — a hooded man under a woman's bust — until this landed.
    # There is no Aversa battle animation in the FE-Repo (the whole 2006-entry index was searched),
    # so this is a STAND-IN picked against the bust (Nicolas, 2026-08-16): loose auburn hair, no
    # hood, and the same source game as the portrait. Rejected: `[Custom Magi] [F] Witch {Pikmin}`
    # (auburn too, but a pointed hat her bust has not) and `[T2 Druid-Base] Vanilla FE6 [F]` (her
    # exact tier, but fully hooded). Vanilla's own CLASS_DRUID_F is a real second animation
    # (0x79/0x7A vs the male's 0x77/0x78) and costs nothing — also hooded, which is why it lost.
    # PALETTE: hand-edited to the BUST, not to a faction ramp (Nicolas, 2026-08-17, in
    # tools/banim_palette.py). She fights in a BLACK robe over near-white skin, which is her
    # portrait's own spec -- "frost-pale skin, black feather mantle" -- and her auburn hair is
    # untouched, that being the entire reason this anim was chosen over the hooded finalists.
    # Only five of the fifteen entries move: the robe ramp (1/2/3) and the skin pair (4/5).
    #
    # Two things NOT to redo here:
    #   * The author's own "enemy" swatch was tried and REJECTED on sight. It is index-aligned,
    #     so swapping it looked free -- but the art does not use those indices the way the swatch
    #     suggests, and it turns her HAIR TEAL. `docs/demo/ch05-ravisin-anim-palette.png`.
    #   * The robe ramp must stay a RAMP. A first edit set 1/2/3 to one flat black and 4/5 to one
    #     flat white; the fold shading died with it and the spell fan -- indices 2/3 also draw the
    #     cast FX, not just cloth -- became a solid void. Same failure class as the rejected Arena
    #     palettes, one axis over: those crushed CHROMA, this crushed VALUE. Distinct ramp entries
    #     merging into one is what kills form either way.
    battle_anim:
      clone_from: druid           # the AnimConf to clone + which slots to repoint; see BANIM_DONORS
      abbr: ravisin
      import:                     # a REAL FE-native animation, transcribed whole (feditor_to_banim)
        txt: ravisin/Magic.txt    # ...bound per-CHARACTER via _u25, like Sahnar's and Pinky's:
        frames_dir: ravisin       # NEVER at CLASS_DRUID, which future frost druids also use
        palette_edit: ravisin/palette.json   # recolours the agbpal ONLY; frames stay native
    # NO DROP, and that is vanilla's answer rather than an omission: Ch5 has ZERO droppers in the
    # whole chapter, Saar included — killing the boss pays in winning. Ravisin used to carry a
    # `drops:` block naming a "crest of cold iron"; the injector reads `item_drop:` and never saw
    # it, so it was decoration that read like wiring. The promotion foreshadow it was invented for
    # is now the save-all bonus (see `economy.save_all_bonus`), which is where vanilla puts the
    # chapter's one relic and makes it something the player has to EARN.
  # ── The cornered white moose (the LONE beast — ch04 quarry) ─────────────────
  # ROLE FIX 2026-07-23: was `is_boss: true`, which INVERTED the chapter's climax — at
  # threat 14.1 it out-threatened Ravisin (8.4) 1.7x and was 2.2x the vanilla Ch5 ceiling
  # (6.3), so the "boss" was a speed bump next to it. Level nerfs don't help (gwyllgi is
  # Spd 14, doubles everything: even L2 = 11.8). So it keeps its terror and changes ROLE:
  # a NAMED MINIBOSS (vanilla Ch5 precedent: CHARACTER_BANDIT_CH5, a named non-boss threat)
  # that is CONVERTIBLE — killing Ravisin breaks her hold and it stops fighting. The player
  # chooses: fight an 11.8-threat monster — the hardest single unit on the map — or push the
  # objective and let it be. Rewards going for the throat: leaving the moose alive IS a payoff,
  # on the map, in play. It is NOT priced as avoidable (`convertible: false`) — the previous
  # chapter is named after this animal, so the model must assume the fight happens.
  # It was briefly 24.6 (HellFang) and that ALONE was the chapter's entire parity overage:
  # x0.97 without the moose, x1.20 with. One unit carrying 20% of a 23-enemy force's threat is
  # not a monster the aggregate can absorb — the band merely hid it (2026-08-15, Nicolas).
  # NB the ending (0x9C9) must never mention the moose -- the player may simply kill it, so no
  # cutscene may assume it survived (Nicolas, 2026-07-30).
  - id: white-moose
    name: "The White Moose"
    is_miniboss: true           # named, dangerous, NOT the win condition (objective = Ravisin)
    count: 1
    positions: [[10, 0]]        # the north rim, penned against the top edge and inside Ravisin's
                                # guard cluster — "cornered" as the map description has it, and the
                                # one vanilla tile the player cannot reach without committing north
    # ── Scene 7's wordless beat: the moose breaks, in three legs ──────────────
    # Lengthened 2026-08-15 (Nicolas): the first cut dropped four tiles straight down the x=10
    # lane, which was over almost before it read. It now starts in the top-RIGHT corner, runs
    # LEFT along the rim and then turns DOWN through its pen at the party — a longer path, and
    # one that turns on screen instead of travelling in a straight line.
    # THE FIGHT STILL STARTS AT (10,0). This is a cutscene lunge, not a placement: the moose is
    # put on `charge_from` off camera before the beat and snapped back to `positions` after it,
    # so the parity read stays grounded on the locked pen (threat 14.1, cornered).
    charge_from: [14, 0]        # the top-right corner. Free at turn 1 — (13,0)/(14,1) are the
                                # turn-2 archer spawns and nothing stands here before then.
    charge_route:               # authored legs, not a pathfinder's guess: the PATH is the beat.
      - [10, 0]                 #   left along row 0 — the only walkable stretch of it (x=10..14;
                                #   x=1..8 are TERRAIN_2E pillars and x=9 is impassable), and it
                                #   passes through the pen it will be hauled back to
      - [10, 4]                 #   then down the open x=10 lane at the party. Rows 0-7 of that
                                #   column are all plains and unoccupied — (9,4) holds a
                                #   spear-guard, (10,4) does not.
    class: gwyllgi              # CLASS_GWYLLGI (FE8 beast) stand-in quadruped
    level: 6
    inventory:
      # ITS OWN BEAST LINE'S weapon, under its vanilla NAME. Two separate corrections landed here
      # on 2026-08-15, both Nicolas's:
      #
      # 1. It had carried `rotten-claw` — ITEM_MONSTER_ROTTENCLW, the REVENANT's claw, which is
      #    why ch04's three Revenants hold it. A Gwyllgi swinging a Revenant's weapon, spotted
      #    off a combat frame reading "Rotten Claw". A different creature's gear entirely.
      # 2. The obvious fix, HELLFANG (the Gwyllgi's own, 13 mt), made the moose 24.6 threat —
      #    20% of the WHOLE chapter's threat in one unit, and single-handedly the entire parity
      #    overage (x0.97 without it, x1.20 with). See the difficulty_note.
      #
      # FIREFANG is the Mauthe Doog's, and the Mauthe Doog is this creature's own unpromoted
      # tier — `data_classes.c` has CLASS_MAUTHEDOOG.promotion = CLASS_GWYLLGI. So this is the
      # beast's own line at the lower tier, NOT a foreign class's weapon: it answers correction
      # 1 as fully as HellFang did, and answers 2 as well. 5 mt / 90 hit / wt 5 puts the moose
      # at 11.8 threat and the chapter at x1.08.
      # NOT renamed to "Antlers": one name message per item id, so retitling would burn
      # "Fire Fang" for every future Mauthe Doog, and unwired today is not never.
      - id: fire-fang
        fe_base: fire-fang
    damage_type: bludgeoning    # flavor label only ("antlers/hooves")
    ai_pattern: aggressive
    convertible: false          # #171 — a difficulty-model flag. `difficulty.py` reads it to
                                # exempt a unit from the role-inversion check and to apply
                                # CONVERT_CLEAR_DISCOUNT (0.5) to clear-load, and BOTH would be
                                # lies here: the moose is not recruitable, never changes faction,
                                # and is only "avoidable" in the sense that a player COULD walk
                                # past it. THE PREVIOUS CHAPTER IS NAMED AFTER THIS ANIMAL
                                # (Nicolas, 2026-08-15) — a party that has just spent a whole map
                                # hunting it is going to fight it, so pricing it at half
                                # clear-load models a game nobody plays.
                                # Sahnar is ch05's ONE true convertible (Basil's Talk, the Joshua
                                # flip), which restores the twin's exact structure: line 16 ·
                                # reinf 6 · convertible 1. The old `true` reported 15/6/2.
                                # It also un-suppresses a real warning — the moose out-threatens
                                # Ravisin — which was true at the old Revenant claw too and had
                                # simply been exempted. See decisions.md.
                                # NOT a parley: this previously carried a `parley: by:
                                # ravisin_death -> become_neutral` block (removed 2026-07-31,
                                # Nicolas), which promised an on-screen conversion the chapter can
                                # never show — win_condition is boss_defeated, so the map ENDS the
                                # moment Ravisin falls, with no post-death state to convert into.
    # NO death quote, and no bust: it is a moose (Nicolas, 2026-08-15). It never speaks in
    # either chapter — ch05's one wordless beat is scene 7's charge, which is staged with a
    # full-screen CG and a cry, not a text box. Nothing consulted the quote this block used to
    # carry (ch05's dialogue all comes from the locked events source), and the 96x80
    # portraits/white-moose.png stays unwired.
    skin:                       # the one beast; closes YAML TODO #38/#39 (read as elk, not wolf)
      look: "the White Moose — a great pale elk"
      # Map sprite + portrait are **Wyrdeer** (Anarlaurendil, DeviantArt, CC BY-SA 3.0) — see
      # chapters/ch04-the-white-moose.yaml `art:` for the full recipe and for why it rides the
      # CAST palette rather than the faction-tinted standard SMS one. The earlier "Gwyllgi frost
      # repal" plan is retired: the FE-Repo has NO elk art (docs/fe-repo-scouting.md).
      # LIVE IN CH05 SINCE 2026-08-14, and it was NOT before, though this block said "SHIPPED
      # 2026-07-31" for a fortnight. The art shipped; the WIRING was ch04's alone. Sprite tables
      # are keyed on pid, a pid is per-chapter, and ch05's moose (0xb9) was in neither override
      # row — so it rendered CLASS_GWYLLGI's stock hound on the red enemy palette while this
      # comment claimed an elk. Spotted by Nicolas off a playtest frame. The registry now takes

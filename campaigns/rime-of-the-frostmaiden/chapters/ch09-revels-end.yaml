design_notes: >
  Fort Rigwald played in reverse: the party starts where Rigwald's enemies start, deep in the
  keep by the cells, and fights out toward the edge vanilla's army enters from. Other indoor
  maps (It's a Trap!, Father and Son) stay options until the chapter is drafted.
plan:
  location: "Revel's End, the prison on the Sea of Moving Ice coast"
  story: >
    The low point, then the climb back. The escape starts with Marty and Braulo's isopod
    (lore/marty.md) and the riot is Meesmickle's signature beat (roadmap). Gant's cell is the
    coup mirror (Rime p.160).
  sources:
    - "DM notes: the party wakes on the way to Revel's End"
    - "Table: Marty feeds the isopod, it steals the keys; Meesmickle's riot (lore/marty.md, roadmap)"
    - "Rime p.160-161: Prisoner 237, Vaelish Gant"
  joins_roles:
    - "Tana (flier; starts recruited in a cell, as Rigwald does it): the griffon rider, a fellow prisoner"
    - "Amelia (trainee, talk recruit): a Revel's End guard who defects"
  payload_notes: >
    Owes vanilla Ch9 (Ocean Seal, Killing Edge, Axereaver, Elfire, Speedwing; Dragonshield,
    Rapier and Angelic Robe through villages), vanilla Ch8's undelivered chests (Angelic Robe,
    Silver Sword, Elysian Whip; a Lockpick to steal; a Door Key), the 5,000G route-split gift
    (lordsplit-eventscript.h:33), and the first Master Seal (ADR 0155). Vehicles: the warden's
    confiscation vault (chests) and fellow prisoners' cells (visits). The Rapier is Eirika's
    personal weapon: its stand-in comes from the legendary-weapons plan for the chosen lord.
  how_it_plays: >
    Rigwald has no time pressure: every reinforcement is triggered by where you go, and it is
    the first map with an enemy sleep staff. A methodical, cell-by-cell breakout.
  introduces:
    - {concept: promotion-master-seal, where: "the first seal, looted in the breakout"}
    - {concept: trainee-classes, where: "the defecting guard (Amelia's role)"}

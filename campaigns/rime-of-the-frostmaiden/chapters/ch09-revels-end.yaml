title: "Revel's End"
chapter_number: 9
status: planned
milestone: M4
cadence: breakout
fe8_base_map: "FE8 Ch9 Ephraim — Fort Rigwald (layout only, played in reverse)"
parity_reference: "FE8 Ch9"   # the twin is the chapter NUMBER (#459): Distant Blade's force
narrative: >
  The party wakes in Revel's End, the most secure prison in Faerûn, sentenced for the Bremen
  coup by the Council of Speakers. Marty breaks off a piece of himself to feed Braulo's isopod,
  and the isopod comes back with the guard's keys. Meesmickle starts a riot that covers the
  escape. Vaelish Gant sits in another cell for trying to topple a Speaker, the same crime the
  party is jailed for.

# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
events:
  - trigger: chapter_start
    type: cutscene
    ea_file: events/ch07-opening.ea
    description: >
      On the map (Nicolas, 2026-10-12). The surviving boat(s) and Messie come up the inlet to
      the first bridge, the docks. ch06's ending forks it on 0xFC (Grynsk) and 0xFD (Tali): each
      crew's lines play only if that hull came home, and neither line leans on the other, so
      any of the four cases reads whole. Lost crews get no acknowledgement (Nicolas).
      Dorbulgruf comes down from the hall, about to praise the party until he sees Messie. He
      accuses them of breaking the agreement and bringing a killer into Bremen. Braulo takes the
      insults to Messie personally; Wolfram readies for a fight. Meesmickle, Sclorbo and Rootis
      (who abstained at the table) appeal to Marty, who says this time talk won't reach him.
      Braulo snaps: Bremen will get a reasonable Speaker. Dorbulgruf threatens his axe, Wolfram
      bites a chunk out of it (his secondary signature beat, moved here from a battle quote),
      and the Speaker retreats to the hall. Both sides keep a fair claim, so the chapter stays
      gray. Grynsk and Tali wear their ch06 boarding faces.
    script:                           # LOCKED 2026-10-12 (dialogue-pass, Nicolas's revision)
      # ── A: the docks (on the map) ──
      # (The camera follows the surviving boat(s) and Messie up the inlet to the first bridge:
      #  the docks. One boat, two, or Messie alone, per ch06's 0xFC/0xFD.)
      # ── A1: only if Grynsk's boat came home (0xFC) ──
      - grynsk: "Solid planks under my boots. Never thought I'd miss these docks."
      - grynsk: "Forty years I've fished this lake."
      - grynsk: "They caused us trouble, sure, and we took out some of theirs as well."
      - grynsk: "But this winter they came at the crews like sharks. Never seen them like that."
      # ── A2: only if Tali's boat came home (0xFD) ──
      - tali: "I... I don't even know where to start."
      - tali: "I went out for a few sketches. Maybe some notes on how it feeds."
      - tali: "But you brought it HOME. Alive. And it turns out it's intelligent?!"
      - tali: "I have SO MANY QUESTIONS."
      - messie: "We can speak later, little one."
      - tali: "(muttering in Elvish) Interesting... fascinating... remarkable..."
      # ── B: the Speaker comes down ──
      # (Dorbulgruf comes out of the hall and walks down to the docks. Messie is out of his
      #  line of sight until the cut.)
      - dorbulgruf: "You! You came BACK?"
      - dorbulgruf: "Ha! I had you lot down for fish food!"
      - dorbulgruf: "Well, I'll be. Maybe I was wrong about you. You're a formidable--"
      - stage_cut: he sees Messie
      - dorbulgruf: "......"
      - dorbulgruf: "What is that THING doing in my harbour?!"
      - braulo: "He is an ancient creature of this lake, and he is to be respected."
      - braulo: "He's been protecting your boats from the merfolk."
      - dorbulgruf: "Protecting-- It's been smashing them all winter!"
      - dorbulgruf: "You led it to my town, alive!"
      - dorbulgruf: "You broke the agreement! Not one copper, you hear me?"
      - dorbulgruf: "You've brought a killer into Bremen! It'll drown us all in our beds!"
      - messie: "I don't want to drown anyone."
      - dorbulgruf: "It TALKS?! ...Bah! The ability to speak does not make you intelligent!"
      - braulo: "He's done far more for Bremen this winter than you have."
      - dorbulgruf: "How dare you! Do you know how much I've sacrificed?!"
      # ── C: the abstainers appeal to Marty ──
      - rootis: "Please, everyone. Let's calm down. We can talk through this."
      - meesmickle: "Marty. You talk to monsters. Talk to this one."
      - sclorbo: "(Sclorbo turns to Marty, pleading.)"
      - marty: "......"
      - marty: "...Not this time..."
      - marty: "His heart's been poisoned by fear. This was always going to end in a fight."
      - meesmickle: "...Wonderful."
      # ── D: Braulo snaps ──
      - braulo: "Enough. If you won't be reasonable, Bremen will get a Speaker who is."
      - dorbulgruf: "You want my chair? Seventy years I've held it!"
      - dorbulgruf: "Come and take it, then! You'll taste the cold steel of my axe first!"
      # ── E: the bite ──
      - stage_cut: Wolfram smiles, steps forward, and takes a big chomp out of the axe (crunch SFX)
      - wolfram: "(crunch) ...Mmm... Dwarf-forged steel. Good stuff."
      - dorbulgruf: "My AXE! You-- you ATE my--"
      - dorbulgruf: "Guards! GUARDS! Bremen, to arms! Hold the hall!"
      # ── F: the harpoon launchers (vanilla Ch7's ballista talk, MSG_A00/A01) ──
      # (He backs off, runs up to the hall and takes the door, and orders the launchers manned.
      #  This replaces Murray's turn-1 rally (0x9FF) and sits where vanilla plays its ballista
      #  talk: at the END of the opening, before prep, so RBG's suggestion can still be acted on.
      #  Vanilla gates Neimi's offer on her being deployed; RBG is a PC who always speaks, so his
      #  box is a suggestion to deploy him instead (Nicolas, 2026-10-12). Every mode: vanilla
      #  calls it through EventScr_CallOnTutorialMode, which we drop, as ch05's arena does.)
      - dorbulgruf: "Man the harpoons! Put a bolt through that beast, and anyone who stands with it!"
      # (Camera flashes each launcher: (2,10), then (17,8). Then back to the party.)
      - wolfram: "(sniffs) Spring steel and tarred rope. Harpoon launchers."
      - wolfram: "They bolted those on to kill Messie. They'll go through us just as easy."
      - prof-rbg: "Um, actually-- they're ballistae, modified for harbour work."
      - prof-rbg: "They outrange any bow, and they'll punch through armour like cheesecloth."
      - prof-rbg: "But they only carry so many bolts. Keep to cover and let them run dry."
      - prof-rbg: "Better still, bring me along. Clear one of its crew, and I'll turn it on them."
      # (Prep, then battle.)
  - trigger: chapter_end
    type: cutscene
    ea_file: events/ch07-ending.ea
    description: >
      Messie installed as Speaker; an uneasy, hopeful town. His first decree is a FISH TAX
      (the table's own moment): comic, the party trades a look, and it is his plan to pay
      the merfolk in fish and keep the peace without a war.
      Then his farewell carries the campaign's first big-picture reveal, in the seat vanilla
      Ch7's ending gives Orson (an insider hands the heroes information and a direction).
      He has talked with the merfolk all along, and he tells the party what they told him
      the Frostmaiden asked of them: keep the fishers afraid until Bremen prays to her and makes its offerings.
      RBG lays that beside what the party has seen (the sacrifice lotteries, Ravisin's
      wolves and moose): Auril's servants are turning the Dale against its own towns to
      make them worship her. Her weakness (the Rime drains her, Rime p.274) stays secret;
      the merfolk were never told it (ADR 0332).
      The party leaves in a trail of blood to a mixed reception. A town crier mentions that
      Easthaven has heard about Bremen, which seeds ch08's ambush.

  # ── 0xA02 -- BOSS TAUNT. One box, in Murray's seat. ─────────────────────────

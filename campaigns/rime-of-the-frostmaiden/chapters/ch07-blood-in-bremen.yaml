# chapters/ch07-blood-in-bremen.yaml
# Chapter index: docs/CHAPTERS.md (generated from this file). Rationale: docs/decisions.md.
# Combat is vanilla FE (see docs/decisions.md §Combat). damage_type labels are cosmetic.

id: ch07-blood-in-bremen
title: "Blood in Bremen"
chapter_number: 7
status: planned                # brainstorm SEED, NOT authoritative: enemy roster/levels/beats are
                               # re-grounded against vanilla + party data when the slice is reached
                               # (brainstorming skill digests this). Exempt from the parity gate until then.
milestone: M3
cadence: big_battle_gray        # see docs/CHAPTERS.md — 🟥 (morally gray)
fe8_base_map: "FE8 Ch6 — Victims of War"            # DefeatBoss base
parity_reference: "FE8 Ch7"   # the twin is the chapter NUMBER, whatever map it borrows (#459)

# ── Narrative ──────────────────────────────────────────────────────────────────
narrative: >
  The party reports back to Speaker Dorbulgruf Shalescar, an old shield-dwarf who hired them
  to kill the lake monster. They tell him the monster was protecting his fishers and the
  merfolk were the killers. He has spent the winter watching that monster smash Bremen's
  boats, and he is too old and too stubborn to believe them: the beast lives, so he owes
  them nothing. Braulo swings first. Mid-fight, Wolfram bites a chunk clean out of the
  Speaker's steel axe in open defiance, and the old dwarf keeps swinging the ruined haft.
  After a bloody battle through the Town Hall, the party installs Messie as the new
  Speaker of Bremen. His first decree is a fish tax, which leaves the party wondering what
  they have done; it is also how he means to keep the merfolk fed and calm without a
  fight. Before they go, he tells them what the merfolk told him about the Frostmaiden's
  orders. The party leaves town in a trail of blood to a mixed reception.

# ── Map ────────────────────────────────────────────────────────────────────────
map:
  file: maps/ch07-blood-in-bremen.tmx
  tileset: town-interior        # Speaker's hall + streets
  size: "22×18"
  description: >
    Bremen's Town Hall and the surrounding Five-Tavern Center — five taverns in a
    semicircle around a central yard (book layout, Bremen p.27). The party fights up
    through the tavern yard to the Town Hall dais where Dorbulgruf holds court.
    Civilian NPC units mill in the streets and hall; guards defend the dais. Tavern
    doorways, fences, and furniture as cover.

# ── Objective ──────────────────────────────────────────────────────────────────
objective:
  type: defeat_boss                      # mirrors FE8 Ch6 "Victims of War" = DefeatBoss
  description: "Defeat Dorbulgruf (his guards needn't all fall)"
  constraint:
    type: protect_civilians
    description: "Civilians are 'don't-kill' NPC units — killing them incurs a penalty (gold/reputation)"

win_condition: boss_defeated
lose_condition: all_player_units_defeated

difficulty_note: >
  Morally gray chapter — the party is the aggressor. The civilian no-kill
  constraint adds spatial care to an otherwise straightforward fight. Dorbulgruf
  is a sturdy Warrior-class boss but not a puzzle. Dialogue should sit in the
  ambiguity, not celebrate.

# ── Deployment ──────────────────────────────────────────────────────────────────
deployment:
  note: "Deployable pool: 7 PCs + Pinky + Baxby (Cav) + Trex (Thief) + Lupin (beast-Cav) + Sahnar (Myr) + Basil (Cleric), capped by deploy_limit (TBD). Only the pack direwolves stay non-combat dressing. Positions set in Tiled."

# ── Enemy Units (vanilla FE) ─────────────────────────────────────────────────────
# Grounding: Bremen "can muster up to 25 soldiers (tribal warrior stat block) and 2
# veterans" (book, Bremen p.27). FE-scaled: the 6 guards are that militia; the 2 Hall
# Knights are the book's 2 veterans.
enemy_units:
  - id: bremen-guard
    name: "Bremen Guard"        # the town militia (book: tribal warriors, FE-scaled from 25)
    count: 6
    class: soldier
    level: 7
    weapon: iron-lance
    damage_type: piercing       # flavor label only
    ai_pattern: defensive
  - id: bremen-knight
    name: "Hall Knight"         # the book's 2 Bremen veterans — the real threat besides the boss
    count: 2
    class: armor-knight         # CLASS_ARMOR_KNIGHT (no plain CLASS_KNIGHT in FE8)
    level: 8
    weapon: steel-lance
    damage_type: piercing
    ai_pattern: hold_position
  - id: dorbulgruf
    name: "Dorbulgruf Shalescar"
    is_boss: true
    count: 1
    class: warrior              # a non-combatant commoner in the book, but his old strength
    level: 9                    # outlasted his mind — still a formidable axe-Warrior boss.
    weapon: steel-axe
    damage_type: slashing
    ai_pattern: hold_position
    death_quote: "A monster... for Speaker... You've doomed us all..."   # SEED; his disbelief, to the last

# ── Civilian NPCs (don't-kill) ────────────────────────────────────────────────────
npc_units:
  - id: bremen-civilian
    count: 4
    behavior: flee_from_combat
    must_not_be_killed: true
    penalty_if_killed: { gold: -100, reputation: -1 }

# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
events:
  - trigger: chapter_start
    type: cutscene
    ea_file: events/ch07-opening.ea
    description: >
      The party reports to Dorbulgruf, who hired them in ch06's opening (ADR 0332). They
      tell him Messie was protecting the boats and the merfolk were sinking them. He does
      not believe a word of it: he has watched the beast ram his town's boats all winter,
      and the beast still lives. No carcass, no coin. Braulo answers in his own terms (we
      did the work; that was the deal) and swings first (braulo_first_swing). Both sides
      have a fair claim, which is what keeps the chapter gray.
  - trigger: unit_engages_boss
    unit: wolfram
    target: dorbulgruf
    type: battle_quote
    ea_file: events/ch07-wolfram-axe-bite.ea
    description: >
      Wolfram's secondary signature beat: when he engages Dorbulgruf, he bites a chunk
      out of the Speaker's steel axe in defiance (he eats ore and metal — see his Ch3
      primary). Defiant flavor; the formidable old dwarf keeps swinging the ruined haft.
  - trigger: chapter_end
    type: cutscene
    ea_file: events/ch07-ending.ea
    description: >
      Messie installed as Speaker; an uneasy, hopeful town. His first decree is a FISH TAX
      (the table's own moment): comic, the party trades a look, and it is his plan to pay
      the merfolk in fish and keep the peace without a war.
      Then his farewell carries the campaign's first big-picture reveal, in the seat vanilla
      Ch7's ending gives Orson (an insider hands the heroes information and a direction).
      As Speaker he has talked to the merfolk, and they told him what the Frostmaiden asked
      of them: keep the fishers afraid until Bremen prays to her and makes its offerings.
      RBG lays that beside what the party has seen (the sacrifice lotteries, Ravisin's
      wolves and moose): Auril's servants are turning the Dale against its own towns to
      make them worship her. Her weakness (the Rime drains her, Rime p.274) stays secret;
      the merfolk were never told it (ADR 0332).
      The party leaves in a trail of blood to a mixed reception. A town crier mentions that
      Easthaven has heard about Bremen, which seeds ch08's ambush.

# ── Post-Chapter ─────────────────────────────────────────────────────────────────
post_chapter:
  gold_reward: 450
  available_shops: [bremen]
  units_available_to_recruit: []
  unlocks_chapter: ch08-the-eastway-ambush

# ── Signature Moment anchored here ───────────────────────────────────────────────
signature_moments:
  - pc: wolfram
    trigger: wolfram_axe_bite       # SECONDARY — see pcs/wolfram.yaml (primary = ch03 ore-snacking)

design_notes: >
  The party's darkest MVP choice. Lean the dialogue into the dispute: Dorbulgruf hired them
  to kill a beast that still lives, and the party ended the sinkings, which was the real job.
  Each side has a case, and the party still cuts down a stubborn old man in his own hall.
  Don't resolve who was right. Civilian no-kill constraint is the design hook. ONE ending.
  The town crier's Easthaven line seeds the ch08 ambush (word of Bremen traveled).

  cases:
    # The chapter-generic Status-screen capture, on this chapter's own boot: the title card
    # as the ROM draws it, which is the only colour that counts (the card file holds indices).
    - {name: ch07titlecard, proves: "the Status screen draws ch07's title card, in the ROM's own colours", lua: ch07titlecard, kind: record}

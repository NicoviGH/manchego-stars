    script:                           # LOCKED 2026-10-12 (dialogue-pass, Nicolas)
      - dorbulgruf: "You'll not have my hall! Not while I've half an axe left!"
  # ── 0xA03 -- BOSS DEATH. One box. ─────────────────────────────────────────────
  - trigger: boss_death
    slot: "vanilla 0xA03"          # data_battlequotes.c (Murray's pair)
    type: quote
    description: >
      His disbelief, to the last: a monster for Speaker. LOCKED 2026-10-12 (dialogue-pass,
      Nicolas). 1 box.
    script:                           # LOCKED 2026-10-12 (dialogue-pass, Nicolas)
      - dorbulgruf: "A monster... for Speaker... You've doomed us all..."

  # The houses give nothing, as vanilla Ch7's (`Text_BG(BG_HOUSE, ...)` only), and each keeps its
  # vanilla seat's job. Measured against the 192px helpbox.
  - trigger: visit
    tile: [1, 15]               # vanilla Ch7's west house: `House(0, EventScr_089F2E6C, 1, 15)`
    type: house
    description: >
      Vanilla's MSG_A06 seat: gossip about the power behind the boss (Tirado plotting behind
      Valter). Here a fisher's wife: the Speaker means to start Bremen's sacrifice, putting the
      fires out for the Frostmaiden (warmth is Bremen's offering, Rime pp.21, 27). It keeps the
      fight gray. Cut to vanilla's own shape: two facts, a hedged rumour ("Who knows,
      though..."), a short piece of advice. LOCKED 2026-10-12 (Nicolas's revision). 4 boxes.
    script:                           # LOCKED 2026-10-12 (dialogue-pass, Nicolas's revision)
      - fisher-wife: "Dorbulgruf has been the Speaker for over seventy years."
      - fisher-wife: "He's supposed to look after Bremen... Who knows, though..."
      - fisher-wife: "He projects strength, but rumours say he's ready to bend to the Frostmaiden."
      - fisher-wife: "Start the sacrifices, snuff out our fires. I'd keep a blanket handy, if I were you."
  - trigger: visit
    tile: [17, 21]              # vanilla Ch7's south-east house: `House(0, EventScr_089F2E94, 17, 21)`
    type: house
    description: >
      Vanilla's MSG_A07 seat: a missing person and a half-seen commotion (Ephraim). Here Cora
      Mulphoon, innkeeper of Buried Treasures (Rime pp.27-28), who apologises at the slightest
      thing. Her son Huarwar came home with a chardalyn dagger and left with two tieflings
      wearing the Knights of the Black Sword's chardalyn sword amulets, for "their castle":
      Caer-Dineval. A live hook: the table played it, and the book carries it (pp.38-39;
      docs/roadmap.md). Vanilla's shape: rambling, trailing off, a sad button.
      LOCKED 2026-10-12 (Nicolas's revision). 5 boxes.
    script:                           # LOCKED 2026-10-12 (dialogue-pass, Nicolas's revision)
      - cora: "Oh! Travellers! Sorry, the inn's a mess... It's been hard since my Huarwar left..."
      - cora: "He came home from a blizzard with a dagger of black ice..."
      - cora: "Then two tieflings came, wearing necklaces like little black swords..."
      - cora: "I heard them say they were going to Caer-Dineval..."
      - cora: "If you're ever out that way, would you look for him?"


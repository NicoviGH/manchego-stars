# ── Narrative ──────────────────────────────────────────────────────────────────
narrative: >
  The party brings Messie back to Speaker Dorbulgruf Shalescar, an old shield-dwarf who hired
  them to kill the lake monster, hoping to broker peace. They tell him the monster was protecting his fishers and the
  merfolk were the killers. He has spent the winter watching that monster smash Bremen's
  boats, and he is too old and too stubborn to believe them: the beast lives, so he owes
  them nothing. In the argument the party proposes Messie for Speaker. Braulo swings first.
  Mid-fight, Wolfram bites a chunk clean out of the Speaker's steel axe in open defiance,
  and the old dwarf keeps swinging the ruined haft.
  After a bloody battle through the Town Hall, the party installs Messie as the new
  Speaker of Bremen. His first decree is a fish tax, which leaves the party wondering what
  they have done; it is also how he means to keep the merfolk fed and calm without a
  fight. Before they go, he tells them what the merfolk told him about the Frostmaiden's
  orders. The party leaves town in a trail of blood to a mixed reception.

# ── Map ────────────────────────────────────────────────────────────────────────
map:
  # ADR 0339 (Nicolas, 2026-10-10): vanilla Ch7's own layout (Ch7Map, 20x22), reskinned to
  # winter, as ch02/ch04/ch05 reuse their twins. The keep is the Town Hall on a rocky point; the
  # moat is Bremen's harbour inlet, where Messie and the surviving boats sit as green units; the
  # two bridges are its piers. Ch7 has no shoreline, so "docks" is this reading of the moat.
  file: maps/ch07-blood-in-bremen.mar  # compiled by import_map_layout from the Ch7Map reskin
  tileset: snowy-bern           # + the castle ported from snowy-fields and LAKE water (ADR 0341)
  size: "20×22"
  description: >
    From Bremen's docks up to the Town Hall. The party lands in the south-west and fights
    across open ground and over the two piers to the hall's door, which the Speaker holds.
    Vanilla Ch7's two ballistae are Bremen's harpoon launchers, bolted on to kill Messie.


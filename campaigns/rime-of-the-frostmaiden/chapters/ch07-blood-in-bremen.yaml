# ── Narrative ──────────────────────────────────────────────────────────────────
narrative: >
  The party brings Messie back up the inlet to Bremen's docks, with whichever crews they saved.
  Speaker Dorbulgruf Shalescar, an old shield-dwarf who hired them to kill the lake monster,
  comes down ready to praise them until he sees the beast alive in his harbour. He has spent
  the winter watching it smash Bremen's boats: the party broke the agreement and brought a
  killer into town, and he owes them nothing. Braulo takes the insults to Messie personally;
  even Marty says fear has put Dorbulgruf past talking. Braulo says Bremen will get a Speaker
  who is reasonable, Dorbulgruf threatens them with his axe, and Wolfram bites a chunk out of
  it. The Speaker retreats to his hall and orders the harpoon launchers manned.
  After a bloody battle through the Town Hall, the party installs Messie as the new
  Speaker of Bremen. His first decree is a fish tax, which leaves the party wondering what
  they have done; it is also how he means to keep the merfolk fed and calm without a
  fight. Before they go, he tells them what the merfolk told him about the Frostmaiden's
  orders. The party leaves town in a trail of blood to a mixed reception.


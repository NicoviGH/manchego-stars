# ── Narrative ──────────────────────────────────────────────────────────────────
# REFRAMED 2026-08-29 (Nicolas). Messie is NOT the antagonist and is NOT a fight: the
# merfolk are. He sank Bremen's boats to keep their crews off water the merfolk control --
# clumsy protection, which the town read as a monster. Canon supports this rather than
# bending it (Rime pp. 28-31): the plesiosaurus "recognizes boats from Bremen but does not
# attack indiscriminately", "prefers to dine on fish, not people", was told by Ravisin only
# to SPREAD FEAR among the fishers, and its whole behaviour table is boat damage. Tali's own
# deduction is that ONLY Bremen boats were attacked. The Pronged Goat "was found by fishers
# the next day, drifting crewless" -- a marooned Bremen boat is the book's own image.
narrative: >
  Bremen sends the party onto the frozen mouth of Maer Dualdon to bring back two boats
  that went out and never came home. The lake around the docks is frozen solid -- the
  fishers pull their rowboats up onto the ice -- so the party walks out across it, into
  water the merfolk consider theirs. The merfolk are what has been sinking Bremen's
  crews. Messie, the awakened plesiosaur the town blames for it, has been ramming those
  same boats to turn them back before they reached deep water. When the merfolk are
  broken, he hauls himself up onto the ice, and Marty and Braulo find out what he is:
  a creature Ravisin woke, ordered to frighten the fishers, and who has been quietly
  disobeying her by protecting them instead.

# ── Map ────────────────────────────────────────────────────────────────────────
map:
  file: maps/ch06-maer-monster.mar     # compiled by import_map_layout; .tmx is never produced
  tileset: snowy-bern-ice       # snowy-bern + Nicolas's ice palette + ch06's own metatiles, all
                                # in slots snowy-bern declares unused. The core tileset and every
                                # map already shipped on it stay byte-identical (ch04 rides it).
                                # NOT snowy-fields: that was the seed's guess, decided against
                                # once snowy-bern won the look (decisions.md, the ice ADR).
  size: "22×22"                 # Ch13EphraimMap; 137 TERRAIN_RIVER in concentric channels
  description: >
    The frozen mouth of Maer Dualdon, 22x22. Concentric channels of cracked-open water ring
    the map, crossed at eight points; everything else is walkable lake ice. Two marooned
    fishing boats sit in ice outcrops at opposite corners -- the Burly Ram east (17,12),
    the Pronged Goat west (4,17). Each outcrop is a POCKET: the eight cells around the hull
    keep the donor's impassable TILE_2E, so the only ground entrance is the door directly
    south -- (17,13) and (4,18). A six-cell ice shelf holds the map's centre, reachable on
    foot only over the bridges at (8,11) and (10,14).
  # FE-native terrain, grounded in fireemblem8u/include/constants/terrains.h. The lake is
  # FROZEN: every combatant walks. Only the ring channels are open water.
  terrain_mechanic:
    lake_ice: TERRAIN_PLAINS      # 0x01 -- 255 cells; the frozen surface everyone fights on
    channels: TERRAIN_RIVER       # 0x10 -- 136 cells; impassable to our foot/armour/horse
                                  #         classes, cost 2 to Braulo (Pirate) and 5 to Trex
                                  #         (Thief), 1 to Pinky. The party's three answers.
    crossings: TERRAIN_BRIDGE_REGULAR  # 0x13 -- 7 bridges + one BRIDGE_SNAG = 8 crossings
    snow_drifts: TERRAIN_FOREST   # 0x0C -- 27 cells, +20 avoid / +1 Def, cost 2. Two of them
                                  #         are each boat's own cell and its door; (7,11)
                                  #         covers the west door onto the centre shelf.
    boat_pockets: TERRAIN_TILE_2E # 0x2E -- 14 cells, the donor's own village bodies, kept.
                                  #         Impassable to every ground class, cost 1 to a
                                  #         FLIER -- so Pinky may work a hull from four cells
                                  #         where everyone else has one. That asymmetry is
                                  #         vanilla's, not ours.
    ice_walls: TERRAIN_PEAK       # 0x12 -- permanent ridges. NOT glacier: TERRAIN_GLACIER
                                  #         costs 1 for EVERY class, so it shapes nothing.
  terrain_note: >
    Measured off the painted .mar, after the pockets: foot reaches 292 of 484 cells and they
    form ONE connected component -- the eight crossings wire the whole lake together, so the
    channels shape the route without ever stranding anyone. The pockets SYMMETRISE the two
    rescues, which the open outcrops did not: every class now reaches both doors on the same
    turn -- Pinky 3, Braulo/Baxby/Lupin/Trex 5, foot 6. (Braulo is a PIRATE, CLASS_PIRATE
    baseMov 5 -- not the 6 an earlier draft assumed; both doors are 24 move points away.)

    That is vanilla Ch6's budget, measured rather than guessed (2026-09-03): its villagers
    sit in a mountain-ringed pocket a Paladin or a flier reaches on turn 4 and foot on turn 6,
    while an unpromoted Cavalier and an Armour cannot reach them AT ALL -- which is why the
    guide says to send Seth. Its lone pursuing Bael is beside them on turn 7, and a villager
    is 7 HP at Def 0, so contact IS death. Ours reproduces the outcome, not the mechanism:
    a boat is tougher than a child, so the clock is a fuse instead of one bite.

# ── Objective ──────────────────────────────────────────────────────────────────
# PLAIN DefeatBoss, as vanilla Ch6 (2026-08-29). The old `defeat_boss_or_talk` + hidden
# Talk resolution is GONE: Messie is not an enemy unit, so there is nothing to talk down
# mid-battle. He arrives in the boss-death cutscene instead, which means every player sees
# the chapter's signature beat instead of the few who would have tried Talk on a boss.
# This also puts ch06 on the wiring ch03 and ch05 already ship (a borrowed vanilla
# defeat_boss goal template) rather than an invented dual win condition.
objective:
  type: defeat_boss
  description: "Defeat Nerra, the merfolk elder"

win_condition: nerra_defeated
lose_condition: all_player_units_defeated

# ── Difficulty (D3) ─────────────────────────────────────────────────────────────
# Vanilla FE8 Ch6's OWN mode offsets, copied verbatim from chapter_settings
# (easyModeLevelMalus 4 / normalModeLevelMalus 2 / difficultModeLevelBonus 3).
# FE8 expresses difficulty as level offsets + extra traps + a Hard-only reinforcement
# wave; we use that mechanism and invent no dial of our own.
difficulty:
  tutorial: 4
  normal: 2
  difficult: 3

# NO FOG. Vanilla Ch6 runs initialFogLevel 3 because its map is an open field where
# fog is the only difficulty. Our donor puts 40% of the map in concentric water with
# only 8 crossings, so the route IS the puzzle and it is one the player can see and
# solve. Measured: foot reaches all 288 passable cells; the split-party runs land the
# right village turn 6 and the left turn 10, which is the race fog was buying.
fog: none

difficulty_note: >
  The difficulty is the merfolk and the two marooned boats, never the boss -- which is
  vanilla Ch6's own shape, where Novala is a Def 5 shaman the guide says to throw physical
  units at and the real pressure is a hostage clock under fog. We drop the fog (the route
  is legible and the channels do that work) and keep the clock.

  NOTHING is in range of a hull on turn 1 -- vanilla's own placement, where not one unit
  can hit a villager before the Bael walks over. The clock is the two PURSUERS, and they
  are deliberately different problems:

    east / Burly Ram   merfolk-thrower from (14,9). Its JAVELIN is range 1-2, so the door
                       does not stop it -- only four cells on the map are inside that range
                       ((15,12), (17,10), (17,13), (17,14)) and it starts SIX move points
                       from the nearest, so its first throw lands on enemy phase 2 and not
                       before. It has to be killed. Sinks the hull on turn 7.
    west / Pronged Goat ice-crab from (7,20), on the door from enemy phase 2. Venin claw is
                       range 1, so it must occupy that one cell -- which also means the
                       player cannot BOARD until it is dead. Sinks the hull on turn 8.

  Neither boat is answered by a body-block, and the #360 review is why that is written down:
  the crab reaches the door on turn 2 and the player's earliest arrival anywhere near it is
  Pinky on turn 3, so "race it to the door" was a lever that did not exist. What the west
  boat actually offers is a SOFTER kill -- a Level 1 Bael, the weakest unit on the map,
  against five turns of slack -- while the east is a Level 7 soldier that throws from
  outside melee. That asymmetry is what puts the plot-critical hint (Tali) on the boat a
  player is likeliest to save.

  Against foot on turn 6 the east clock is vanilla's own slack of one turn. Nerra inherits Novala's
  softness on purpose -- but note her Flux does 22 to a 19 HP hull, so she is kept on the
  centre shelf, far from both. Messie is a cutscene, not an encounter, so no route skips XP.


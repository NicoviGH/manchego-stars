# whole allowlist -- cell by cell, so the ch05 fence->wall class of accident still fails.
# The two village footprints are repainted as ice outcrops and made WALKABLE underneath
# (cliff art, FOREST terrain -- the snow-mound trick). That is deliberate: vanilla Ch6's

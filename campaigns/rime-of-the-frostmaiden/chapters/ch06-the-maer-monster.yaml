    item_drop: halberd          # SETTLED from events_udefs.c, not the wiki: vanilla's L5 Fighter
                                # carries {AXE_IRON, AXE_HALBERD} with `.itemDrop = 1`. FE8 drops
                                # the LAST item, so the Halberd stays the drop; a Cavalier cannot
                                # swing it, so it fights with the Iron Lance in front of it.
    damage_type: piercing
    positions: [[15, 16]]
    donor: [13, 6]                  # vanilla L5 fighter

# ── The rescue boats (D6) ───────────────────────────────────────────────────────
# Two stranded vessels, dropped as green NPC UNITS rather than painted into the map.
# A unit is the whole point: it can be KILLED, and vanilla Ch6 gates its Orion's Bolt
# on CHECK_ALIVE over three green civilians. A dead NPC stops offering Talk exactly as
# a burned village stops offering Visit, so one mechanism covers both halves -- there
# is no separate visit prompt and no village terrain anywhere on this map.
#
# Two, not three: we adapt the donor's two sites rather than invent a third, and Ch6's
# reward SHAPE (one gift + one save-them-all prize) carries over intact at two.
#
# ENGINE NOTE for the injector: FE8's Talk is a NAMED PAIR --
# `EvtListTalk(flag, script, pid_a, pid_b)`, and `EventInfoCheckTalk` compares both pids
# for exact equality, with no wildcard. So "any unit may board" is emitted as one Talk
# entry per (deployable PC x boat), every entry for a boat sharing that boat's ONE flag:
# the first boarding sets it and `SearchAvailableEvent` then skips the rest. Generated
# from the roster, never hand-listed, or it silently rots when the roster changes.
rescue_boats:
- id: boat-east
  fe_name: "Fishing Boat"       # <=12 chars (see decisions.md: long names garble the buffer)
  class: fleet                  # CLASS_FLEET -- vanilla's own ship map sprite, SMSId 0x41
  size: 32x32                   # unit_icon_wait_table[0x41] = UNIT_ICON_SIZE_32x32
  faction: green                # -> unit_icon_pal_npc; the ally green IS vanilla's civilian faction
  tile: [17, 12]                # R13, the outcrop cell north of the door
  ai_pattern: hold              # never moves; Fleet has mov 3 and must not wander
  attackable_sides: 4           # parity: 2 of vanilla Ch6's 3 civilians are open on 4/4 sides
  reached_on: {foot: 6, cavalry: 5, flier: 3}
  talk:
    background: bg_Boat         # vendored from FE-Repo; the boarding CG
    ea_file: events/ch06-boat-east.ea
    reward:
    - id: antitoxin             # vanilla Ch6's own village gift, same tier
      amount: 1
    text: []                    # TODO: boarding scene. Seed the snow-pile line here
                                # ("get in the drifts") so the cover mechanic is taught.
- id: boat-west
  fe_name: "Fishing Boat"
  class: fleet
  size: 32x32
  faction: green
  tile: [4, 17]                 # E18
  ai_pattern: hold
  attackable_sides: 4
  reached_on: {foot: 6, cavalry: 5, flier: 3}
  talk:
    background: bg_Boat
    ea_file: events/ch06-boat-west.ea
    reward: []                  # the line is the reward; the prize is keeping both alive
    text: []                    # TODO

economy:
  reward_sites:
  - gift: antitoxin
  # Vanilla Ch6 grants the Bolt in its ENDING scene, gated on CHECK_ALIVE for every
  # civilian -- keep them alive; boarding is NOT required for the bonus. prof-rbg is
  # our Archer, so this is a literal-parity reward that lands on a real unit.
  save_all_bonus: orions-bolt
  save_all_gate: "CHECK_ALIVE on both rescue_boats, in the ending scene"

# ── Events declared but unwritten ───────────────────────────────────────────────
# Registered here so `make chapter CH=ch06` counts them as owed rather than missing.
# Both boarding scenes need a voice pass before a line is drafted (decisions.md: read
# every speaker's bible first) -- the boat crews have no bible yet, so the text is TODO
# on purpose rather than placeholder prose.

design_notes: >
  The emotional centerpiece of the MVP and Marty's primary signature beat. Keep
  the fight genuinely hard so the Talk feels earned, not handed out. Track the
  messie_spared flag — ch07's Speaker-installation scene branches on it.

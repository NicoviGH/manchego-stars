# ── Difficulty (D3) ─────────────────────────────────────────────────────────────
# Vanilla FE8 Ch6's OWN mode offsets, copied verbatim from chapter_settings
# (easyModeLevelMalus 4 / normalModeLevelMalus 2 / difficultModeLevelBonus 3).
# FE8 expresses difficulty as level offsets + extra traps + a Hard-only reinforcement
# wave; we use that mechanism and invent no dial of our own.
difficulty:
  tutorial: 4
  normal: 2
  difficult: 3

# NO FOG. Vanilla Ch6 runs initialFogLevel 3 because its map is an open field where
# fog is the only difficulty. Our donor puts 40% of the map in concentric water with
# only 8 crossings, so the route IS the puzzle and it is one the player can see and
# solve. Measured: foot reaches all 288 passable cells; the split-party runs land the
# right village turn 6 and the left turn 10, which is the race fog was buying.
fog: none

difficulty_note: >
  The difficulty is the merfolk and the two marooned boats, never the boss -- which is
  vanilla Ch6's own shape, where Novala is a Def 5 shaman the guide says to throw physical
  units at and the real pressure is a hostage clock under fog. We drop the fog (the route
  is legible and the channels do that work) and keep the clock.

  NOTHING is in range of a hull on turn 1 -- vanilla's own placement, where not one unit
  can hit a villager before the Bael walks over. The clock is the two PURSUERS, and they
  are deliberately different problems:

    east / Burly Ram   merfolk-thrower from (14,9). Its JAVELIN is range 1-2, so the door
                       does not stop it -- only four cells on the map are inside that range
                       ((15,12), (17,10), (17,13), (17,14)) and it starts SIX move points
                       from the nearest, so its first throw lands on enemy phase 2 and not
                       before. It has to be killed. The LONG fuse: median turn 10.
    west / Pronged Goat tentacruel from (7,20), on the door from enemy phase 2. Venin claw is
                       range 1, so it must occupy that one cell -- which also means the
                       player cannot BOARD until it is dead. The claw also POISONS, 1-3 a
                       phase for 5 phases. Median turn 8, on a 28 HP hull.

  THOSE TWO AND NOTHING ELSE, and enforcing it took a licence. Measured in-engine (#26): four of
  the line's STRIKERS reached the east hull on enemy phase 1 and sank it on turn 4, because
  `never-move` names only the APPROACH byte while the ACTION half steps out within a unit's own
  movement to hit whatever it can reach. Vanilla Ch6 never has this problem -- ZERO of its
  seventeen strikers can reach a villager in one turn, its rescue targets sit in a mountain ring,
  and its clock is pursuers only. Our frozen lake has no mountain ring, so the protection is
  bought with vanilla's own AI_A_08 instead: every unit that can reach a hull and is not declared
  in `rescue_pursuers` carries a do-not-attack ACTION byte, and fights the player identically.
  `check_rescue_targets` is the guard; decisions.md -> "AI_B is the APPROACH and AI_A is the
  ACTION".

  Neither boat is answered by a body-block, and the #360 review is why that is written down:
  Tentacruel reaches the door on turn 2 and the player's earliest arrival anywhere near it is
  Pinky on turn 3, so "race it to the door" was a lever that did not exist. What the west
  boat offers is a SOFTER kill -- a Level 1 Bael, the weakest unit on the map -- on the
  FASTER fuse, because its claw poisons. The east is a Level 7 soldier that throws from
  outside melee, on a long fuse. Each is saved by its own rescuers about nine runs in ten
  (below), so which boat carries the plot-critical hint (Tali) is a story choice.

  WHO CAN ACTUALLY GET THERE is `reached_on_contested:`, not `reached_on:` -- the latter is an
  EMPTY-MAP walk, and a unit cannot move through an enemy body. With the line standing, the WEST
  door is turn 6 for foot (vanilla Ch6's own foot number) after moving one corking body off the
  channel, and the EAST door is a FLIER-and-Braulo objective: foot, cavalry and Trex cannot reach
  it at all. That is deliberate and it is OURS, not parity -- vanilla's rescue is reachable by
  everything except Cavalier and Armour. ch06 makes the east hull Pinky's beat the way vanilla
  builds whole chapters around a flier or a thief; the west hull is the one the party saves
  together.

  THE FUSES ARE VANILLA'S SLACK, MEASURED. Vanilla Ch6's foot reaches the villagers a turn
  before the Bael's one-bite death (decisions.md -> "Vanilla Ch6's urgency is TRAVEL TIME"),
  so the promise is that foot gets there first. A fuse is a distribution, not a turn
  (decisions.md -> "A rescue clock is a HIT RATE"), so `declared_fuse:` on each boat is its
  MEDIAN, and both are measured by `danger_map` (ADR 0312, calibrated against #26's runs).
  West: on CLASS_FLEET's own 19 HP the poisoned hull sank before foot arrived in 43% of runs;
  at 28 (its `personal:` line) that is 8%, median turn 8. East keeps 19 HP: Pinky arrives
  turn 3, and Braulo turn 6 with it afloat 96% of the time. Nerra inherits Novala's
  softness on purpose -- but note her Flux does 22 a hit, doubled, to either hull, so she is kept on the
  centre shelf, far from both. Messie is a cutscene, not an encounter, so no route skips XP.


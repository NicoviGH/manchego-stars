      source: "FE-Repo: Battle Animations/Monsters - Dragons and Special/[Monster-Custom] [U] Lamia by L95 -> 7. Staff (also 6. Magic); map sprite Lamia (F) {Dutch Introvert}, 16x32 -- a native fit for the Troubadour's own 16x32 row"

  # ── Bow and beast (vanilla's Archer and its one Bael) ────────────────────────
  - id: merfolk-bow
    name: "Mermaid"
    count: 1
    class: archer               # vanilla: 1x Lv6 Archer, Iron Bow
    level: 6
    autolevel: true
    inventory:
      - id: iron-bow
    damage_type: piercing
    positions: [[20, 12]]
    donor: [12, 4]                  # vanilla L6 archer
    skin: {look: "merfolk with a harpoon-bow", source: "Mermaid by Stephano -> 4. Bow"}
  - id: ice-crab
    name: "Ice Crab"
    count: 1
    class: bael                 # vanilla: 1x Lv1 Bael, Poison Claw -- kept as itself
    level: 1
    autolevel: true
    inventory:
      - id: poison-claw
        fe_base: venin-claw       # ITEM_MONSTER_VENINCLW -- vanilla Ch6's own Bael weapon
    damage_type: poison
    positions: [[7, 20]]
    donor: [27, 4]                  # vanilla's lone Bael -- the one wandering pursuer
    skin: {look: "a lake crab the size of a boat", source: "vanilla Bael art, 32x32 -- no reskin"}

  # ── The Hard wave (vanilla's Difficult-only Cavaliers) ───────────────────────
  # Vanilla Ch6 keeps three extra Cavaliers in a SEPARATE UnitDefinition array, loaded by a
  # turn-4 player-phase event and present only on Difficult -- the guide's "Hard-mode cavalry
  # spawning behind you", and the whole of its Normal->Difficult delta (24 -> 27; the wiki
  # calls it "a UNIT change, not a level shift"). We field the same three, as crab-riders,
  # with vanilla's own levels and inventories. #48's static bar folds that array in on the
  # vanilla side unconditionally, so declaring ours is what makes the two sides count the
  # same force: with them, the comparison reads x1.00 on both metrics instead of x0.88/x0.82.
  - id: crab-rider-hard-javelin
    name: "Crab Rider"
    count: 1
    class: cavalier             # vanilla (Difficult array): 1x Lv6 Cavalier, Javelin + Iron Lance
    level: 6
    autolevel: true
    arrives_turn: 4             # vanilla's own turn-4 player-phase load
    hard_mode_only: true        # vanilla loads this array with CALL(EventScr_LoadReinforceHardMode)
                                # (ch6-eventscript.h, EventScr_089F2B74) -- DIFFICULT ONLY. Without
                                # this flag Normal would field 27 where vanilla fields 24, and the
                                # static bar cannot see it: #48 folds vanilla's Hard array into the
                                # comparison on BOTH sides, so the x1.00 stays x1.00 either way.
    inventory:
      - id: javelin
      - id: iron-lance
    damage_type: piercing
    positions: [[0, 11]]
    donor: [3, 11]
    # the vanilla units that FIGHT on these tiles (their REDA destinations, not spawns)
    skin: {look: "merfolk astride a lake crab", source: "as crab-rider-blade"}
  - id: crab-rider-hard-lance
    name: "Crab Rider"
    count: 1
    class: cavalier             # vanilla (Difficult array): 1x Lv7 Cavalier, Iron Lance
    level: 7
    autolevel: true
    arrives_turn: 4
    hard_mode_only: true        # as above -- EventScr_LoadReinforceHardMode
    inventory:
      - id: iron-lance
    damage_type: piercing
    positions: [[0, 9]]
    donor: [2, 9]
    # the vanilla units that FIGHT on these tiles (their REDA destinations, not spawns)
    skin: {look: "merfolk astride a lake crab", source: "as crab-rider-blade"}
  - id: crab-rider-hard-sword
    name: "Crab Rider"
    count: 1
    class: cavalier             # vanilla (Difficult array): 1x Lv6 Cavalier, Iron Sword + Javelin
    level: 6
    autolevel: true
    arrives_turn: 4
    hard_mode_only: true        # as above -- EventScr_LoadReinforceHardMode
    inventory:
      - id: iron-sword
      - id: javelin
    damage_type: slashing
    positions: [[0, 13]]
    donor: [2, 13]
    # the vanilla units that FIGHT on these tiles (their REDA destinations, not spawns)
    skin: {look: "merfolk astride a lake crab", source: "as crab-rider-blade"}

  # ── The boss (vanilla's Novala) ──────────────────────────────────────────────
  # Novala's own line, from the wiki's boss table: Shaman Lv10, HP 28, Mag 10, Skl 8,
  # Spd 6, Lck 7, DEF 5, Res 9, Con 7, Mov 5, carrying Flux, dropping nothing. Def 5 is
  # why the guide says to throw physical units at him, and that softness is the point:
  # vanilla Ch6 puts its difficulty in the hostage clock, not the boss. No personal: block
  # -- ch06 has no injector yet, and #284 requires every declared line to have a route.
  - id: nerra
    name: "Nerra"
    fe_name: "Nerra"
    is_boss: true
    count: 1
    class: shaman
    level: 10
    inventory:
      - id: flux
    damage_type: necrotic
    positions: [[10, 12]]
    donor: [20, 5]                  # vanilla Ch6's boss (Novala) -- GuardTileAI, Ch6's own tail
    skin: {look: "the largest of the merfolk", source: "Mermaid by Stephano -> 6. Magic; no portrait -- see below"}
    # NO death quote and NO portrait, deliberately (Nicolas, 2026-08-29): the merfolk do not
    # speak. Messie does, and that contrast is the chapter. The FE-Repo has no merfolk
    # portrait at all -- 17,341 files searched; the nearest is a HUMAN knight in a fin-crested
    # helm ("Shark Knight" {Sphealnuke}) -- so a speaking boss would have cost authored art
    # for nothing. The name is arbitrary and touches one string.

# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
# THREE scenes, down from four (2026-08-29). The `unit_adjacent` Talk unlock is gone with
# the boss fight: Messie is not on the field, so there is nothing to walk up to. The two
# ending arms collapse to one, because "kill the creature that was protecting the town" is
# not a choice this version offers.
events:
  - trigger: chapter_start
    type: cutscene
    ea_file: events/ch06-opening.ea
    description: >
      Bremen docks. Two boats went out and neither came back, and the town wants them
      brought in before the ice closes. Grynsk Berylbore -- who sent those crews -- and
      Tali, the half-elf researcher (they/them), are both out there. The party walks onto
      the frozen lake. NOTE: the merfolk are not introduced here; the player meets them by
      being attacked, and learns what they are from the two rescued crews.
  - trigger: boss_defeated
    unit: nerra
    type: cutscene
    ea_file: events/ch06-messie.ea
    description: >
      THE CHAPTER. With the merfolk broken, the ice cracks and Messie hauls himself up onto
      it -- the mass the whole town has been calling a monster, lying on the ice in front of
      the people who came to kill it. Marty speaks to him (his beast-speech), and the answer
      comes back in Common, because Ravisin's awaken spell gave him language along with a
      mind (book p.28: Intelligence 10 and speech in Common; his own line on p.31 is
      "I'm listening"). Braulo is the second voice -- lake fauna talking to lake fauna.
      What comes out: Ravisin woke him and told him to spread fear among Bremen's fishers;
      he has been ramming their boats instead, to turn them back before they reached
      merfolk water. He fears losing the mind he was given. She is already dead -- the party
      killed her at the tomb -- and an awaken spell is permanent. He is free and does not
      know it yet.
  - trigger: chapter_end
    type: cutscene
    ea_file: events/ch06-ending.ea
    description: >
      Back at Bremen with the rescued crews. Messie is not a monster and the town has to
      swallow it; the Speaker seed for ch07 is planted here. If both boats survived, the
      Orion's Bolt is handed over in this scene, exactly as vanilla Ch6 pays its own
      save-them-all reward (CHECK_ALIVE on both).

# ── Messie (cutscene actor, NOT an enemy unit) ───────────────────────────────────
# He has no class, no level and no AI: he is loaded by `events/ch06-messie.ea`, speaks, and
# leaves. That deletes the campaign's single hardest art dependency -- `docs/fe-repo-scouting.md`
# records that NO plesiosaur/sea-monster battle animation exists anywhere in the FE-Repo, and a
# unit that never fights needs none. What he still needs is a map sprite, which is NICOLAS'S
# (taken back 2026-08-26); do not re-open it.
messie:
  name: "Messie"
  pronouns: he/him              # SETTLED 2026-08-26 (Nicolas). The DM notes and the book both
                                # say "it"; an earlier draft of this file said "she" throughout.
  role: cutscene_actor
  appears_in: events/ch06-messie.ea
  art_note: >
    32x32 is the ENGINE CEILING for a map sprite -- UNIT_ICON_SIZE_* has exactly three values
    and bmudisp.c switches on them in five places -- so size has to come from FILLING the cell
    corner to corner. He never moves and never fights, so he needs no walk sheet and NO battle
    animation: a 3-frame idle is the whole ask. Design intent (2026-08-26): a breaching
    head-and-neck as the sprite, with the REST of him painted into the tilemap, which has no
    size limit and costs no engine work. "A large mass glides through the dark water below
    you" is the book's own line (p.30).

# ── Post-Chapter ─────────────────────────────────────────────────────────────────
post_chapter:
  gold_reward: 400
  available_shops: [bremen]
  units_available_to_recruit: []   # Messie is an NPC, not a playable unit
  unlocks_chapter: ch07-blood-in-bremen
  # NO branch_flag. There is one outcome now (2026-08-29): the fight is against the merfolk,
  # and Messie's scene plays for every player. ch07 is unwritten, so nothing was orphaned.

# ── Signature Moment anchored here ───────────────────────────────────────────────
signature_moments:
  - pc: marty
    trigger: ch06_messie_scene     # PRIMARY — see pcs/marty.yaml. Now a guaranteed
                                   # cutscene rather than a hidden Talk: every player
                                   # sees it, nobody has to guess the command exists.

# ── Forest composition (declared departure from #193) ───────────────────────────
# A frozen lake has no trees, so ch06 replaces the concept: all 23 of the donor's FOREST
# cells become snow drifts (rough/rock art stamped TERRAIN_FOREST, so they still grant
# cover and still cost 2). The terrain byte is PRESERVED cell for cell -- what changes is
# the ART, which is exactly what the winter-retile invariant protects.
#
# #193 preserves the vanilla artists' forest SEQUENCES on the assumption that a retile is
# TRANSLATING a forest. Here there is no forest to translate, and the ADR names this case:
# "a deliberate forest-composition departure is a new map-design decision, not a quiet
# override of this guard". This line IS that decision, scoped to this chapter -- every
# other protected terrain (village, house, ruins, inn) stays guarded, and every other
# chapter keeps the full sequence check.
forest_composition: replaced

# ── Declared terrain divergences ────────────────────────────────────────────────
# Every cell here departs from the donor's vanilla terrain ON PURPOSE. The import guard
# (validate_terrain_matches_vanilla) rejects any drift NOT listed, so this block is the
# whole allowlist -- cell by cell, so the ch05 fence->wall class of accident still fails.
#
# SEVEN divergences, down from twenty-one (2026-09-03). The two village footprints are no
# longer repainted walkable: SEVEN cells of each keep the donor's own impassable TILE_2E
# (fourteen in all -- the eighth cell of each footprint is the DOOR, which stays walkable),
# so each boat sits in a POCKET whose only ground entrance is that door, directly south. That is what a
# village IS in FE8 -- a body you cannot walk into and a door you visit it from -- and
# honouring it costs nothing, because a metatile's terrain byte is separate from its art
# (`map_tileset_tool.py set-terrain`). Twelve metatiles moved 0x0C -> 0x2E; the .4bpp and
# .gbapal are byte-identical, so the painted ice-outcrop art is untouched and snowy-bern
# (and therefore ch04) never sees the change.
#
# TILE_2E costs 1 to a FLIER and is impassable to every ground class, which is vanilla's
# own rule and the reason Pinky keeps a privilege the rest of the party does not: she can
# work the boat from four cells where everyone else has one. Blocking her would have been
# STRICTER than FE8, not more faithful to it.
#
# The boat's OWN tile stays FOREST on purpose: +1 Def and +20 avoid are what stretch a
# single attacker's fuse to the length the chapter's clock is tuned around.
# Rationale: docs/decisions.md -> "ch06's boats sit in POCKETS, because a village is a
# body you cannot walk into and a door you visit it from".
terrain_divergence:
- tile: [17, 12]                 # R13 -- the east boat's own cell
  from: TILE_2E
  to: '0x0C'
  why: the hull sits in cover -- FOREST's +1 Def / +20 avoid is what makes the sinking clock take turns rather than one bite
- tile: [17, 13]                 # R14
  from: VILLAGE_REGULAR
  to: '0x0C'
  why: the east door -- the one ground cell from which the boat can be boarded or attacked; FOREST so the defender holding it is in the drifts Grynsk's scene teaches
- tile: [4, 17]                  # E18 -- the west boat's own cell
  from: TILE_2E
  to: '0x0C'
  why: as (17,12)
- tile: [4, 18]                  # E19
  from: VILLAGE_REGULAR
  to: '0x0C'
  why: the west door -- as (17,13). Not left as VILLAGE_REGULAR, because there is no village event on this map and a dead Visit prompt is worse than none
- tile: [10, 17]                 # K18
  from: SNAG
  to: '0x01'
  why: map-change pair; SNAG is impassable to EVERY class, fliers included
- tile: [10, 18]                 # K19
  from: RIVER
  to: '0x34'
  why: map-change pair; the crossing the player opens
- tile: [3, 21]                  # D22
  from: SEA
  to: '0x26'
  why: seals the dead south-west corner

# ── The rescue boats (D6) ───────────────────────────────────────────────────────
# Two stranded vessels, dropped as green NPC UNITS rather than painted into the map.
# A unit is the whole point: it can be KILLED, and vanilla Ch6 gates its Orion's Bolt
# on CHECK_ALIVE over three green civilians. A dead NPC stops offering Talk exactly as
# a burned village stops offering Visit, so one mechanism covers both halves -- there
# is no separate visit prompt and no village terrain anywhere on this map.
#
# Two, not three: we adapt the donor's two sites rather than invent a third, and Ch6's
# reward SHAPE (one gift + one save-them-all prize) carries over intact at two.
#
# ENGINE NOTE for the injector: FE8's Talk is a NAMED PAIR --
# `EvtListTalk(flag, script, pid_a, pid_b)`, and `EventInfoCheckTalk` compares both pids
# for exact equality, with no wildcard. So "any unit may board" is emitted as one Talk
# entry per (deployable PC x boat), every entry for a boat sharing that boat's ONE flag:
# the first boarding sets it and `SearchAvailableEvent` then skips the rest. Generated
# from the roster, never hand-listed, or it silently rots when the roster changes.
rescue_boats:
- id: boat-east
  fe_name: "Fishing Boat"       # <=12 chars (see decisions.md: long names garble the buffer)
  class: fleet                  # CLASS_FLEET -- vanilla's own ship map sprite, SMSId 0x41
  size: 32x32                   # unit_icon_wait_table[0x41] = UNIT_ICON_SIZE_32x32
  faction: green                # -> unit_icon_pal_npc; the ally green IS vanilla's civilian faction
  tile: [17, 12]                # R13, inside the pocket; the door is (17,13) directly south
  door: [17, 13]                # the ONE ground cell adjacent to the hull -- board from here,
                                # and everything that swings at the hull has to stand here too
  donor: [20, 5]                  # vanilla Ch6's boss (Novala) -- GuardTileAI, Ch6's own tail
  attackable_sides: 1           # ground. A FLIER may also take any of the 3 pocket cells, and
                                # a range-2 weapon reaches the hull over the wall from 3 tiles
                                # -- FE8 has no line of sight, so a wall never stops a javelin,
                                # a bow or a tome. Placement is the only lever for those.
  reached_on: {foot: 6, cavalry: 5, flier: 3, braulo: 5, trex: 5}   # to the DOOR, re-measured
  talk:
    background: bg_Boat         # vendored from FE-Repo; the boarding CG
    ea_file: events/ch06-boat-east.ea
    reward:
    - id: antitoxin             # vanilla Ch6's own village gift, same tier -- confirmed
      amount: 1                 # against the decomp: Ch6's village at (11,18) gives
                                # ITEM_ANTITOXIN (0x6F), and its ending gives
                                # ITEM_ORIONSBOLT (0x66) gated on three CHECK_ALIVEs
    text: []                    # TODO: boarding scene. Seed the snow-pile line here
                                # ("get in the drifts") so the cover mechanic is taught.
- id: boat-west
  fe_name: "Fishing Boat"
  class: fleet
  size: 32x32
  faction: green
  tile: [4, 17]                 # E18, inside the pocket; the door is (4,18) directly south
  door: [4, 18]
  donor: [20, 5]                  # vanilla Ch6's boss (Novala) -- GuardTileAI, Ch6's own tail
  attackable_sides: 1           # as boat-east; a flier adds 3 cells, range-2 reaches from 2
  reached_on: {foot: 6, cavalry: 5, flier: 3, braulo: 5, trex: 5}   # to the DOOR, re-measured
  talk:
    background: bg_Boat
    ea_file: events/ch06-boat-west.ea
    reward: []                  # the line is the reward; the prize is keeping both alive
    text: []                    # TODO

economy:
  reward_sites:
  - gift: antitoxin
  # Vanilla Ch6 grants the Bolt in its ENDING scene, gated on CHECK_ALIVE for every
  # civilian -- keep them alive; boarding is NOT required for the bonus. prof-rbg is
  # our Archer, so this is a literal-parity reward that lands on a real unit.
  save_all_bonus: orions-bolt
  save_all_gate: "CHECK_ALIVE on both rescue_boats, in the ending scene"

# ── Events declared but unwritten ───────────────────────────────────────────────
# Registered here so `make chapter CH=ch06` counts them as owed rather than missing.
# Both boarding scenes need a voice pass before a line is drafted (decisions.md: read
# every speaker's bible first) -- the boat crews have no bible yet, so the text is TODO
# on purpose rather than placeholder prose.

design_notes: >
  The emotional centerpiece of the MVP and Marty's primary signature beat -- and as of
  2026-08-29 it is a CUTSCENE, not a hidden Talk. The fight is the merfolk; Messie hauls
  himself onto the ice once Nerra falls. There is no messie_spared flag and no second
  ending: every player sees the beat, and nobody has to guess a command exists on a boss.
  Keep the merfolk honest (they are vanilla Ch6's own 24) and keep the two marooned boats
  killable -- that clock, not the boss, is where this chapter's difficulty lives.

# ── Cutscene actors ──────────────────────────────────────────────────────────────
# The eight PCs appear in cutscenes whether or not they are alive -- permadeath is a COMBAT
# rule here, not a narrative one (decisions.md, "Permadeath is a combat rule"). So this scene
# does NOT gate on Marty or Braulo: they speak, always. The invariant that makes that safe is
# that events/ch06-messie.ea must LOAD its actors rather than assume they are standing on the
# map (`LoadUnit` has no death check; `GetUnitFromCharId` returns NULL for an absent unit, and
# a CUMO/MOVE on NULL is the never-returns soft-lock assert_scripted_move_reachable exists for).
cutscene_actors: [marty, braulo]

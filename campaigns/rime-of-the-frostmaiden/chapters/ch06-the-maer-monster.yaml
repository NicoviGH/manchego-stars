  # decisions.md -> "ch06's axe and sword blocks carry tridents".
  - id: shark-rider-poison
    name: "Shark Rider"
    count: 1
    class: cavalier             # vanilla: 1x Lv6 Fighter, Poison Axe -- re-classed, see above
    level: 6
    autolevel: true

    damage_type: piercing
    positions: [[14, 9]]
    donor: [14, 16]                 # vanilla's fifth L7 soldier -- the one it lets PURSUE
    skin: {look: "merfolk spear-guard, thrown trident", source: "as merfolk-trident"}
  - id: merfolk-trident-young

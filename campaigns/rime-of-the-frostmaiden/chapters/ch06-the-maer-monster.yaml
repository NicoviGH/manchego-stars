# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
# THREE scenes (2026-08-29). Messie never stands on the field, so he has no Talk unlock and
# no kill/spare arm. The ending's only branch is a boat that sank (see chapter_end).
events:
  - trigger: chapter_start
    type: cutscene
    ea_file: events/ch06-opening.ea
    description: >
      Bremen. Speaker Dorbulgruf Shalescar hires the party to kill the monster the whole
      town blames for its lost boats, and names the price on screen (ch07's refusal pays
      this off). Two boats went out and never came back: Grynsk Berylbore's Burly Ram and
      the Pronged Goat with Tali, the half-elf researcher (they/them), aboard. The party
      walks out onto the frozen lake to find them and the beast. Vanilla's 0x9EA is the
      model for the walk-out ("we have to save that girl" / "this is a trap").
      THE PLAYER EXPECTS A MONSTER FIGHT (Nicolas, 2026-10-08). Nobody hints that Messie is
      harmless and nobody names the merfolk: the player meets them by being attacked, and
      the map delivers the twist.
      Dorbulgruf wears the Murray slot (portraits/dorbulgruf.png, ADR 0332). Voice:
      lore/dorbulgruf.md. LOCKED 2026-10-09 (dialogue-pass, co-written with Nicolas), 32 boxes.
      Beat B plays ON THE MAP AFTER PREP (Nicolas, 2026-10-09), in ch05 0x9C2's after-prep
      shape: the camera on the party standing on the real ice. The merfolk are NOT loaded
      before prep; they surface mid-scene, on the tiles the balance gate measures, so the
      player deploys without seeing them -- vanilla Ch6's fog gives its player the same.
    script:                           # LOCKED 2026-10-09 (dialogue-pass, co-written with Nicolas)
      - location_card: "Bremen"
      # ── A: Bremen's town hall ──
      # (The party arrives on the rumour from ch05's ending. Nobody sent for them.)
      - prof-rbg: "Speaker Shalescar! Professor R.B. Geenius. Cheesed to meet you."
      - dorbulgruf: "Who let this band of misfits into my hall?"
      - prof-rbg: "Um, actually-- we're the Manchego Stars."
      # (Marty steps up and politely coughs a puff of spores in his face: his new-person gag,
      #  never explained (lore/marty.md). Marty has no line, so the sneeze cuts Dorbulgruf off.)
      - dorbulgruf: "Manchego Stars? Never heard of-- did that mushroom just SNEEZE on me?!"
      # (Braulo leads, and he wants the MONSTER (Nicolas): ch05 closed on "Aye, it is time we meet
      #  this beastie.")
      - braulo: "We heard you have a monster."
      - dorbulgruf: "Heard, did you? Then you heard it took two boats!"
      - dorbulgruf: "Two days, and not a sign of them!"
      - pinky: "Whose boats?"
      - dorbulgruf: "Grynsk's! My best fisher. Him and the half-elf with the notebook went after it."
      - dorbulgruf: "The fools. Nobody's seen either one since."
      - braulo: "What does it look like?"
      # (The witnesses' wildly different accounts are the book's, Rime p.29.)
      - dorbulgruf: "Depends who you ask! Big as an ox. Big as a house."
      - dorbulgruf: "A whale with a neck like a mast! A lizard with scales like shields!"
      # (The fear shows where he breaks off. He covers it.)
      - dorbulgruf: "Whatever it is, it wants Bremen at the bottom of the lake! Seventy years I've--"
      - dorbulgruf: "...Bah."
      - braulo: "A neck like a mast... Aye. I want to meet this beastie."
      # (RBG leans on him for a bounty. There was none until this moment: Dorbulgruf makes it up
      #  under pressure, which is what lets ch07 claim nothing was ever promised.)
      - prof-rbg: "Surely a town in such a pickle has posted a bounty, Speaker?"
      - prof-rbg: "A modest one would do. Something to make it worth our whey."
      - dorbulgruf: "Bounty?! I've got two boats missing and you want--"
      - dorbulgruf: "...Fine! Three hundred gold. For its head!"
      # ("For its head" is the term ch07 turns on: the beast comes back alive.)
      - braulo: "Done. We'll bring you its head."
      # (THE SLIP. "Her" is Auril: privately he is close to starting the sacrifices. Asked by a
      #  child, so it lands; he shouts over it at once.)
      - pinky: "Um... and if it's too big for us, sir?"
      - dorbulgruf: "...Then Bremen will have to find a different way to pay her..."
      - dorbulgruf: "Go on! Get out of my hall!"
      - beat_break: B           # cut to the lake, on the map after prep
      # ── B: on the ice ──
      # (Wolfram smells the metal before he sees anything (lore/wolfram.md), then reads the
      #  hulls' construction: the boats' clock, stated in his own trade.)
      - wolfram: "(sniffs) Wait. Iron... cheap iron, gone to rust. There! The boats!"
      - wolfram: "Pine planks, bog-iron nails. The cold's already splitting them."
      - wolfram: "They won't take many more hits."
      # (The DM notes' "huge shadow moving beneath the icy waters". The player should expect
      #  the monster; Braulo knows lake animals and knows better.)
      - pinky: "Father! Something moved under the ice! Something big!"
      - braulo: "That's not our beastie..."
      - rootis: "Oh! There's another shadow. And another..."
      - rootis: "Maybe the beastie brought friends?"
      - stage_cut: the camera pans to the lake, and the merfolk break through the water, silent (LOADED here)
      - meesmickle: "Friends. With tridents. Delightful."
  - trigger: boss_defeated
    unit: nerra
    type: cutscene
    ea_file: events/ch06-messie.ea
    description: >
      THE CHAPTER, and it stays LOCAL to Bremen (Nicolas, 2026-10-08). Beats LOCKED 2026-10-09
      (dialogue-pass, with Nicolas), ~27 boxes on the map:
      A. He surfaces, staged on Kyogre's Cave of Origin awakening (pokeruby
         CaveOfOrigin_B4F): the ice cracks, the screen shakes, Messie slides slowly toward the
         party, a held beat, his cry. Braulo, RBG and Wolfram raise their weapons, still in
         fight mode: the player is braced for the boss.
      B. Marty coughs his spores and casts speak with animals, assuming a beast. Messie answers
         in Common, "I'm listening." (book p.31); the awaken spell gave him language (p.28).
         The fighters are stunned, Braulo most of all.
      C. The book's own lines (p.31), the Frostmaiden named as written: he used to just swim
         the lake and eat fish; Ravisin woke him to make Bremen suffer for the Frostmaiden.
         Braulo: you sank our boats. Messie: he rams them to turn the crews home before they
         reach merfolk water, and has drowned no one; Grynsk and Tali got past him. Braulo's
         respect for the old beast grows.
      D. "I don't want to be a stupid beast again." Marty tells him Ravisin is dead and the
         gift is his to keep; he promises to leave the fishers be.
      E. Braulo: we took Bremen's coin for your head. He decides the head is not theirs to
         take, because the job was ending the sinkings. Marty asks Messie to come back to
         Bremen and make peace; the scene ends on Messie agreeing.
      Held for ch07: why the merfolk turned bold and what the Frostmaiden asked of them
      (Messie's farewell), and the Speaker idea (the argument with Dorbulgruf).
    script:                           # DRAFTING (dialogue-pass, with Nicolas); beat A LOCKED 2026-10-09
      # ── A: he surfaces ──
      # (Kyogre's Cave of Origin order: the ice cracks under a quake and a screen shake; Messie
      #  surfaces two tiles out and slides two tiles toward the party, slowly; a one-second hold;
      #  his cry. No line before the cry.)
      - braulo: "There it is. It's magnificent."
      - prof-rbg: "Pinky, stand behind me. This one's a rather big cheese."
      - wolfram: "(sniffs) No iron on it. Just teeth. A lot of teeth."
      - braulo: "Steady. Let it come to us."
  - trigger: chapter_end
    type: cutscene
    ea_file: events/ch06-ending.ea
    description: >
      Back at Bremen's docks with the rescued crews. Vanilla's MSG_9F1 is the model: the
      rescued thank the party, and if both boats survived the Orion's Bolt is handed over,
      exactly as vanilla Ch6 pays its own save-them-all reward (CHECK_ALIVE on both). Grynsk
      can confirm in one line that the merfolk were never this bad before. Tali leaves with
      the book's exit: "interesting... fascinating... remarkable", muttered in Elvish. The
      party heads for the Speaker with Messie to broker peace, which is where ch07 opens.
      A boat that sank takes its speaker's lines with it, as ch05's ending cuts Sahnar.

# ── Messie (cutscene actor, NOT an enemy unit) ───────────────────────────────────
# He has no class, no level and no AI: he is loaded by `events/ch06-messie.ea`, speaks, and
# leaves. That deletes the campaign's single hardest art dependency -- `docs/fe-repo-scouting.md`
# records that NO plesiosaur/sea-monster battle animation exists anywhere in the FE-Repo, and a
# unit that never fights needs none. What he still needs is a map sprite, which is NICOLAS'S
# (taken back 2026-08-26); do not re-open it.
messie:
  name: "Messie"
  pronouns: he/him              # SETTLED 2026-08-26 (Nicolas). The DM notes and the book both
                                # say "it"; an earlier draft of this file said "she" throughout.
  role: cutscene_actor
  appears_in: events/ch06-messie.ea
  art:
    portrait: portraits/messie.png      # Syrene's face slot; portraits/messie.py renders it
    map_sprite:
      wait: map_sprites/messie.png      # 32x96, Nicolas's (#363): the whole animal, 3 frames
      base: Gwyllgi                     # 32x32 geometry donor -- the scene loads him as one
  art_note: >
    He is raw pid 0xbd (CH06_MESSIE_PID), named "Messie" on Syrene's name plate and wearing her
    face slot, which carries his no-hat bust. 32x32 is the engine ceiling for a map sprite
    (UNIT_ICON_SIZE_* has three values), so the whole animal fills one cell. He never fights, so
    he has no battle animation; when the scene moves him he glides on his idle frame. The top-hat
    bust and sheet (messie-mayor.png, the Gheb slot) are ch07's mayor beat.

# ── Post-Chapter ─────────────────────────────────────────────────────────────────
post_chapter:
  gold_reward: 400
  available_shops: [bremen]
  units_available_to_recruit: []   # Messie is an NPC, not a playable unit
  unlocks_chapter: ch07-blood-in-bremen
  # NO branch_flag. There is one outcome now (2026-08-29): the fight is against the merfolk,
  # and Messie's scene plays for every player. ch07 is unwritten, so nothing was orphaned.

# ── Signature Moment anchored here ───────────────────────────────────────────────
signature_moments:
  - pc: marty
    trigger: ch06_messie_scene     # PRIMARY — see pcs/marty.yaml. Now a guaranteed
                                   # cutscene rather than a hidden Talk: every player
                                   # sees it, nobody has to guess the command exists.

# ── Forest composition (declared departure from #193) ───────────────────────────
# A frozen lake has no trees, so ch06 replaces the concept: all 23 of the donor's FOREST
# cells become snow drifts (rough/rock art stamped TERRAIN_FOREST, so they still grant
# cover and still cost 2). The terrain byte is PRESERVED cell for cell -- what changes is
# the ART, which is exactly what the winter-retile invariant protects.
#
# #193 preserves the vanilla artists' forest SEQUENCES on the assumption that a retile is
# TRANSLATING a forest. Here there is no forest to translate, and the ADR names this case:
# "a deliberate forest-composition departure is a new map-design decision, not a quiet
# override of this guard". This line IS that decision, scoped to this chapter -- every
# other protected terrain (village, house, ruins, inn) stays guarded, and every other
# chapter keeps the full sequence check.
forest_composition: replaced

# ── Declared terrain divergences ────────────────────────────────────────────────
# Every cell here departs from the donor's vanilla terrain ON PURPOSE. The import guard
# (validate_terrain_matches_vanilla) rejects any drift NOT listed, so this block is the
# whole allowlist -- cell by cell, so the ch05 fence->wall class of accident still fails.
#
# SEVEN divergences, down from twenty-one (2026-09-03). The two village footprints are no
# longer repainted walkable: SEVEN cells of each keep the donor's own impassable TILE_2E
# (fourteen in all -- the eighth cell of each footprint is the DOOR, which stays walkable),
# so each boat sits in a POCKET whose only ground entrance is that door, directly south. That is what a
# village IS in FE8 -- a body you cannot walk into and a door you visit it from -- and
# honouring it costs nothing, because a metatile's terrain byte is separate from its art
# (`map_tileset_tool.py set-terrain`). Twelve metatiles moved 0x0C -> 0x2E; the .4bpp and
# .gbapal are byte-identical, so the painted ice-outcrop art is untouched and snowy-bern
# (and therefore ch04) never sees the change.
#
# TILE_2E costs 1 to a FLIER and is impassable to every ground class, which is vanilla's
# own rule and the reason Pinky keeps a privilege the rest of the party does not: she can
# work the boat from four cells where everyone else has one. Blocking her would have been
# STRICTER than FE8, not more faithful to it.
#
# The boat's OWN tile stays FOREST on purpose: +1 Def and +20 avoid are what stretch a
# single attacker's fuse to the length the chapter's clock is tuned around.
# Rationale: docs/decisions.md -> "ch06's boats sit in POCKETS, because a village is a
# body you cannot walk into and a door you visit it from".
terrain_divergence:
- tile: [17, 12]                 # R13 -- the east boat's own cell
  from: TILE_2E
  to: '0x0C'
  why: the hull sits in cover -- FOREST's +1 Def / +20 avoid is what makes the sinking clock take turns rather than one bite
- tile: [17, 13]                 # R14
  from: VILLAGE_REGULAR
  to: '0x0C'
  why: the east door -- the one ground cell from which the boat can be boarded or attacked; FOREST so the defender holding it is in the drifts Grynsk's scene teaches
- tile: [4, 17]                  # E18 -- the west boat's own cell
  from: TILE_2E
  to: '0x0C'
  why: as (17,12)
- tile: [4, 18]                  # E19
  from: VILLAGE_REGULAR
  to: '0x0C'
  why: the west door -- as (17,13). Not left as VILLAGE_REGULAR, because there is no village event on this map and a dead Visit prompt is worse than none
- tile: [10, 17]                 # K18
  from: SNAG
  to: '0x01'
  why: map-change pair; SNAG is impassable to EVERY class, fliers included
- tile: [10, 18]                 # K19
  from: RIVER
  to: '0x34'
  why: map-change pair; the crossing the player opens
- tile: [3, 21]                  # D22
  from: SEA
  to: '0x26'
  why: seals the dead south-west corner

# ── The rescue boats (D6) ───────────────────────────────────────────────────────
# Two stranded vessels, dropped as green NPC UNITS rather than painted into the map.
# A unit is the whole point: it can be KILLED, and vanilla Ch6 gates its Orion's Bolt
# on CHECK_ALIVE over three green civilians. A dead NPC stops offering Talk exactly as
# a burned village stops offering Visit, so one mechanism covers both halves -- there
# is no separate visit prompt and no village terrain anywhere on this map.
#
# Two, not three: we adapt the donor's two sites rather than invent a third, and Ch6's
# reward SHAPE (one gift + one save-them-all prize) carries over intact at two.
#
# ENGINE NOTE for the injector: FE8's Talk is a NAMED PAIR --
# `EvtListTalk(flag, script, pid_a, pid_b)`, and `EventInfoCheckTalk` compares both pids
# for exact equality, with no wildcard. So "any unit may board" is emitted as one Talk
# entry per (deployable PC x boat), every entry for a boat sharing that boat's ONE flag:
# the first boarding sets it and `SearchAvailableEvent` then skips the rest. Generated
# from the roster, never hand-listed, or it silently rots when the roster changes.
# The chapter's CLOCK, declared. `check_rescue_targets` proves nothing else on the board can
# attack a hull: every other unit that can reach one carries an ACTION byte that cannot target
# it. Vanilla Ch6 gets this from terrain -- zero of its seventeen strikers can reach a villager
# in one turn, and its clock is pursuers only. Ours is the same shape, bought with the AI byte.
rescue_pursuers:
- id: merfolk-thrower           # east: JAVELIN, range 1-2, so the pocket door never stops it
- id: tentacruel                # west: range 1, so it must OCCUPY the door -- and it does

rescue_boats:
- id: boat-east
  fe_name: "Fishing Boat"       # <=12 chars (see decisions.md: long names garble the buffer)
  class: fleet                  # CLASS_FLEET -- vanilla's own ship map sprite, SMSId 0x41
  size: 32x32                   # unit_icon_wait_table[0x41] = UNIT_ICON_SIZE_32x32
  faction: green                # -> unit_icon_pal_npc; the ally green IS vanilla's civilian faction
  tile: [17, 12]                # R13, inside the pocket; the door is (17,13) directly south
  door: [17, 13]                # the ONE ground cell adjacent to the hull -- board from here,
                                # and everything that swings at the hull has to stand here too
  donor: [20, 5]                  # vanilla Ch6's boss (Novala) -- GuardTileAI, Ch6's own tail
  declared_fuse: 10             # MEDIAN sink turn, measured (danger_map); see difficulty_note
  attackable_sides: 1           # ground. A FLIER may also take any of the 3 pocket cells, and
                                # a range-2 weapon reaches the hull over the wall from 3 tiles
                                # -- FE8 has no line of sight, so a wall never stops a javelin,
                                # a bow or a tome. Placement is the only lever for those.
  reached_on: {foot: 6, cavalry: 5, flier: 3, braulo: 5, trex: 5}   # to the DOOR, EMPTY MAP
  # ...and the same walk with the enemy LINE standing on it (turn-1 snapshot; derived by
  # `map_placement_preview.reached_on`, never hand-kept). A unit cannot pass through an enemy
  # body, and this map's channels are narrow enough that ONE body corks a route: removing
  # shark-rider-halberd at (15,16) alone turns `null` into turn 12. The empty-map row above is
  # what the chapter's clock was designed against, and it is not what a player walks.
  reached_on_contested: {foot: null, cavalry: null, flier: 3, braulo: 6, trex: null}
  talk:
    background: BG_SHIP         # vanilla FE8's own boat CG (Ch11B's Text_BG backdrop)
    reward:
    - id: antitoxin             # vanilla Ch6's own village gift, same tier -- confirmed
      amount: 1                 # against the decomp: Ch6's village at (11,18) gives
                                # ITEM_ANTITOXIN (0x6F), and its ending gives
                                # ITEM_ORIONSBOLT (0x66) gated on three CHECK_ALIVEs
    # Grynsk Berylbore, who owns both boats (Rime p.28). Vanilla Ch6's village line (MSG_9F3)
    # is the baseline -- warn of the poison, hand over the antitoxin -- in his voice.
    face: FID_VillagerMan3        # the mustached elder (ch04's logger wears it too; never re-dressed)
    text:                       # one entry per box
    - "Bloody ice... Oi! Heard there's some creature on the west floe."
    - "Poisonous, they say. So I stocked up on antitoxin..."
    - "Strong stuff. One swig and the poison's gone. Tastes like boot, mind."
    - "Go on, take one. It might still eat you, but at least it won't poison you!"
- id: boat-west
  fe_name: "Fishing Boat"
  class: fleet
  size: 32x32
  faction: green
  tile: [4, 17]                 # E18, inside the pocket; the door is (4,18) directly south
  door: [4, 18]
  donor: [20, 5]                  # vanilla Ch6's boss (Novala) -- GuardTileAI, Ch6's own tail
  declared_fuse: 8              # MEDIAN sink turn, measured (danger_map); see difficulty_note
  personal:
    baseHP: 9                   # CLASS_FLEET 19 + 9 = 28: foot reaches the door before the
                                # poisoned hull sinks in 92% of runs, vanilla Ch6's foot slack
                                # (19 HP: 57%). Routed by RAW_PID_PERSONAL_SOURCES.
  attackable_sides: 1           # as boat-east; a flier adds 3 cells, range-2 reaches from 2
  reached_on: {foot: 6, cavalry: 5, flier: 3, braulo: 5, trex: 5}   # to the DOOR, EMPTY MAP
  # Contested, as boat-east. The cork here is merfolk-trident at (2,14): removing that one
  # body takes foot from turn 11 back to the declared 6.
  reached_on_contested: {foot: 6, cavalry: 5, flier: 3, braulo: 5, trex: 5}
  talk:
    background: BG_SHIP
    reward: []                  # the line is the reward; the prize is keeping both alive
    # Tali, the half-elf researcher (they/them, Rime p.29), on the bitten boat. Teaches the
    # snow drifts' cover (+20 avoid), and asks to hear what the party learns, as in the book.
    face: FID_VillagerGirlBlackHair   # pale, hooded; VillagerYoungMan is ch05's skeleton
    text:
    - "Oh, thank goodness. I'm Tali. I study the wildlife of the lake."
    - "I usually study them from the safety of the snowdrift piles. They provide some cover."
    - "I can't offer you much but my gratitude. If you see it, please tell me everything you can."

economy:
  reward_sites:
  - gift: antitoxin
  # Vanilla Ch6 grants the Bolt in its ENDING scene, gated on CHECK_ALIVE for every
  # civilian -- keep them alive; boarding is NOT required for the bonus. prof-rbg is
  # our Archer, so this is a literal-parity reward that lands on a real unit.
  save_all_bonus: orions-bolt
  save_all_gate: "CHECK_ALIVE on both rescue_boats, in the ending scene"


design_notes: >
  The emotional centerpiece of the MVP and Marty's primary signature beat, delivered as a
  cutscene that every player sees once Nerra falls. The party is hired to kill Messie and
  fights the merfolk; the reveal belongs to the scene. Keep the merfolk honest (they are
  vanilla Ch6's own 24) and keep the two marooned boats killable: the boats' clock is where
  this chapter's difficulty lives.

# ── Cutscene actors ──────────────────────────────────────────────────────────────
# The eight PCs appear in cutscenes whether or not they are alive -- permadeath is a COMBAT
# rule here, not a narrative one (decisions.md, "Permadeath is a combat rule"). So this scene
# does NOT gate on Marty or Braulo: they speak, always. The invariant that makes that safe is
# that events/ch06-messie.ea must LOAD its actors rather than assume they are standing on the
# map (`LoadUnit` has no death check; `GetUnitFromCharId` returns NULL for an absent unit, and
# a CUMO/MOVE on NULL is the never-returns soft-lock assert_scripted_move_reachable exists for).
cutscene_actors: [marty, braulo]

# ── What proves it (D8) ─────────────────────────────────────────────────────────
# A chapter DECLARES its own scenarios and `tools/playtest/declared.py` derives their matrix
# rows from this block (#314) -- the ROM from `boot:`, PT_HOST_CHAPTER from the host-slot
# registry. Nothing about them is written a second time in `matrix.yaml`.
#
# ch06clock is the case #360 could not run because ch06 had no debug boot when it landed: the
# pockets are a claim about the ENGINE'S pathing, and `mapshot` photographs turn 1 while the
# question needs several enemy phases. ch06boarding proves the boarding pass. The opening is
# filmed in two halves on either side of Preparations, ch05's split: recordch06opening (beat A,
# to the prep screen) and recordch06ice (beat B, to a live turn 1 with the merfolk on the map).
playtest:
  boot: ch06boot                  # CH06BOOT=1; host slot 7 comes from inject/hosts.py
  cases:
    # Hand-written Lua, and it names why rather than defaulting to it: the declared
    # vocabulary is boot -> settle -> visit -> read items, and this case drives ENEMY PHASES
    # and reads the red and green unit arrays. `deadline` is raised because twelve phases of
    # twenty-four enemies is several times the work a village case does.
    - name: ch06clock
      proves: >
        both pursuers path to their hull without stalling, and the range-1 Tentacruel attacks the
        west boat only from its pocket door -- the single melee cell the pocket promises
      lua: ch06clock
      deadline: 900

    # The boarding pass, from each hull's DOOR -- the one ground cell next to it -- which is the
    # open question #360 left: whether Talk fires from there at all.
    - {name: recordch06opening, proves: "the opening's beat A in motion: card, cut, the hall", lua: recordch06opening, kind: record, deadline: 900}
    - {name: recordch06ice, proves: "beat B on the ice, and the merfolk surfacing at its stage_cut", lua: recordch06ice, kind: record, deadline: 900}
    - name: ch06boarding
      proves: a party member boards both hulls from their doors, both crews speak, and the east
        hull hands over its Antitoxin
      given: [on_map]
      when:
        - talk: {x: 17, y: 13, gains: 0x6F}   # boat-east's door -> Grynsk, ITEM_ANTITOXIN
        - talk: {x: 4,  y: 18}                # boat-west's door -> Tali, the line is the reward
      then:
        - spoke: true

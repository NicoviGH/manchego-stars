# chapters/ch02-cold-welcome.yaml
# Chapter index: docs/CHAPTERS.md (generated from this file). Rationale: docs/decisions.md.
# Combat is vanilla FE (see docs/decisions.md §Combat). damage_type labels are cosmetic.

id: ch02-cold-welcome
title: "Cold Welcome"
chapter_number: 2
status: active                 # built / in-progress slice; combat data is grounded + authoritative
milestone: M3
cadence: breather_defend          # see docs/CHAPTERS.md — 🟦

# Tactical base map this chapter reskins. We keep FE8's tuned layout (spawn edges,
# choke points, terrain bonuses) and repaint it to the arctic/Icewind Dale theme.
fe8_base_map: "FE8 Ch2 — The Protected"   # DefeatAll + defend-in-place; src/events/ch2-eventinfo.h
parity_reference: "FE8 Ch2"   # #48 enemy-pressure parity bar — The Protected — defend-in-place breather

# Difficulty (#303). FE8 ships three modes and so do we; the engine derives all three
# from THIS chapter's authored enemy levels by re-projecting stats at unit-load time
# (UnitApplyBonusLevels), so these are the only three numbers that separate the modes.
# Taken from L02, the same vanilla chapter `parity_reference` names -- our authored
# table sits on the same footing as vanilla's authored table (measured: every mode holds
# its parity ratio to within 0.04), so vanilla's own spread lands our three modes where
# its three sit. DECLARED, never inherited: without this the chapter silently carries its
# squatted host slot's numbers, which is how ch04 shipped a Normal at x1.30 (out of band).
# tutorial = easyModeLevelMalus, normal = normalModeLevelMalus, difficult =
# difficultModeLevelBonus (chapterdata.h:47-49; each a 4-bit field, so 0..15).
difficulty:
  tutorial:  4      # vanilla L02
  normal:    2
  difficult: 2


# Traps (#302). `.traps` is a ChapterEventGroup field, and our injectors FILL the group --
# so a chapter that says nothing keeps whatever its donor carried. Declaring the empty list
# is the decision, not the absence of one: Bryn Shander's approach is open ground.
# Row shape: {type, x, y} plus optional item/count/turn. Placeable types live in
# build_campaign TRAP_TYPES -- which is what LoadTrapData actually PLACES, not the
# bmtrick.h enum (four of those either do nothing or fall through). Coordinates are
# range-checked as bytes only; nothing here knows the map, so an on-byte-range tile
# can still be off the map.
traps: []
balance_locked: true   # #48 (b): balance-final — CI hard-fails on a parity regression here

# ── Onboarding (what this chapter first teaches) ─────────────────────────────────
introduces:
  - concept: fliers-vs-bows      # bows are effective vs fliers — DEBUT (player flier Pinky + the green chwinga)
    coverage: dialogue           # C-hybrid: in-voice threat call-out (RBG→Pinky, turn 1), not a vanilla tutorial box
    where: "turn-1 RBG→Pinky archer warning — the Chardalyn Hunter threatens flier Pinky & the chwinga"
    status: active

# ── Narrative ──────────────────────────────────────────────────────────────────
narrative: >
  The party rolls west toward Targos in the Rolling Cheddar — their home on runners —
  and is ambushed on the open road by a raider band preying on Ten-Towns traffic. In Targos they find a frozen body
  — the town reads it as a sacrifice the frost druids demand to appease Auril, but
  Rootis recognizes the dagger-of-ice kill as Sephek Kaltro's, the ch00 killer who
  was meant to be dead. Rumor of the Maer Monster off Bremen surfaces at the inn;
  the druids' trail runs north, and the party follows it toward Lonelywood.

# ── Map ────────────────────────────────────────────────────────────────────────
map:
  file: maps/ch02-cold-welcome.mar     # hand-authored on the snow metatiles (ch01 flow)
  tileset: snowy-bern                  # shared winter tileset (#41)
  base_layout: Ch2Map                  # vanilla 15×15 "The Protected", winter-reskinned
  size: "15×15"                 # compact, mirrors FE8 Ch2 (coords top out ~14×14)
  description: >
    Compact snowy road into Targos. The party rolls in aboard the Rolling Cheddar (their
    home on runners, a narrative vehicle — not an on-map unit), and three green chwinga
    are caught on the road just ahead when the raid hits; the chardalyn band holds the far
    edges and converges on them. Tree lines and snowdrifts give terrain-avoid cover on the
    flanks. Reskin of FE8 Ch2: same choke points and spawn geography, arctic palette.
    Terrain types map 1:1 (FE forest → snowy pines, fort → ice cairn, village → Ten-Towns hut).

# ── Objective ──────────────────────────────────────────────────────────────────
# Mirrors FE8 Ch2 "The Protected": DefeatAll with a protect layer. FE8's "protect" is a
# SOFT fail — you lose the green ally/village if too slow, not a game over (Ross/Garcia
# are green allies you shield, not a hard escort). Ours: three GREEN chwinga (harmless
# snow-spirits, lightly armed) are the protected allies. The signature beat is PER-UNIT
# soft-fail: a chwinga that dies forfeits ITS OWN charm-gift only (a flag is set on its
# death and checked at chapter end), never a game over. Hard lose = party wiped (lord rule).
objective:
  type: defeat_all
  description: "Defeat the raider band; keep the chwinga alive to claim their charms"
  constraint:
    type: protect_green_allies
    units: [chwinga-mote, chwinga-rime, chwinga-glimmer]
    description: "Each chwinga that survives gifts a charm at chapter end (per-unit soft-fail)"
    fail_is_soft: true          # a fallen chwinga forfeits only its own gift, not the chapter

win_condition: all_enemies_defeated
lose_condition: all_player_units_defeated         # FE8 lord rule; chwinga loss is a per-unit soft penalty
soft_penalty_on_chwinga_loss:
  description: "Each chwinga that dies forfeits its own charm-gift; surviving chwinga still gift theirs."

# ── Difficulty ─────────────────────────────────────────────────────────────────
difficulty_note: >
  Teaches protect-the-vulnerable: three green chwinga sit where the raid converges, so
  the party must hold a perimeter around them rather than rush forward. The chwinga ride
  the Pegasus chassis (verified balance match to vanilla's Ross+Garcia green help), and
  the single enemy ARCHER hard-counters fliers (iron bow vs three pegasi) — that bow IS
  the protect tension. All-physical roster (axe + one bow) keeps the weapon triangle
  readable — no enemy magic yet (FE8 fields no enemy casters until ~Ch5–6; our first is
  the Ch4 frost druid). Comfortable vanilla-FE hit rates (~75%). One reinforcement pair
  enters turn 3 from the edge OPPOSITE the boss to flank a party that has pushed forward
  (FE8's pattern). Parity bar: vanilla enemies + 3 green chwinga ≈ vanilla Ch2 (5 raiders
  + green Ross/Garcia) — the chwinga are the swing factor, not enemy-level inflation.

# ── Deployment ──────────────────────────────────────────────────────────────────
# Field parity (decisions.md §"Field parity", 2026-06-10): deploy_limit = vanilla Ch2's
# player deploy-slot count = 5 (Eirika/Seth/Franz/Gilliam/Moulder). Our 8-strong cast does
# NOT widen the field — the prep screen (Pick Units) chooses which 5 take it; the chosen
# lord (#42) is force-deployed. This models our difficulty to vanilla's despite the bigger cast.
deployment:
  deploy_limit: 5
  # [col, row] — the NW entry corner, ringing the parked sled. FIRST PASS (parity intent
  # only): vanilla Ch2's ally tiles land on walls/peaks in Nicolas's hand-retiled paint, so
  # these are authored against THIS map's actual walkable tiles (plains/forest), not vanilla
  # coords. The party rolls in NW; the raid converges from the E/SE. Nicolas to adjust on the paint.
  deploy_slots:
    - [0, 3]
    - [0, 4]
    - [0, 5]
    - [1, 5]
    - [2, 4]
  note: "Pick Units fields 5 of {7 PCs + Baxby} (vanilla Ch2 fields 5). The party rolls in NW; 3 green chwinga sit just ahead, in the raid's path."
  # ── Protected: 2 GREEN chwinga, on vanilla's own green posts ───────────────────
  # Harmless gift-spirits (book: "Starting Quest: Nature Spirits", p25-26). REWORKED
  # 2026-08-30 to vanilla Ch2's actual shape, which we had inverted: vanilla strands Ross
  # (Journeyman, Mov 4, 5 HP, on a FORT, carrying a Vulnerary) and Garcia (Fighter, Mov 5,
  # in FOREST) deep EAST at (10,5)/(10,4) and puts its villages on the PLAYER's side, so
  # six pillaging bandits walk away from the greens while the player races to reach them.
  # Ours had three Mov-7 FLIERS parked one tile in front of the deploy ring -- the most
  # mobile chassis in the chapter, given to the units that are supposed to need rescuing,
  # with nothing pulling the raid off them.
  #
  # They are PRIESTS now, not Pegasus Knights: Mov 5 (Garcia's), ground-bound, staff at
  # D rank so they HEAL EACH OTHER -- adjacent at (10,4)/(10,5), and `cautious` runs
  # AI_A_00 ActionInRange, which tries AiTryDoStaff before any attack. A staff cannot
  # target its own carrier (cp_staff.c AiStaffHealMendRecover skips gActiveUnitId), which
  # is why vanilla hands Ross a VULNERARY and why Rime carries one too.
  # Art: Sclorbo's portrait, map sprite AND battle anim, greenified at build time -- they
  # are his kin, and a chwinga swinging a lance never read right anyway.
  # The retile PRESERVED vanilla's terrain here: (10,4) is FOREST and (10,5) is FORT.
  green_allies:
    - id: chwinga-mote
      name: "Snow Mote"
      fe_name: "Mote"             # <=12 -- name buffer safety
      class: priest
      level: 1
      position: [10, 4]           # vanilla Garcia's post -- FOREST, avoid
      inventory: [heal-staff, vulnerary]   # vanilla arms BOTH greens with a Vulnerary
      donor: {at: [10, 4], allegiance: GREEN}   # Garcia: {AttackInRangeAI, 0, 0} -- hold the
                                # tile, strike what reaches you. `cautious` was already these
                                # bytes; now it is grounded rather than matching by luck.
      gift: hand-axe              # DEVIATION (ch02<->ch03 swap, ADR in decisions.md): vanilla Ch2's Red Gem
                                  # moves to ch03's gem-mine chest; this slot takes ch03's Hand Axe instead.
                                  # Net wealth + item set across ch02+ch03 = vanilla.
    - id: chwinga-rime
      name: "Rime Spark"
      fe_name: "Rime"
      class: priest
      level: 1
      position: [10, 5]           # vanilla Ross's post -- FORT: avoid AND HP regen each turn
      inventory: [heal-staff, vulnerary]   # Ross's own kit: a staff cannot heal its carrier
      donor: {at: [10, 4], allegiance: GREEN}   # Garcia's posture, not Ross's: Ross runs the
                                # scripted-approach AI_B_0A that walks him to this fort, and
                                # ours starts on it. Holding is what we want from both.
      gift: elixir                # ITEM_ELIXIR 0x6D
  # Glimmerfrost is NOT a map unit: she is the inhabitant of the village at (1,12) and
  # hands over the Pure Water when reached -- vanilla's own item on vanilla's own tile
  # (EventScr_Ch2_Village3 gives 0x6E there). Losing her to a raider and losing a chwinga
  # to a raider become the SAME soft-fail, which is what the third charm now measures.


# ── Enemy Units (vanilla FE) ─────────────────────────────────────────────────────
# EXACT vanilla FE8 Ch2 "The Protected" roster (count + level + mix), reskinned as
# CHARDALYN BERSERKERS — Auril-maddened humans (book: Wilderness Encounters #7, p107).
# Zero reskin stretch: maddened humans wield real axes/bow, so they ARE FE8 brigands +
# an archer (in the weapon triangle, src/bmbattle.c sWeaponTriangleRules). Grounded in
# the decomp tables UnitDef_088B4344 (field) + UnitDef_088B44AC (Bazba) + UnitDef_088B4470
# (reinforcements): 4 generic Brigand (L3,L3-drops-vulnerary,L3,L2) + 1 Archer (L1) +
# Bone (named L4, fixed) + Bazba (named L6, Steel Axe). Halvar = Bazba slot, Grukk = Bone
# slot. All Iron-tier except the boss's Steel — exactly how FE8 keeps a breather clean.
enemy_units:
  - id: chardalyn-raider
    name: "Chardalyn Berserker"
    count: 2                          # vanilla 088B4344 #1 + #5 (plain L3 brigands)
    positions: [[9,6],[10,8]]         # converging through the center
    fe_mechanic: axe-brigand    # Brigand class, axe-type weapon → in the weapon triangle
    flavor: "an Auril-maddened raider, frost crusting the skin"
    class: brigand
    level: 3
    autolevel: true
    inventory:
      - id: iron-axe
        damage_type: slashing   # cosmetic label only
    donor: [[10, 12], [7, 14]]  # vanilla's L3 pair: one raids after a turn, one pursues
  - id: chardalyn-scavenger
    name: "Chardalyn Berserker"
    count: 1                          # vanilla 088B4344 #4 — the L3 dropper
    positions: [[6,10]]               # vanilla's SW dropper tile (088B4344 #4 = 6,10)
    fe_mechanic: axe-brigand
    flavor: "scavenges the Targos road for the mad-cold"
    class: brigand
    level: 3
    autolevel: true
    inventory:
      - id: iron-axe
        damage_type: slashing
    donor: [6, 11]              # vanilla's L3 that charges on turn 2
    item_drop: vulnerary        # the one dropper, mirrors vanilla Ch2's vulnerary drop
  - id: chardalyn-skirmisher
    name: "Chardalyn Berserker"
    count: 1                          # vanilla 088B4344 #6 (the lone L2 brigand)
    positions: [[9,8]]
    fe_mechanic: axe-brigand
    flavor: "the youngest of the maddened band"
    class: brigand
    level: 2
    autolevel: true
    inventory:
      - id: iron-axe
        damage_type: slashing
    donor: [12, 5]              # vanilla's L2 -- raids after a turn
  - id: frost-archer
    name: "Chardalyn Hunter"
    count: 1                          # vanilla 088B4344 #2 — the single L1 archer
    positions: [[13,8]]               # eastern treeline (forest avoid), near the boss
    fe_mechanic: archer         # single ranged unit — hard-counters the green pegasi
    flavor: "looses ice-fletched arrows at anything that flies"
    class: archer
    level: 1
    autolevel: true
    inventory:
      - id: iron-bow
        damage_type: piercing
    donor: [14, 9]              # vanilla's lone archer -- charges on turn 2
  - id: raider-bruiser
    name: "Grukk the Bruiser"
    fe_name: "Grukk"            # ≤12 — overrides the vanilla "Bone" slot name plate
    is_miniboss: true
    count: 1
    position: [13, 6]           # guards beside the captain on the eastern edge
    fe_mechanic: axe-brigand    # named mid-tier, guards near the boss (FE8 "Bone" slot)
    flavor: "the captain's right hand, half-gone to the cold"
    class: brigand
    level: 4
    autolevel: false                 # named mid-tier, FIXED bases (vanilla "Bone")
    inventory:
      - id: iron-axe
        damage_type: slashing
    donor: [13, 7]              # vanilla's L4 raider
  - id: raider-captain
    name: "Halvar the Raider Captain"
    fe_name: "Halvar"          # ≤12 — overrides the vanilla "Bazba" slot name plate
    is_boss: true
    count: 1
    position: [14, 5]           # anchored on the far-east edge — the band's far corner
    fe_mechanic: steel-axe-brigand   # the one real threat = FE8's Steel-Axe Bazba mirror
    flavor: "leads the band the chardalyn drove mad — the last to fully turn"
    class: brigand
    level: 6                          # vanilla Bazba is L6 steel-axe (UnitDef_088B44AC)
    autolevel: true                  # boss, modeled exactly on vanilla Bazba
    # NO `personal:` here, deliberately (#284): Halvar DEPLOYS ON THE BAZBA SLOT, so FE8 already
    # adds Bazba's own line (HP+5/Pow+3/Skl+4/Spd+2/Def+2/Res+2/Lck+1) on top of the class base
    # in the built ROM — nothing patches that slot. He fights at HP 29/Def 6 = 3.6 rounds, the
    # bar exactly. The "1.2 rounds" that opened #284 was the measuring tool projecting him off
    # naked class base because it did not know which slot he rides; `ENEMY_BASE_SLOT` in
    # build_campaign.py now tells it. Writing the line here too would be a SECOND source for a
    # fact the slot already owns, free to drift out of agreement with the ROM.
    inventory:
      - id: steel-axe
        damage_type: slashing
    donor: [11, 7]              # Bazba -- and vanilla's boss RAIDS; he is not a throne-sitter
    death_quote: "Should've… paid the toll…"

reinforcements:
  - id: rear-raiders
    name: "Chardalyn Berserker"
    count: 2                          # vanilla reinforcement UnitDef_088B4470 (L2 + L3)
    fe_mechanic: axe-brigand
    class: brigand
    levels: [2, 3]                    # vanilla 088B4470 = one L2 + one L3 brigand
    autolevel: true
    inventory:
      - id: iron-axe
        damage_type: slashing
    trigger_turn: 3
    spawn_edge: opposite_boss        # flanks a party pushed toward the boss (FE8 pattern)
    positions: [[0,6],[0,7]]         # west edge (boss anchors east) — emerge behind a pushed party
    donor: [[0, 9], [1, 9]]     # vanilla's southwest raider pair, beside the southern village

# ── Rewards (no chest — vanilla Ch2 has none) ─────────────────────────────────────
# Vanilla Ch2's loot = three VILLAGE GIFTS (Red Gem / Elixir / Pure Water) + one enemy
# vulnerary drop. Reward ADR (decisions.md §"Reward/item budget"): ch02 parity = FE8 Ch2
# = gems + premium consumables, NO boosters/promos. We deliver the gifts as the chwinga
# charm-gifts (per-survivor) — but with the ch02↔ch03 reward swap: Mote's slot gives a Hand
# Axe (vanilla Ch2's Red Gem moved to ch03's gem-mine chest), Rime = Elixir, Glimmer = Pure
# Water. The enemy drop is the chardalyn-scavenger's vulnerary. No on-map chest (vanilla has none).
# The gift item lives in ONE place — green_allies[].gift above — which the build reads directly.
chests: []

# ── Villages ─────────────────────────────────────────────────────────────────────
# RESTORED 2026-08-30. Vanilla Ch2 wires THREE `Village()` -- (4,2), (7,2), (1,12) -- and
# our retile kept two of its four village-terrain tiles while the events were dropped, so
# the map drew huts that backed nothing. They are not decoration: six of vanilla's nine
# bandits carry pillage-family AI, and pillage targets TERRAIN, so the villages are what
# pull the raid AWAY from the greens while the player crosses to reach them. Remove them
# and the raid has nowhere to go but the protectees -- which is the chapter we had.
#
# (1,12) is vanilla's own southern village tile, and it takes vanilla's own item and beat.
# (12,3) is vanilla's fourth village-TERRAIN cell, which vanilla itself leaves unbacked;
# ours gives it a line so the hut stops promising a reward that is not there.
villages:
  - id: targos-hut-south
    tile: [1, 12]              # vanilla's southern village, same tile: `Village(EVFLAG_TMP(11),
                               # EventScr_Ch2_Village3, 1, 12)` giving 0x6E Pure Water.
    inhabitant:                # the third chwinga -- her charm IS this village's reward,
      id: chwinga-glimmer      # handed over on the visit the way a vanilla village pays
      name: "Glimmerfrost"
      fe_name: "Glimmer"       # <=12 -- name buffer safety
    visit_reward:
      - id: pure-water         # ITEM_PUREWATER 0x6E -- vanilla's item, unmoved
        amount: 1
    # LOCKED 2026-08-30 (dialogue-pass with Nicolas). Boxes 1-3 are vanilla's own MSG_96C,
    # WORD FOR WORD -- this is the contested tile and vanilla already wrote the alarm that
    # belongs on it. Box 4's first line is vanilla's too; only its second line moves, because
    # the token is Glimmerfrost's to give. Her box is the one piece of new writing, and it is
    # wordless: chwinga never speak (lore/sclorbo.md -- "NO quoted speech, ever") and have no
    # face to emote with, so she acts and the text reports it.
    visit_text:
      - resident: "Hm? What is it? What's all the ruckus?"
      - resident: "What? B-bandits?!"
      - resident: "Spread the word, everyone! Close the village gates!"
      - resident: "Thank you for your warning. The little one has a token for you."
      - chwinga-glimmer: "(A snow-spirit unfolds from under the table and presses meltwater on you.)" 
    note: >
      The contested one. Reaching Glimmerfrost before the raiders do is the third charm --
      the same soft-fail as losing a chwinga on the field, measured a different way.
  - id: targos-hut-east
    tile: [12, 3]              # vanilla's unbacked fourth village-terrain cell
    visit_reward: []           # no item: ch02's wealth is fixed at three and all three are spoken for
    # LOCKED 2026-08-30 (dialogue-pass with Nicolas). An INFORMATION house, in vanilla's own
    # reward-free shape (MSG_93B: situation -> how it works -> what to do). A village that
    # gives nothing is a let-down, and ch02's wealth is fixed at three items with all three
    # spoken for -- so this pays in the one fact the chapter never states anywhere else:
    # THE CHWINGA REPAY YOU. Vanilla tells the player Ross and Garcia can be recruited, which
    # is why defending them is worth doing; nothing told ours that the spirits give charms.
    # Not duplicated: ch01's houses teach fort terrain and the boss counter, RBG's turn-1 line
    # teaches fliers-vs-bows, and Halvar's turn-1 bark announces the raid's target.
    visit_text:
      - resident: "Those little masked ones out on the road --"
      - resident: "Show them a kindness and they don't forget it."
      - resident: "They pay in charms. Small things, but good ones." 
    note: >
      A decoy with a line. It sits on the eastern route, so it pulls pillaging raiders off
      the crossing without paying a second time.

charm_gifts:
  note: "Each SURVIVING chwinga gifts its charm at chapter end (gated on the per-unit survival flag); the item is authored per-unit in green_allies[].gift."

# ── Events (pacing / cutscene placement) ─────────────────────────────────────────
events:
  - trigger: chapter_start
    type: cutscene
    ea_file: events/ch02-opening.ea
    description: >
      Bryn Shander west gate — the company rolls out with the Rolling Cheddar and Baxby.
      Vellynne Harpell, an Arcane Brotherhood necromancer on a kobold-drawn sled, stops
      them and sets them on the trail of her stolen orb (the Professor Skant orb; thief =
      Nass Lantomir, both unnamed here), seeding the recurring Brotherhood arc. Tight
      three-hander: Vellynne / RBG / Braulo, with a Meesmickle button. Voice grounding:
      lore/vellynne-harpell.md (register B — icy-formal, no contractions) +
      lore/frostmaiden-voices.md; FE8 cadence per fireemblem8u/texts/texts.txt.
      LOCKED dialogue-pass text below (co-written with Nicolas 2026-06-19). PENDING (not
      this commit): ch02 host wiring + the eventscript that consumes this script, Vellynne's
      cutscene portrait (#19), and the in-game motion review.
    script:                       # LOCKED 2026-06-19 (dialogue pass, co-written with Nicolas)
      - location_card: "Bryn Shander"   # nameplate caps at 96px (3 text sprites); the "West Gate" beat is set by the scene/dialogue below
      # (The Rolling Cheddar groans through the west gate, Baxby in the traces. A second
      #  sled waits in the drifts — no dogs in its harness, only two kobolds, gray and
      #  frost-split, that do not breathe. The woman aboard does not climb down; her hands
      #  shake in her lap, and she stills them.)
      - vellynne: "A moment. You are for the west road — and I have a use for that."
      - vellynne: >-
          There is an orb out there, somewhere in the white. Smoked glass, no bigger than
          a fist. It speaks — and it does not know when to stop. It is mine. One of my
          Brotherhood decided otherwise. Bring it back, and you will be paid.
      - prof-rbg: "...An orb that speaks. And 'paid' comes to how much, precisely?"
      - vellynne: >-
          Enough. But you are not the only ones on this road — and I do not finish second.
          Reach it before she does.
      # (She lifts one trembling hand; the dead things lean into the harness, and the sled
      #  glides off without a sound.)
      - beat_break: B            # Vellynne's face clears (REMA) before the party reacts on a fresh stage
      - meesmickle: "Her sled's pulled by corpses... Wonderful."
      - braulo: "If we cross it, we cross it. We've a road to make."
      - beat_break: C            # REGROUND 2026-06-24 — fresh stage on the chwinga; Sclorbo + Marty (2 faces, clear of FE8's limit)
      # (Just off the road, three chwinga play house in the snow — a stolen plate, pinecones
      #  for a feast. Sclorbo, a chwinga himself, lights up and goes straight to them; the three
      #  swarm him, masks tilting up — kin to kin. Marty crouches and pours a thimble of
      #  Chagaccino onto their little pretend-table.)
      - marty: "Chagaccino?"
      # (The three abandon their pretend-feast for the real one and tumble in at the company's
      #  heels. No one says "protect them" — the spirits are simply with us now; the threat on
      #  the field carries the protect stakes, taught by the RBG→Pinky archer beat below.)
  - trigger: turn_start
    turn: 1
    type: cutscene
    ea_file: events/ch02-archer-warning.ea
    description: >
      Tutorial-parity beat (fliers-vs-bows DEBUT — see `introduces:`). The Chardalyn Hunter
      is on the board from turn 1; RBG — a bow-user himself (Iron Bow) — warns his flier
      "son" Pinky to keep clear of it. Teaches the player the bow→flier lesson that ALSO
      governs shielding the flying chwinga (no one tells the player to protect them; the
      threat does). Vanilla pairs this with the Vanessa rescue tutorial ("pegasus knights
      ...are vulnerable to missile attacks, so watch out for archers"). RBG stays in his
      pun-professor register — mask-drop warmth is reserved for the finale Wish — while Pinky
      takes it to heart. LOCKED 2026-06-24 (dialogue pass, co-written with Nicolas). PENDING
      (not wired): the eventscript + Text_BG fit (RBG's line paginates — it's a portrait

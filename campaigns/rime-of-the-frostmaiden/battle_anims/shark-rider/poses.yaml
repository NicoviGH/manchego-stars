# shark-rider/poses.yaml — arc manifest for tools/poses_to_feditor.py (ch06's shark riders).
#
# The ch06 axe block (three Fighters) wears the FE-Repo `Shark Rider (M) {N426}` map sprite, and
# no shark battle anim exists anywhere in the FE-Repo, so this is the cast's posed-anim path
# applied to an enemy class. The rider is HUMAN-LOOKING on purpose: the map sprite is, and a unit
# has to read as the same thing on the field and in the close-up (crypt-blade's rule, ch05).
#
# SOURCE: `Battle Anims/SharkRiderAnim.jpg` (Gemini, Nicolas 2026-10-05) — the TOP row of three
# poses, idle / windup / action. The sheet came on a cream ground with labels and dark ground
# shadows; the background and shadows were keyed out by flood fill from the border, and the
# poses cut at the empty columns between them (x 334-345 and 688), because their bounding
# boxes overlap and split_pose_sheet reads them as one pose.
#
# THE ATTACK IS A LUNGE, Baxby's charge without the legs: the shark surges across the gap in two
# beats and the axe lands on the foe's near edge. Arc solved as Baxby's was (placement is by
# BBOX CENTRE): dx = w_pose/2 - w_idle/2 - advance, dy = (h_pose - h_idle)/2 + lift.
#   windup_a  advance  8   the surge starts, the axe goes up
#   windup_b  advance 30   same art, further across
#   hit       advance 67   the blade (~18px in from the pose's front edge at this size) on x≈73,
#                          the foe's near edge measured off Lupin and Pinky (see baxby/poses.yaml)
#   dodge     advance -20  the idle art backed off
#     python3 tools/poses_to_feditor.py campaigns/rime-of-the-frostmaiden/battle_anims/shark-rider

canvas: [248, 160]
flip: true                 # the sheet faces right; FE8's enemy side faces screen-left
home: [150, 117]           # y = 141 - target_h/2: on the same ground line as Lupin and Baxby
target_h: 48
outline: true
sharpen: 1.6
reserve:                   # unreserved, the median cut spends the 15 slots on the shark's greys and
                           # the rider washes out grey-beige. Sampled from the source, not invented.
  - [200,  10,  10]        # the tunic red (and an enemy's colour, which suits the line)
  - [150,   5,   5]        # its shadow
  - [200, 150, 100]        # skin
abbr: sharkrider
poses:
  - {name: idle,     src: .src/1_idle.png,   dx:   0,  dy:  0}
  - {name: windup_a, src: .src/2_windup.png, dx:  -7,  dy:  3}
  - {name: windup_b, src: .src/2_windup.png, dx: -29,  dy:  3}
  - {name: hit,      src: .src/3_hit.png,    dx: -67,  dy: -1}
  - {name: dodge,    src: .src/1_idle.png,   dx:  20,  dy:  0}

# npcs/sahnar.yaml — Sahnar, the reawakened moon-elf mummy (ch05 recruit)
# Class roster: docs/CLASSES.md (generated). Rationale: docs/decisions.md §Class Mapping.
# Combat is vanilla FE (docs/decisions.md §Combat). damage_type labels are cosmetic.
#
# STATUS: design record. Class + role LOCKED (Nicolas, 2026-06-20); bases/growths below are
# vanilla Myrmidon CLASS data (data_classes.c [CLASS_MYRMIDON - 1], verbatim) -- the same
# class-generic-data-in-YAML / personal-donor-growths-at-build-time split every other cast
# member uses (STAT_DONOR in build_campaign.py pulls Joshua's actual personal growths at
# injection time; this file is the pre-wiring design record, not the final in-ROM numbers).
# NOT yet wired into build_campaign (inert until the recruit wiring lands: free slot + recruit
# logic + portrait + map sprite + a STAT_DONOR entry).

id: sahnar
name: Sahnar

# LOCKED 2026-08-08 (Nicolas's red-pen on the draft).
# The UNIVERSAL falls-in-battle quote (#6): chapter=0xFF, so it fires in every chapter.
# Built off her turn ("Then my purpose has not changed. Only my true enemy has been revealed"):
# she was GIVEN a purpose and re-aimed it, so dying spent she is settled, not robbed. Per
# sahnar.md the ordeal is named ONCE, flatly, and never begged -- the understatement IS the
# horror -- and she does not grieve aloud.
# Nicolas's revision moves the release onto HER: "I can finally go on" is the watch ending,
# not a duelist dismissing the party ("Go on" was an order to them). The whole point of her
# is that the watch was the ordeal -- so the last line is her being let off it.
death_quote: "Four thousand years I kept a watch. ... I can finally go on..."

# D&D flavor (from the DM notes): a reawakened mummy in the elven tomb who "is happy to
# help the party as long as they can learn more about druids in this time period." A
# moon-elf, freed by the moonlight-brazier puzzle.
dnd:
  class: Mummy (moon-elf)
  race: Elf (undead)

# ── Role (LOCKED 2026-06-20) ─────────────────────────────────────────────────
# MYRMIDON — fills the dedicated sword crit-duelist hole (we have sword ACCESS via Baxby
# + promos, but no Joshua-style duelist). The elegant moon-elf blade fits; undead-magic
# (Druid/Shaman) was the alt but we're already magic-rich, so sword is the coverage win.
fe_stats:
  class: Myrmidon
  level: 1
  # Vanilla FE8 Myrmidon stats, verbatim from data_classes.c [CLASS_MYRMIDON - 1].
  HP: 16
  STR: 4
  SKL: 9
  SPD: 9
  DEF: 2
  RES: 0
  LCK: 0                    # ClassData has no base luck
  MOV: 5                    # Myrmidon baseMov
  CON: 8
donor:
  character: Joshua         # vanilla Myrmidon — bases/growths reference (data_classes.c)
  why: the game's crit-sword duelist archetype

# ── Growth Rates (% per level) — vanilla Myrmidon growths from data_classes.c ─
growth_rates:
  HP: 70
  STR: 35
  SKL: 40
  SPD: 40
  DEF: 15
  RES: 20
  LCK: 30

promotion:
  branch: [Swordmaster, Assassin]  # vanilla FE8 Myrmidon branch (classchg-data.c [CLASS_MYRMIDON])
  default: Swordmaster

recruited_via: "story — talked down by Basil after Ravisin summons her (Ch5)"
recruit:
  chapter: ch05-the-elven-tomb
  via: story                # on-map Talk: she is placed, then a CHAR/CUSA flips her (ON_MAP_RECRUIT_VIA)
  initial_faction: red      # the Joshua flip -- Ravisin calls her up HOSTILE on screen in ch05's
                            # scene 3 and she guards the arena from turn 1 (chapter YAML's
                            # `convertible: true`); only Basil's Talk turns her. GREEN is the
                            # default; this opt-in is what recruit_initial_faction reads.

# ── Art (SHIPPED 2026-07-17 — spectral-skeleton direction, Nicolas's call) ────
# Direction change from the design-record "mummy": the FE + broader sprite community has NO
# elegant mummy bust/anim — only skeletal undead. Rather than generate custom art, Sahnar became
# a hooded SKELETAL revenant blademaster (still the reawakened-elf beat; skeleton reads cleaner
# than a green zombie and everything MATCHES across the trio). Decision + sweep: docs/decisions.md
# §Art & Audio "Adopting non-FE sprite sources".
art:
  approach: adopted           # community skeletal-undead assets reskinned to the cast palette; no generation
  portrait:                   # portraits/sahnar.png (+_preview) — APPROVED 2026-07-17
    source: "portraits/vendor/Skeleton Assassin {Glaceo} [F2E].png"   # FE-Repo hooded skeletal assassin bust
    recipe: >
      crop the 96x80 main frame from the 128x112 mug; recolor the red hood/cloak to the map
      sprite's exact slate ramp (deep shadow -> dark slate bulk -> slate highlight, matching
      map_sprites/sahnar.png cloak idx1+idx10); key the green bg to transparent; quantize <=15
      colours. Skull/bone left as-is (already matches the sprite bone). Deadzone verified clean.
    static: true              # no mouth-flap / blink, like the other custom busts
    credit: "Glaceo (FE-Repo, F2E); see CREDITS.md"
  map_sprite:                 # SHIPPED (map_sprites/sahnar{,_mu}.png); palette applied by Nicolas
    base: Bonewalker          # geometry donor: {3 frames, UNIT_ICON_SIZE_16x16} wait-table row
                              # (unit_icon_wait_data.c // 69), which is Sahnar's 16x48 sheet
                              # exactly. Was written "Bonewalker/Specter" -- prose naming the
                              # ART source, not a donor row, and it hard-failed the lookup.
                              # The Specter is the SPRITE this is drawn from; see `source`.
    source: "Bonewalker (U) Specter {Alexsplode} — FE-Repo Map Sprites/Monsters - Basic Types"
    recipe: >
      cast-palette match (bone -> tan/white/grey, cloak -> dark slate idx1+idx10, spectral cyan
      glow dropped for a solid-skeleton read); final index swaps applied by Nicolas in
      map_sprite_swapper. Validates UNIT_ICON_SIZE_16x16 x3 (SMS) + 32x32 x15 (MU).
    palette: cast
    credit: "Alexsplode (FE-Repo, F2E); see CREDITS.md"
    # ── Pre-recruit look: RED while she guards the tomb, the slate cast sheet above once
    # Basil's Talk brings her over -- the same call Lupin's YAML makes, and for the same
    # reason: a charId-keyed cast override is unconditional, so without this she renders in
    # her finished slate WHILE HOSTILE, and FE reads that greyed-out look as "already acted".
    # Derived at build time by remapping cast indices onto the donor's standard SMS roles, so
    # every pixel edit to the slate sheet flows into the red one. Her CLOAK (idx1 deep shadow
    # + idx10 slate bulk) rides the faction ramp 7/9 -- that is the part that must change side
    # colour. Bone is bone on either side: idx3/4/11 -> the neutral greys, idx5 tan unchanged.
    # Note idx1 is BOTH the cloak's shadow and the sprite outline, so the outline tints with
    # it; at 16x16 that reads as a dark-red edge, which is what vanilla enemies have anyway.
    pre_recruit_roles: {1: 7, 3: 4, 4: 14, 5: 5, 10: 9, 11: 3}
  battle_anim:                # VENDORED 2026-08-07 (#25). Provenance only -- the `battle_anim:`
                              # block at the bottom of this file is what the injector reads.
    source: "[Skeleton-Custom] [U] Specter {Alexsplode} — FE-Repo Battle Animations/Monsters - Basic Types/1. Sword"
    vendored: battle_anims/sahnar/   # Sword.txt + Sword_000..100.png, fetched verbatim
    palette: native           # Nicolas: it is polished and consistent on its own — do NOT recolor
                              # it to the cloak; the skull and its glow are the throughline. So no
                              # `recolor` is passed to build_import, unlike the enemy reskins.
    credit: "Alexsplode (FE-Repo, F2E); see CREDITS.md"

# ── Battle anim (the block the injector reads) ───────────────────────────────
# IMPORTED, not faked: this is a complete FE-native animation (12 modes, 101 distinct frames),
# so there is nothing to fake -- the .txt owns the cadence, the sound codes and the per-frame
# canvas positions, exactly like Pinky's swoop and Lupin's pounce. Vendored verbatim; the only
# edit to the pipeline it needed was teaching parse_feditor FEditor's `L` loop bracket, which
# this script is the first vendored anim to use (its two RANGED modes -- 5 and 6 -- which a
# sword Myrmidon never plays, but which still have to parse).
#
# clone_from: myrmidon gives the ITYPE_SWORD slot and nothing else; the binding is per-CHARACTER
# via _u25, so CLASS_MYRMIDON and every generic Myrmidon stay byte-vanilla.
battle_anim:
  clone_from: myrmidon
  abbr: sahnar
  import:
    txt: sahnar/Sword.txt
    frames_dir: sahnar

# npcs/trex.yaml — Trex, the winged kobold (ch03 recruit)
# Class roster: docs/CLASSES.md (generated). Rationale: docs/decisions.md §Class Mapping.
# Combat is vanilla FE (docs/decisions.md §Combat). damage_type labels are cosmetic.
#
# STATUS: design record. Class + role LOCKED (Nicolas, 2026-06-20); bases/growths below are
# vanilla Thief CLASS data (data_classes.c [CLASS_THIEF - 1], verbatim) -- the same
# class-generic-data-in-YAML / personal-donor-growths-at-build-time split every other cast
# member uses (STAT_DONOR in build_campaign.py pulls Colm's actual personal growths at
# injection time; the in-ROM numbers are Colm's, via STAT_DONOR).

id: trex
name: Trex
fe_name: Trex                            # already short; explicit for the <=12-char name buffer
# Falls-in-battle quote (#6 dialogue pass; lore/trex.md). Self-taught eloquent diplomat to
# the last -- negotiator's diction ("trade", "term"), dignity over groveling, and the mask of
# eloquence slipping to his one real subject: the warren's survival.
death_quote: "Ah -- a poor trade, in the end. See my people safe... that was the only term that ever mattered."

# D&D flavor (from the DM notes): the kobold leader in the Termalaine gem mine — "a
# slightly smarter kobold who fashioned cosmetic wings for himself." Joins post-chapter.
dnd:
  class: Kobold (winged)
  race: Kobold

# ── Role (LOCKED 2026-06-20) ─────────────────────────────────────────────────
# THIEF — fills the army's utility hole (steal / chests / doors); the campaign gives us
# no other thief. Cleverness fits; Assassin promotion also adds a sword. The "cosmetic
# wings" are exactly that — cosmetic art, NOT a flier (Thief is a foot unit).
fe_stats:
  class: Thief
  level: 2                  # Colm's baseLevel: his personal line IS his L2 line, and he joins
                            # vanilla Ch3 at L2 -- the chapter trex joins in (#403, ADR 0321)
  # Vanilla FE8 Thief stats, verbatim from data_classes.c [CLASS_THIEF - 1].
  HP: 16
  STR: 3
  SKL: 1
  SPD: 9
  DEF: 2
  RES: 0
  LCK: 0                    # ClassData has no base luck
  MOV: 6                    # Thief baseMov
  CON: 6
donor:
  character: Colm           # vanilla Thief — bases/growths reference (data_classes.c)
  why: the game's starter Thief = full growth runway for a fresh utility unit

# ── Growth Rates (% per level) — vanilla Thief growths from data_classes.c ────
growth_rates:
  HP: 50
  STR: 5
  SKL: 45
  SPD: 40
  DEF: 5
  RES: 20
  LCK: 40

promotion:
  branch: [Rogue, Assassin]  # vanilla FE8 Thief branch (classchg-data.c [CLASS_THIEF])
  default: Rogue

# ── Inventory — the FIGHTING kit (an iron sword: a Thief fights, weakly, like vanilla Colm).
#    This is what difficulty.py reads (_weapon_for) to model him as a combatant; without it he
#    resolved to the staff/support path (0 throughput) as if a healer. The steal/unlock utility
#    (door + chest keys + vulnerary) rides the DEPLOY loadout CLASS_LOADOUT['CLASS_THIEF'], not
#    the combat model. fe_base = vanilla FE8 stats (Mt/Hit/Crit/Wt), no custom tuning.
inventory:
  - id: iron-sword
    name: "Iron Sword"
    fe_base: iron-sword
    fe_weapon_type: Sword
    damage_type: slashing           # cosmetic flavor label only

recruited_via: "story — joins after the Termalaine mine (Ch3)"
recruit:
  chapter: ch03-the-termalaine-mine
  via: story

# ── Art (reskin lever: stock chassis, custom skin) ───────────────────────────
art:
  render:                     # exact reproduction of the shipped bust (tools/ref_to_bust.py)
    ref: "References/PCs/TrexBust.png"   # winged-kobold bust ref (supplied by Nicolas, 2026-07-07)
    crop: [54, 95, 894, 795]       # ref pixels, ~1.2 aspect — head + shoulders (framing A, Nicolas's pick 2026-07-07)
    zoom: 0.85                     # headroom kept by choice at the 2026-10-10 rescale review
    flip_h: false                  # ref already faces FE8-canonical screen-left
    sharpen: 0                     # off (clean ref + pngquant is already crisp)
    hand_pass: null
  approach: custom            # winged kobold over the Thief chassis (art-only reskin; mechanics stay vanilla Thief)
  fidelity: faithful          # keep the kobold/dino anatomy — do NOT humanize
  must_keep:                  # the tells that make the crop read as "Trex"
    - red scaled dino/kobold snout (elongated, toothy underjaw)
    - swept-back horns + spiny frill
    - brown leather goggle/eye-piece over one eye, gold slit eye
    - brown coat + cream underscales at the collar
  face: per-concept           # head as drawn (red kobold), not a human face
  expression: wry-confident   # the sly-thief energy that carries the steal/chests lesson
  palette_plan: >             # rough 16-color budget (incl. index-0 transparent)
    reds ×3 (scales) + dark maroon shade, cream/tan underbelly ×2, browns ×3
    (coat / goggle / straps), gold eye, grey buckles, black outline. Fits 16.
  map_sprite:                 # overworld idle/walk base (#38 art loop) — SHIPPED (map_sprites/trex{,_mu}.png)
    base: Thief               # geometry token only; Trex IS a Thief mechanically (16x16 idle / 32x32 MU)
    footprint: 16x16
    source: "Brigand (U) Lizard Wildling {Tarantino500}"  # FE-Repo reptile sprite (CREDITS.md); shared w/ the ch3 kobold grunts
    recolour: >                # RGB-mapped onto cast_palette.png (red body, tan belly, dark outline), then
      hand-tuned in tools/map_sprite_swapper.py. The donor's eye colour (#e81018) maps to the cast GOLD
      (index 12, #cb9d02) so the eyes read distinct against the red -- the "glowing eyes" pop (Nicolas).
    weapon: donor-axe          # the Lizard Wildling carries an axe; cosmetic only (Trex steals as a Thief)
    todo:                      # not yet applied (rides a later pass / pixel editor)
      - swept-back horns + small cosmetic wings (the "winged kobold" tell; distinguishes Trex from the grunts)
  battle_anim:                # VENDORED 2026-10-05 (#461). Provenance only -- the `battle_anim:` block
                              # at the bottom of this file is what the injector reads.
    source: "[Sword FE16 Custom] Dino Dread Fighter [U] — FE-Repo Battle Animations/Infantry - (Swd) Myrms and Swordmasters/1. Sword"
    vendored: engine/battle_anims/_vendored/dino-dread-fighter/sword/
    why: >                    # Nicolas's pick over the Lizardzerker (a greatsword, wrong for a Thief)
      and the Thief-reskin Goblin (right motion, a goblin's head): a red-scaled reptile with a
      short curved blade, the only FE-Repo anim that already reads as Trex.
    palette: battle_anims/trex/palette.json   # by hand (tools/banim_palette.py): the salmon scales
                              # onto his bust's crimson, the gold armour onto his brown LEATHER
                              # coat (indices 5-8 / 10,12,13). Steel, sash, crest and outline stay native.
                              # His gold eye is not reachable: it is drawn in the outline index.
    credit: "Nuramon (animation), Seliost1 (dino variant), FE-Repo, F2U/F2E; see CREDITS.md"

# ── Battle anim (the block the injector reads) ───────────────────────────────
# IMPORTED, not faked: a complete FE-native sword script, read straight out of the vendored tree
# (`vendored:`), so the frames exist once. clone_from: thief gives the SWORD + ITEM slots bound
# per-CHARACTER via _u25, so CLASS_THIEF and Colm stay byte-vanilla.
battle_anim:
  clone_from: thief
  abbr: trex
  import:
    vendored: dino-dread-fighter/sword
    txt: Sword.txt
    palette_edit: trex/palette.json

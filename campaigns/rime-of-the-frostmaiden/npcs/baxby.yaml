# npcs/baxby.yaml — Baxby the axe-beak (ch01 recruit; the party's sled-puller / mount)
# Class roster: docs/CLASSES.md (generated). Rationale: docs/decisions.md §Class Mapping.
# Combat is vanilla FE (docs/decisions.md §Combat). damage_type labels are cosmetic.
#
# STATUS: WIRED (#23 recruit pass). Baxby is a real classed cast member (PORTRAIT_MAP ->
# Forde slot, STAT_DONOR -> Franz). Recruited by the ch01-ending cutscene (Marty wins him
# over), so cast_available_at() puts him on the ch02+ prep roster automatically -- no on-map
# recruit event (that's Trex's Colm-style talk recruit). His hand-painted custom map sprite
# (map_sprites/baxby.png, cast palette) injects like every other 32x32 cast sprite -- same
# base: Gargoyle / synth-MU pattern as braulo/wolfram/meesmickle (see art.map_sprite below).

id: baxby
name: Baxby
help_text: "An axe beak who hauls the party's sled. Strong, steady, and loyal."   # R on the name in game (fe8_talk_font.HELP_TEXT_BUDGET_PX)
# fe_name not needed — "Baxby" is 5 chars, well under FE8's 12-char name buffer.
# Falls-in-battle quote (#6). Register from his ch01-ending recruit lines (ch01 YAML):
# a gruff, dignified veteran teamster — "honest terms / hauled freight over this ice" —
# so his death is a hauler's, framed as the load and the road, not sentiment.
death_quote: "...Load's too heavy now. Get the sled home without me — that was always the job."

# ── Recruit ──────────────────────────────────────────────────────────────────
# Purchased at the Bryn Shander market for 200 GP (ch01 post_chapter); first recruit.
# Won over in the ch01 ending cutscene (Marty's promise of food + shelter).
recruit:
  chapter: ch01-the-iron-trail
  cost_gp: 200
  via: market               # post_chapter.units_available_to_recruit

# ── Donor class (Nicolas, 2026-06-17) ────────────────────────────────────────
# Use the SECOND mounted unit the vanilla game gives you — FRANZ, the fresh Cavalier —
# NOT Seth, the prepromote Paladin (Jagen) with little growth runway left. Baxby is a
# fresh Cavalier so he keeps full growth potential over the campaign. (Franz's actual
# CHARACTER slot is taken by Wolfram in our hack, so Baxby rides a free slot authored to
# the Cavalier class profile below; Franz's character growths 80/40/40/50/25/20/40 are
# the reference if we want to nudge him toward the fresh-cavalier ceiling at balance.)
donor:
  mounted_order: 2          # Seth(Paladin)=1, Franz(Cavalier)=2
  character: Franz
  why: fresh Cavalier = full growth runway (vs Seth's promoted Jagen)

# ── FE8 stats (vanilla Cavalier class data, verbatim from data_classes.c) ─────
# Authored FE-style (no 5e conversion). Sword + Lance mount; beak/claws are flavor on a
# vanilla lance/sword (the weapon TYPE drives the triangle, the bird look rides the art).
fe_stats:
  class: cavalier
  level: 1
  HP: 20
  STR: 5
  SKL: 2
  SPD: 5
  DEF: 6
  RES: 0
  LCK: 0                    # ClassData has no base luck
  MOV: 7                    # Cavalier baseMov (mounted)
  CON: 9

# ── Promotion (FE8 branched Cavalier) ─────────────────────────────────────────
promotion:
  branch: [paladin, great-knight]   # vanilla Cavalier branch (classchg-data.c [CLASS_CAVALIER])
  default: paladin

# ── Inventory (joins with stock gear) ─────────────────────────────────────────
inventory:                        # the kit the unit joins with, in slot order (inject.cast.unit_items)
  - id: iron-lance
    name: "Iron Lance"
    fe_base: iron-lance
    fe_weapon_type: Lance
    damage_type: piercing           # the beak: his lead weapon, so FE8 equips it first; ch04 locks on it
  - id: iron-sword
    name: "Iron Sword"
    fe_base: iron-sword
    fe_weapon_type: Sword
    damage_type: slashing           # cosmetic flavor label only
  - id: vulnerary
    name: "Goodberry"             # reflavored Vulnerary (party-wide name; see campaign.yaml item_names)
    fe_base: vulnerary

# ── Battle animation (#206) ────────────────────────────────────────────────────
# Baxby rides CLASS_CAVALIER so the axe-beak can BE a mounted playable unit, and until this
# existed the vanilla Cavalier anim rendered him as a man on a horse — the same defect Lupin
# had, on the same class. All three of the donor's weapon slots are repointed at this one
# custom anim (BANIM_DONORS['cavalier']: SWORD, LANCE and the unarmed/ITYPE_ITEM entry — any
# slot left vanilla is a slot where the bird is a horseman, and his kit above is Sword+Lance
# so both fighting slots are live). The donor class and every generic Cavalier stay
# byte-vanilla: the binding is per-CHARACTER via `_u25` (decisions.md → Art & Audio).
#
# IMPORTED, not faked: his attack IS travel — he runs the gap and lands the beak — and the
# faked 3-pose path deliberately PINS the feet. Same call as Lupin's pounce and Pinky's swoop.
# Source poses + the arc + the approved body height (50) live in battle_anims/baxby/poses.yaml;
# the motion script and its sound cadence live in Baxby.txt, read off FE8's own ground charger
# (`banim_bae_at1`, the Bael) — a creature that crosses on its LEGS and walks back — with every
# horse sound deliberately left on the shelf.
battle_anim:
  clone_from: cavalier
  abbr: baxby
  import:
    txt: baxby/Baxby.txt
    frames_dir: baxby

# ── Art ────────────────────────────────────────────────────────────────────────
# Portrait + map sprite are DONE (committed). Battle anim: see battle_anim above (#206).
art:
  approach: vendor-reskin
  render:                             # portraits/baxby.png — byte-reproducible bust
    ref: "References/PCs/Baxby.png"   # axe-beak art from the Frostmaiden book, Gemini-modified (Nicolas)
    crop: [780, 18, 1920, 940]
    matte: "342720"   # outline colour painted over the keyed bg before the downscale: no light edge halo
    flip_h: true                      # face FE8-canonical screen-left
    zoom: 1.05                        # vanilla face scale: the top just reaches the frame edge (Nicolas, 2026-10-10)
    hand_pass: null
    credit: "WotC book art (axe-beak) + Google Gemini; see CREDITS.md"
  map_sprite:                         # map_sprites/baxby.png — hand-painted by Nicolas (cast palette)
    base: Gargoyle                    # 32x32 3-frame geometry token (SAME as braulo/wolfram/meesmickle);
                                      # geometry only, not the visible sprite. NOT the FE-Repo source name.
    source: "Chocobo Rider (F) Lance {SkidMarc25}"   # FE-Repo pixels; rider+lance stripped, snowy recolor
    footprint: 16x16                  # sprite frame is 32x32 but the mount reads party-scale
    palette: cast                     # cast_palette.png (cast OBJ bank); synth MU (no committed _mu)
    credit: "FE-Repo Chocobo Rider {SkidMarc25}; see CREDITS.md"

# campaign.yaml — Manchego Stars: Rime of the Frostmaiden
# Read by tools/build-campaign.ts at build time.
# See docs/PRD.md §6.4 for the engine/content contract.

title: "Manchego Stars: Rime of the Frostmaiden"
id: rime-of-the-frostmaiden

chapters:
  count: 7
  list:
    - ch01-the-iron-trail
    - ch02-cold-welcome
    - ch03-the-termalaine-mine
    - ch04-the-elven-tomb
    - ch05-the-maer-monster
    - ch06-blood-in-bremen
    - ch07-the-eastway-ambush

progression:
  # FE level all PCs begin at (equivalent to D&D level 1–3)
  starting_fe_level: 1
  # FE level expected at end of chapter 7 (equivalent to D&D level 5–7)
  target_end_level: 12
  # All PCs promote at this FE level (not required within MVP scope)
  promotion_threshold: 20
  # Level cap for this campaign (unpromoted)
  level_cap_unpromoted: 20
  # Promoted level cap
  level_cap_promoted: 20

# Starting equipment GP (between-chapter shop budget estimate)
starting_gold: 500

permadeath:
  # "classic" or "casual" — player chooses via FE8's built-in toggle
  default_mode: classic
  casual_flavor: "retreated to the sled / carried to safety by Baxby"

# World map: Ten-Towns locations (FE8's world map system, sequential unlock)
world_map:
  - id: bryn-shander
    name: "Bryn Shander"
    unlocks_at_start: true
    shop: general   # weapons, basic armor, standard consumables
  - id: targos
    name: "Targos"
    unlocks_after: ch01
    shop: armory    # better weapons, cold-weather gear
  - id: termalaine
    name: "Termalaine"
    unlocks_after: ch02
    shop: specialty # gems, mining equipment, unusual items
  - id: lonelywood
    name: "Lonelywood"
    unlocks_after: ch03
    shop: vendor    # potions, basic consumables
  - id: bremen
    name: "Bremen"
    unlocks_after: ch06
    shop: harbor    # water-themed items, potions — run by Messie after ch06
  - id: easthaven
    name: "Easthaven"
    unlocks_after: null  # never a friendly visit in MVP

# Enemy class reskins (#21): clone a vanilla class into an otherwise-unused class slot
# with a custom MAP sprite only (stats + battle anim ride along unchanged), so enemies
# of that class show a themed overworld sprite without touching the shared vanilla class.
# Reversible + reusable; build wiring = build_campaign.inject_enemy_class_reskins. Each
# `sprite` resolves map_sprites/<sprite>.png (idle) + <sprite>_mu.png (walk); reskins
# sharing a sprite share one sheet. The slots are vanilla's unused ballista-empty classes
# (unreferenced by this campaign). `frame` (optional) overrides the idle frame size when
# the sprite isn't the base class's size class -- the Fire Imp is a tall 16x32 sprite on
# a 16x16-combat soldier/fighter, which the engine draws via the wait-row size flag.
# Ch1 grunts (the "Foaming Mugs goblins") use these; the chief stays the vanilla Knight.
# The Fire Imp {Alexsplode, FE-Repo} reads as a red imp under the enemy faction palette
# (its body sits on the standard faction-colour ramp -> fully shaded red, glowing eyes).
enemy_class_reskins:
  # #90: the ch1 "Foaming Mugs" grunts animate as the Goblin Spearman {Battle of Wesnoth,
  # scripted Norikins; FE-Repo} -- lance-only, so ALL weapon slots of both goblin classes point
  # at the one spear anim (Nicolas: "the spear for all goblins"), i.e. the axe fighter swings a
  # spear too. Palette is the anim's native colours for now (a red/imp match is a follow-up pass).
  - id: goblin-soldier
    base: CLASS_SOLDIER
    slot: CLASS_BLST_REGULAR_EMPTY
    sprite: fire-imp
    frame: 16x32
    battle_anim:
      source: goblin-spearman
      weapons:
        - {dir: lance, txt: Lance.txt, abbr: gsol_lc,
           wtypes: ["0x0100 | ITYPE_LANCE", "0x0100 | ITYPE_ITEM"]}
  - id: goblin-fighter
    base: CLASS_FIGHTER
    slot: CLASS_BLST_LONG_EMPTY
    sprite: fire-imp
    frame: 16x32
    battle_anim:
      source: goblin-spearman
      weapons:
        - {dir: lance, txt: Lance.txt, abbr: gfig_lc,
           wtypes: ["0x0100 | ITYPE_AXE", "0x0100 | ITYPE_ITEM",
                     "ITEM_AXE_HANDAXE", "ITEM_AXE_TOMAHAWK", "ITEM_AXE_HATCHET"]}
  # Ch3 (#23): the Termalaine kobolds. Grunts (axe/thrower/steel/key-droppers) ride the
  # Brigand chassis reskinned to the Lizard Brigand Wildling {map sprite Tarantino500,
  # battle anim Lenh; FE-Repo}, which reads as a red reptile under the enemy faction palette.
  # 16x32 tall sprite on a 16x16 brigand, like the Fire Imp. (archer + thief stay vanilla so
  # the player can read the class -- Nicolas.) Rides its OWN appended class id (`slot_id`),
  # not a scarce vanilla ballista-empty: the append machinery is proven (the Lizardzerkers
  # below), so each custom creature gets a dedicated slot and CLASS_BLST_KILLER_EMPTY stays
  # free (#90 re-slot).
  - id: kobold-grunt
    base: CLASS_BRIGAND
    slot: CLASS_BRG_LIZARD_WILDLING
    slot_id: 0x82
    sprite: lizard-wildling
    frame: 16x32
    # #90: the kobold grunts now ANIMATE as the Wildling in the battle close-up too (not just
    # the map sprite) -- a real FE-native community anim {Lenh, FE-Repo} imported whole by
    # feditor_to_banim and class-bound via ClassData.pBattleAnimDef. One anim per weapon-mode
    # the Brigand AnimConf keys (axe / thrown handaxe family / unarmed); wtypes match that
    # donor AnimConf verbatim. Palette is the anim's native colours for now (a red/enemy
    # palette-match pass is a follow-up refinement).
    battle_anim:
      source: wildling
      recolor: enemy_red            # the Wildling ships an ally-blue palette; kobolds are always
                                    # hostile, so recolour the faction-blue clothing to enemy red
      weapons:
        - {dir: axe,     txt: Axe.txt,     abbr: kgru_ax, wtypes: ["0x0100 | ITYPE_AXE"]}
        - {dir: handaxe, txt: Handaxe.txt, abbr: kgru_ha,
           wtypes: ["ITEM_AXE_HANDAXE", "ITEM_AXE_TOMAHAWK", "ITEM_AXE_HATCHET"]}
        - {dir: unarmed, txt: Unarmed.txt, abbr: kgru_un, wtypes: ["0x0100 | ITYPE_ITEM"]}
  # The lone blade-kobold (Kobold Skirmisher) rides the Mercenary chassis reskinned to the
  # Lizardzerker {Seliost1, FE-Repo} -- a beefier reptile distinct from the Wildling grunts.
  # The three vanilla ballista-empties are used up (soldier/fighter=Fire Imp, brigand=
  # Wildling), so this rides a NEW class id appended past 0x7F (`slot_id`): the build extends
  # the enum + clones CLASS_MERCENARY into it (_append_new_reskin_slots). Combat stays vanilla
  # mercenary (map-sprite-only; battle-anim import is the #90 gap). ch03 roster points its
  # `mercenary` slot at this class via CH03_CLASS_IDS.
  - id: kobold-blade
    base: CLASS_MERCENARY
    slot: CLASS_MNC_LIZARDZERKER
    slot_id: 0x80
    sprite: lizardzerker
    frame: 16x32
    # #90: animates as the Lizardzerker {Seliost1, FE-Repo} in battle too (sword grunt).
    battle_anim:
      source: lizardzerker
      recolor: enemy_red
      weapons:
        - {dir: sword,   txt: Sword.txt,   abbr: kbld_sw, wtypes: ["0x0100 | ITYPE_SWORD"]}
        - {dir: unarmed, txt: Unarmed.txt, abbr: kbld_un, wtypes: ["0x0100 | ITYPE_ITEM"]}
  # The steel-axe BRUTE (kobold-steel, the grell's enforcer) is the biggest kobold, so it
  # wears the Lizardzerker too -- but it must stay a Brigand (steel axe + stats + parity), so
  # it rides its OWN appended class that clones CLASS_BRIGAND and shares the lizardzerker sheet
  # (the injector de-dups by `sprite`, so 0x80 and 0x81 share SMS row 119 / one move sheet).
  # The plain axe/thrower/key grunts stay the squat Wildling; blade + brute are the tall
  # Lizardzerkers. ch03 kobold-steel points its DEPLOY class here via `deploy_class` while
  # keeping `class: brigand` for the parity engine.
  - id: kobold-brute
    base: CLASS_BRIGAND
    slot: CLASS_MNC_LIZARDZERKER_BRUTE
    slot_id: 0x81
    sprite: lizardzerker
    frame: 16x32
    # #90: the steel brute animates as the Lizardzerker's AXE modes (Brigand chassis).
    battle_anim:
      source: lizardzerker
      recolor: enemy_red
      weapons:
        - {dir: axe,     txt: Axe.txt,     abbr: kbru_ax, wtypes: ["0x0100 | ITYPE_AXE"]}
        - {dir: handaxe, txt: Handaxe.txt, abbr: kbru_ha,
           wtypes: ["ITEM_AXE_HANDAXE", "ITEM_AXE_TOMAHAWK", "ITEM_AXE_HATCHET"]}
        - {dir: unarmed, txt: Unarmed.txt, abbr: kbru_un, wtypes: ["0x0100 | ITYPE_ITEM"]}
  # Ch4 (#24): the wolves Marty's parley wins over. DECLARED BUT NOT YET WORN (#203, Nicolas
  # 2026-08-01): the parley now converts the pack IN PLACE, and CUSN changes a unit's faction,
  # not its class -- so the allies stay Mauthe Doogs in the green NPC palette, and the
  # ugly->handsome upgrade waits on a class-remap hook. The accepted trade-off buys the thing
  # the reload could not: the ally count scales with how many wolves you spared. Kept declared
  # so the hook has its slot and sprite ready. Clones Mauthe Doog, so stats/anim ride along
  # unchanged and the parity read is untouched; `frame` because it is a 32x32 quadruped.
  # Map-sprite only -- a wolf battle anim is logged on #24 (FE-Repo Gwyllgi/Hellhound line)
  # and these are uncontrolled green NPCs, so they rarely swing.
  # Build recipe for map_sprites/lycanroc-pack{,_mu}.png (same source as Lupin's, whose own
  # recipe + credit live in npcs/lupin.yaml; re-fetch the sheet via the DeviantArt oEmbed
  # endpoint -- the raw wixmp URL 401s):
  #   1. Sheet is 8 cols x 16 rows of 32px. Midday Lycanroc = rows 4-7 (down/left/right/up).
  #      Cols 0-3 = the NORMAL brown variant -- this pack. (Cols 4-7 are the shiny blue one
  #      Lupin was built from, which is why he and his wolves are the same animal.)
  #   2. wait = 32x96, down-idle bob: row 4, frames 0,1,2.
  #      mu   = 32x480, side row5 / down row4 / up row7, each [0,1,2,3,0]; right = engine H-flip.
  #      No glasses -- those are Lupin's alone, and they are what makes him readable as the
  #      one intelligent wolf worth talking to.
  #   3. Authored DIRECTLY in the standard SMS palette (the Mauthedoog wait sheet's), so the
  #      build's remap_sms_palette pass is an identity and the GREEN NPC palette does the
  #      colouring. Source RGB -> standard index, by role (Nicolas picked body-on-the-ramp,
  #      vanilla Gwyllgi's idiom, over faction-mane-on-brown-body, vanilla Mauthe Doog's):
  #        body    c7a28d->9  8d7466->8  65544a->7  413833->7
  #        mane    ffffff->14 b8b5af->13            (constant white/grey: stays white in
  #                                                  every faction, so green reads as fur)
  #        head    504f4e->7  4b453f->7  2a2725->15
  #        detail  101010->15 (outline)  b2629c->6 (inner-ear wedges)  808080->13
  #        eyes    5caaee/5581c5/5892d6 -> 12       (yellow in every faction, cf. Gwyllgi)
  - id: lycanroc-pack
    base: CLASS_MAUTHEDOOG
    slot: CLASS_MTD_LYCANROC_PACK
    slot_id: 0x83
    sprite: lycanroc-pack
    frame: 32x32

# Item name overrides: rename a vanilla item's in-game text globally (build wiring =
# build_campaign.inject_item_names, which rewrites gItemData[].nameTextId's message).
# FE8 stores ONE name per item id, so every copy reads the same -- the cast's per-unit
# inventory `name:` fields (Healing Potion / Blood Vial / ...) are documentation only and
# can't differ in-engine. The reflavored Vulnerary is unified party-wide as "Goodberry"
# (Marty's druidic ration; everyone shares one consumable name).
item_names:
  ITEM_VULNERARY: "Goodberry"
  ITEM_REDGEM: "Tourmaline"     # Termalaine's signature gem (ch03 chest); mechanics = Red Gem (2,500g sell), #23

# Item icon overrides: swap a vanilla item's 16x16 icon for a campaign asset under
# item_icons/<name>.4bpp (build wiring = build_campaign.inject_item_icons, which resolves
# the item's iconId -> its incbin in data/data_item_icon.s and overwrites that .4bpp).
# One icon per item id, so every Goodberry shows the berry. The asset is authored from
# FE8's shared item-icon palette via tools/item_icon_tool.py (blueberry_grid, design L2).
item_icons:
  ITEM_VULNERARY: goodberry
  ITEM_REDGEM: tourmaline        # the pink Tourmaline gem (#23) -- draws from custom pal 2 (below)

# Custom-coloured item icons use an additive THIRD source palette. Vanilla banks 0 and 1 remain
# unchanged; the build appends this 16-colour bank and the engine routes these standard item icons
# from BG palette bank 4 to reserved bank 15. This avoids bank 5, which normal UI text can use.
# palette: 16 BGR-quantised entries; index 0 = the vanilla transparent placeholder.
# More custom colours can share this bank. Adding another bank requires a fresh BG-palette collision
# audit; see docs/decisions.md -> "A campaign item icon can use a colour pal 0 lacks".
item_icon_pal2:
  icons: [ITEM_REDGEM]
  palette: ["#c0f8c8", "#ffffff", "#f4d4e2", "#cf8ea8", "#6b2a4f", "#ffe0ef", "#e876ac",
            "#d85f9a", "#b0447e", "#f0a8c8", "#8a325e", "#c088c0", "#7a2450", "#f7b9d8",
            "#b0447e", "#f7b9d8"]

# D&D content sources (frozen snapshots committed at data/)
data_sources:
  srd: data/srd/srd-snapshot.json
  open5e: data/srd/open5e-snapshot.json
  homebrew: data/homebrew/

# Arena presentation — winter reaches the arena through PALETTE ONLY, as two small deltas over
# FE8's untouched graphics and TSA. Every word not named here is copied from the base ROM, so
# both views keep vanilla's own materials. Banks are the HARDWARE banks the engine loads into,
# the same numbers `tools/rom_bg_preview.py --index-map` prints. Index 0 is the transparent key
# and may not be named. Deleting either block restores that view to byte-identical vanilla.
# Rationale and the rejected first attempt: decisions.md, "Arena presentation"; issue #265.
arena_presentation:
  # Arena welcome/wager screen — the coliseum EXTERIOR (gGfx_ArenaBuildingFront, banks 12..15).
  # The sandstone is deliberately LEFT ALONE. An earlier pass cooled the whole building and the
  # masonry stopped reading as a material; the cold lands better coming from the weather and the
  # banners while the stone stays a real, warm surface. Two things change, 16 words of 64.
  welcome:
    background:
      # Sky — hue held, saturation dropped from vanilla's 0.56–1.00 to a flat overcast. Each
      # entry keeps its own luminance so the cloud shapes survive. Bank 15 indices 1..8 plus
      # bank 12 index 1 are the sky and nothing else: an isolation mask covered every sky pixel
      # and no part of the building.
      - { bank: 15, index:  6, color: "#F7F7F7" }   # was #E7E7FF
      - { bank: 15, index:  8, color: "#F7F7F7" }   # was #EFEFF7
      - { bank: 15, index:  7, color: "#EFEFF7" }   # was #E7EFF7
      - { bank: 15, index:  5, color: "#E7EFEF" }   # was #D6E7FF
      - { bank: 15, index:  4, color: "#E7E7EF" }   # was #D6DEF7
      - { bank: 15, index:  3, color: "#DEE7EF" }   # was #CED6F7
      - { bank: 12, index:  1, color: "#DEE7EF" }   # was #CED6F7
      - { bank: 15, index:  1, color: "#D6DEE7" }   # was #C6D6EF
      - { bank: 15, index:  2, color: "#D6DEE7" }   # was #C6D6EF
      # Awnings — the stall fabric, bank 13 indices 1,2,3,4,10,11,15, all exclusive to the
      # stalls. Recoloured to hue 210 at saturation 0.23–0.31: the SAME blue the hanging
      # banners fly inside the stadium, so the two arena views agree. Luminance preserved per
      # entry, so the folds and shading still read.
      - { bank: 13, index:  1, color: "#7394AD" }   # was #BDA563
      - { bank: 13, index:  2, color: "#6384A5" }   # was #B59452
      - { bank: 13, index: 10, color: "#526B8C" }   # was #DECE00
      - { bank: 13, index: 11, color: "#4A6384" }   # was #CEAD00
      - { bank: 13, index:  3, color: "#425A7B" }   # was #A56B18
      - { bank: 13, index: 15, color: "#425A7B" }   # was #BD9400
      - { bank: 13, index:  4, color: "#394A63" }   # was #8C5210


  # Arena battle view — the coliseum behind an arena FIGHT. This is a DELTA, not a palette:
  # every word the build does not name here is copied from vanilla's own
  # Pal_ArenaBattleBg_A/B/C, so the stone, wood, gold, crowd and the three-phase shimmer stay
  # exactly as FE8 drew them. The first pass at this replaced all 64 entries per phase and
  # washed the whole coliseum into blue-grey (rejected in-engine 2026-08-11); a delta cannot
  # do that. Banks are the HARDWARE banks the engine copies to (gPaletteBuffer + 0x60 -> 6..9)
  # -- the same numbers `tools/rom_bg_preview.py --index-map` prints and the ch05arena proof
  # reads out of palette RAM. Index 0 is the transparent key and may not be named.
  #
  # Only 3 of the 64 entries differ across phases A/B/C (the crowd's gold flicker at bank 7
  # idx 8/9, plus bank 8 idx 10). None of them are ours, so one delta serves all three phases
  # and the ten-frame cycle survives untouched.
  combat:
    background:
      # The fighting floor becomes snow. Bank 9's sand ramp is EXCLUSIVE to the floor --
      # nothing above tile row 9 uses bank 9 at all -- so this touches no other pixel.
      # Ordered lightest to darkest; the vanilla luminance spacing is preserved so the
      # trodden-ground texture still reads.
      - { bank: 9, index:  3, color: "#FFFFFF" }   # was #EFEF94
      - { bank: 9, index:  9, color: "#F7F7FF" }   # was #E7E78C
      - { bank: 9, index:  2, color: "#EFEFFF" }   # was #DEDE84
      - { bank: 9, index: 10, color: "#E7E7F7" }   # was #D6D67B
      - { bank: 9, index:  1, color: "#DEDEF7" }   # was #D6CE73
      - { bank: 9, index:  4, color: "#CED6EF" }   # was #C6C66B
      - { bank: 9, index:  5, color: "#C6CEE7" }   # was #BDBD63
      - { bank: 9, index:  6, color: "#B5BDDE" }   # was #ADAD52
      - { bank: 9, index:  8, color: "#A5ADCE" }   # was #9C9C42
      # The hanging banners turn from red to blue. Bank 8 index 8 is the panel and index 4 its
      # trim; all 930 of their pixels sit in the arcade band, so these two words are exclusive
      # to the banners. Muted slate rather than a saturated heraldic blue -- vanilla's red is
      # dusty, and a bright blue is the one thing that reads as recoloured instead of lit.
      - { bank: 8, index:  8, color: "#4A6B8C" }   # was #845242
      - { bank: 8, index:  4, color: "#7B94AD" }   # was #7B635A

# Chapter-title banner theme — option A "glacial blue" (picked 2026-06-09; see
# docs/decisions.md "Chapter title cards are IMAGES"). The six colors replace
# vanilla's letter greens 1:1 (lightest fill -> darkest outline); every OTHER
# green in the title palettes (banner plaque leaf ramp, dim shimmer variant) is
# hue-mapped into the same ice family by build_campaign.py:inject_title_theme.
title_theme:
  letter_colors: ["#F0FAFF", "#BEE4FA", "#8CC4EC", "#5494D0", "#285CA0", "#0C2048"]

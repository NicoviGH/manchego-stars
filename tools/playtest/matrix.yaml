# The playtest matrix manifest (#231) -- what a scenario needs to run.
#
# This is the SINGLE SOURCE of the scenario -> ROM-configuration / host-chapter /
# checkpoint / timing table. Both consumers read it:
#   * tools/playtest/run.sh          (one scenario, via `matrix.py resolve`)
#   * tools/playtest/matrix.py run   (the grouped matrix)
# `check.py check_playtest_matrix` proves it still describes what exists, so a new
# scenario without a row is a drift failure, not a silent default.
#
# WHAT IS NOT HERE (#314). A hosted chapter DECLARES its own scenarios, in its own YAML
# under `playtest:`, and `tools/playtest/declared.py` derives their rows and their chapter
# suite from that -- the ROM from the chapter's boot, PT_HOST_CHAPTER from the host-slot
# registry. Those rows are merged in at load time and are deliberately absent from this
# file: a name declared in both places RAISES rather than letting one copy quietly win.
# What stays here is everything a chapter does not own -- the spine, the chapter-generic
# probes, the checkpoint builders, the ROM configurations, the timing classes, and `gate`
# (which spans chapters by definition, and is bounded by check_gate_chapter_window).
#
# Resolution order:  defaults  <  classes (in order, key by key)  <  the scenario's row.
# That is a direct port of run.sh's `case "$SCENARIO"` statements, including the fact
# that a later case only overrides the keys it names.

defaults:
  rom: canonical        # a key in rom_configs, or `any` for chapter-generic scenarios
  host_chapter: 1       # PT_HOST_CHAPTER; run.sh's historical default
  fps: 240              # top speed
  vsync: 0
  deadline: 420         # WORK budget: run.sh allows deadline*fps FRAMES, not wall seconds
                        # (#345 -- a wall clock measures the machine's load, not the scenario)
  kind: verdict         # verdict | record | checkpoint | diagnostic
  headless: auto        # auto = derive from kind (verdict -> headless). `false` pins it
                        # HEADED: mgba-headless attaches no video renderer, so a scenario
                        # that produces FRAMES must say so even when it is a verdict (#308).
  manual: false         # true = never auto-selected (needs a human or a sidecar)

# Checkpoint builders always ran at 240fps with a long deadline: ckpt_ch02start
# replays the entire ch00 -> ch01 -> ch02 chain to mint one save state.
checkpoint_deadline: 900

# The ROM configurations, in the order the matrix builds them. Canonical first: it is
# the cheapest to be wrong about and the one most scenarios share.
rom_configs:
  # Every build flag keeps a configuration even when no live scenario boots it: the injection
  # fingerprint enumerates these to prove a refactor leaves each build's output unchanged, and
  # a recorder restored per ADR 0367 boots its debug build from here (lordboot, montage, the
  # ch05 moose/ending boots, ch06endingboot have no live scenario since #538).
  canonical: {}
  testch:
    TESTCH: 1
  lordboot:
    LORDBOOT: 1
  montage:
    MONTAGE: 1
  # ch01 is the FIRST chapter that founds a party -- its opening LOADs the company at the
  # Northlook and then runs PREP -- so unlike ch03/ch04/ch05 this boot needs no armed seed
  # table. New Game lands on the Iron Trail; the prologue is not injected (#353).
  ch01boot:
    CH01BOOT: 1
  ch03boot:
    CH03BOOT: 1
  ch04boot:
    CH04BOOT: 1
  ch05boot:
    CH05BOOT: 1
  # Same boot, plus Lupin on the roster BEFORE the opening's CHECK_ALIVE -- the ONLY way a
  # cold boot can reach scene 4's ALIVE arm (decisions.md -> "The --ch05-boot ROM can only
  # ever play the NO-Lupin arm").
  ch05lupinboot:
    CH05BOOT: 1
    CH05LUPIN: 1
  # DEBUG boot for ch05's LAST opening beat: New Game lands straight on scene 7. Every film of
  # the moose charge otherwise replays ~52 A-presses of approved footage -- four backdrop
  # scenes, PREP, the join, Sahnar's monologue -- to reach ten seconds (Nicolas, 2026-08-15).
  ch05mooseboot:
    CH05BOOT: 1
    CH05MOOSE: 1
  # DEBUG boot for ch05's ENDING. Reaching it honestly is the whole opening, Preparations and a
  # boss kill, so the boot came BEFORE the first film this time rather than after the third.
  # `full` = Basil alive + Sahnar recruited; the other two arms build the same way with
  # CH05ENDING set to `no-sahnar` or `basil-died`. There is no Lupin variant: neither ending
  # branches on him (inject/chapter_ids.py -> CH05_ENDING_MSGS).
  ch05endingboot:
    CH05BOOT: 1
    CH05ENDING: full
  # The other two arms. Same debug boot, one env var apart -- `no-sahnar` is the full scene with
  # the berry exchange cut (she was never recruited), `basil-died` is the ten-box variant that
  # plays over her body. Neither branches on Lupin.
  ch05endingnosahnar:
    CH05BOOT: 1
    CH05ENDING: no-sahnar
  ch05endingbasildied:
    CH05BOOT: 1
    CH05ENDING: basil-died
  ch06boot:
    CH06BOOT: 1
  # DEBUG boot for ch06's ENDING (#26): New Game straight onto Messie on the ice, both hulls
  # afloat. ch05endingboot's reason: the honest path is the opening, prep and a boss kill.
  ch06endingboot:
    CH06BOOT: 1
    CH06ENDING: 1
  ch07boot:
    CH07BOOT: 1

# Ported verbatim from run.sh's two timing `case` statements.
classes:
  - match: "record*"          # faithful motion for a review GIF
    fps: 60
    vsync: 1
    deadline: 300
  - match: "smoke*"           # a full chapter's lead-in plus a long soak
    deadline: 600
  - match: "fuzz*"
    deadline: 600
  - match: "clear_ch02"
    deadline: 600
  - match: "llm"              # 18 turns x a 90s sidecar handshake budget
    deadline: 2100
  - match: "ckpt_*"           # the auto-build path always used 240fps / 900s
    kind: checkpoint
    deadline: 900

# Rows carry only what differs from the resolved defaults.
scenarios:
  controller_turn: {}                                  # the #220 controller contract
  smoke: {}
  win: {}
  # Runs RETAIL FE8, not our build: `PT_VANILLA=1 tools/playtest/run.sh vanillagold` (needs
  # the pristine build in build/vanilla-fe8 for its symbols). Never selected by a suite.
  # A MEASUREMENT of retail, not a gate: kind diagnostic, because the world-map interlude it
  # crosses is a state the controller does not classify, so it presses through it raw.
  vanillagold: {rom: any, manual: true, kind: diagnostic, deadline: 900}
  # #510 step 9 PR D: the bot plays one chapter (ours ch01; PT_VANILLA=1 retail Ch1 after the
  # Prologue) and emits a BOTRUN record; sightprobe prints what sight.lua reads, for a check
  # by eye. Both headless (memory only), both run by hand -- never in a suite. campaign (PR E)
  # plays chapter to chapter; a whole game is hours, hence its deadline.
  bot: {rom: any, manual: true, deadline: 1800}
  sightprobe: {rom: any, manual: true, deadline: 900}
  campaign: {rom: any, manual: true, deadline: 86400}
  goodberry: {}
  ch01: {}
  smoke_ch01: {}
  clearprobe: {}
  clear: {}
  clear_ch01: {}
  fuzz: {}
  fuzz_ch01: {}
  llm:                                                 # needs the external sidecar
    manual: true
  ch01win: {}
  ckpt_lordpinky: {}
  lordfloor: {}
  recordsupply:                                        # asserts bench/deploy/count/Supply
    checkpoint: lordpinky
    headless: false     # a verdict by what it ASSERTS, but it still drops frames for
                        # make_gif.py -- headless has no renderer and would strip them.
  ch01lord: {}
  ch01guide: {}
  titlecard: {}
  gameover: {}
  retreat: {}
  recordunitlist:                                      # FAILs if the SMS counters cross
    rom: testch
    headless: false     # verdict by assertion, but run.sh documents
                        # `make_gif.py recordunitlist unitlist` over its frames.
  casthelp:                                            # ADR 0346: R on each cast name, headless
    rom: testch
  ckpt_ch02start: {}
  ch01gold: {deadline: 900}       # #495: ch01's ending pays vanilla's 5,000; the whole chain,
                                  # like ckpt_ch02start
  ch03midmap:
    rom: ch03boot
    host_chapter: 4
  ch03talk:
    rom: ch03boot
    host_chapter: 4
  ch03prep:
    rom: ch03boot
    host_chapter: 4
  ch03door:
    rom: ch03boot
    host_chapter: 4
  ch03walls:                                           # #495 Borgo's cracked walls
    rom: ch03boot
    host_chapter: 4
  ch03chest:
    rom: ch03boot
    host_chapter: 4
  ch03tourmaline:
    rom: ch03boot
    host_chapter: 4
  ch03:
    rom: ch03boot
    host_chapter: 4
  smoke_ch03:
    rom: ch03boot
    host_chapter: 4
  ckpt_ch02intro: {}
  mapshot:                                             # "any hosted chapter" by design
    rom: any
    host_chapter: null
    kind: diagnostic
  recordscene:                                         # PT_STATE names the checkpoint
    kind: record
    checkpoint: dynamic

# Named selections. `gate` is what must be green before a merge; the chapter suites are
# what you run while working one chapter (each is a single ROM build). Everything else
# is `--all` (every non-manual verdict scenario) or an explicit --scenarios list.
suites:
  # Deliberately tight: the controller contract, the ch00/ch01 spine, the SMS budget,
  # and the current chapter. ch02/ch03 stay out because their checkpoints and routs
  # cost more than a gate should -- run those with their chapter suite or --all.
  # THE MERGE GATE = the spine + the two most recently hosted chapters. It is bounded on
  # purpose: an accumulating gate is ~130 scenarios and ~18 builds by ch18, which is a gate
  # nobody runs, and an unrun gate protects nothing. Depth is not deleted when a chapter ages
  # out -- it moves to that chapter's own suite below and still runs in the `--all` sweep
  # before a playtest build. Two chapters rather than one because the CHAIN is where the
  # coupling lives (chain_ch04_to_ch05 rewrites ch04's landing; chapters share donor slots,
  # one SMS id pool and one message-id space). `check.py check_gate_chapter_window` derives
  # the window from the host registry, so HOSTING ch07 is what ages ch05 out.
  gate:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - lordfloor
    - recordunitlist
    # ch05's seven aged OUT of the window when ch07 was hosted (check_gate_chapter_window
    # derives it from the host registry: the spine plus the last two hosted chapters, now
    # ch06 + ch07). Nothing is lost -- the derived `ch05` suite still carries all seven, and
    # the --all sweep still runs them.
    - ch06clock
    - ch06boarding

  ch01:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - ch01lord
    - ch01guide
    - lordfloor
    - clearprobe
    - titlecard
    - goodberry
    - smoke_ch01
    - clear_ch01


  ch03:
    - ch03
    - ch03prep
    - ch03talk
    - ch03door
    - ch03chest
    - ch03tourmaline
    - ch03midmap
    - smoke_ch03



  sandbox:
    - recordunitlist

# The difficulty instrument's frozen suite (#510 step 9, FR-021; the plan's R-6 puts it here,
# so one manifest still owns what a playtest needs). Each start is a chapter-start state an
# earlier campaign saved, played on attempt 1 from that state (montecarlo.py `suite`), never
# re-saved: an attempt-mode run writes no state. A start's `chapter` is the game's chapter
# index, the store's file name: vanilla 6 is Ch5 (CHAPTER_L_5); ours chapter N is hosted at
# index N + 1 (inject.hosts), so ours ch00-ch03 are 1-4. A state is only good for the ROM that
# saved it: `suite` refuses a start whose rom_hash is not the ROM built now, or whose file no
# longer hashes to state_sha1. The states live under references/ (gitignored).
instrument:
  version: 1
  held_out_frozen_at: null        # the commit that froze the held-out seeds (US5, PR-G)
  route: 1                        # vanilla's Ch8 split (Eirika): one vanilla env for every start
  emulator: {binary: tools/emulator/mgba-headless, sha1: 3ac3201187d021aa8a43118dc3fd6741d32e97f2}
  # FR-025: no seed is in two sets. `confirmatory` is what a cell plays (run_cell: seeds
  # 1..LOOKS[-1]); `pilot` is the one-cell pilot's 50 (PR-H).
  seed_sets:
    confirmatory: [1, 200]
    pilot: [3001, 3050]
  # What a start names unless it names its own, merged key by key like matrix.yaml's rows.
  defaults:
    seeds: {tuning: [1001, 1002], held_out: [2001, 2002]}
    style: drawn                  # attempt 1's own draw from (seed, chapter), as a cell plays it
    invariant: record             # one BOTRUN record with a game result
    estimate_wall_s: 600          # one attempt's wall time until a suite run measures it
    # the planner's budgets (planner.lua M.BEAM, M.FINAL, M.BRANCH, M.LOOK_DECISION,
    # M.LOOK_ATTEMPT; FR-018), equal to them (test_montecarlo's shipped-manifest test)
    budgets: {beam: 6, final: 4, branch: 8, lookahead_decision: 8, lookahead_attempt: 128}
  # Ours has no world map of its own: before each chapter it takes its twin's open shops,
  # read from these vanilla campaigns' start records (campaign_env.ours_env), first one first.
  shops_from:
    - references/sim/vanilla/c25b145e3745/states/e1-vanilla-ch3
    - references/sim/vanilla/c25b145e3745/states/scout-vanilla
  starts:
    # vanilla, New Game to Ch5 on seed 1, route 1, every chapter cleared clean before the
    # next (#510 comments 6478205562, 6485521139). Ch5x (5) is never reached: no clean Ch5.
    - {start_id: vanilla-prologue, game: vanilla, chapter: 0, rom_hash: c25b145e3745, label: fixture,
       state_path: references/sim/vanilla/c25b145e3745/states/e1-vanilla-ch3/0.ss,
       state_sha1: e96f8c8e9e48661dfd4646b6defab6ac0fb69ea8,
       provenance: {campaign: e1-vanilla-ch3, seed: 1, source: '#510 comment 6478205562'}}

# Named selections. `gate` is what must be green before a merge; the chapter suites are
# what you run while working one chapter (each is a single ROM build). Everything else
# is `--all` (every non-manual verdict scenario) or an explicit --scenarios list.
suites:
  # Deliberately tight: the controller contract, the ch00/ch01 spine, the SMS budget,
  # and the current chapter. ch02/ch03 stay out because their checkpoints and routs
  # cost more than a gate should -- run those with their chapter suite or --all.
  gate:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - lordfloor
    - recordunitlist
    - ch04moose
    - ch04packmath
    - ch04village
    - ch04cottage
    - ch04snag
    - clear_ch04_parley
    - ch05village
    - ch05reliquaries
    - ch05arena
    - ch05recruit
    - ch05raid
    - ch05crest

  ch01:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - ch01lord
    - lordfloor
    - clearprobe
    - titlecard
    - goodberry
    - smoke_ch01
    - clear_ch01

  ch02:
    - ch02
    - ch02baxby
    - smoke_ch02
    - clear_ch02

  ch03:
    - ch03
    - ch03prep
    - ch03talk
    - ch03door
    - ch03chest
    - ch03tourmaline
    - ch03midmap
    - ch03win
    - smoke_ch03
    - clear_ch03

  ch04:
    - ch04moose
    - ch04packmath
    - ch04village
    - ch04cottage
    - ch04snag
    - recordch04parley
    - smoke_ch04
    - clear_ch04
    - clear_ch04_parley

  # Was `ch05village` alone -- the chapter suite never picked up the scenarios that landed in
  # `gate` after it, so "the one you run while working ch05" was the weakest of the five.
  ch05:
    - ch05village
    - ch05reliquaries
    - ch05arena
    - ch05recruit
    - ch05raid
    - ch05crest

  sandbox:
    - recordunitlist

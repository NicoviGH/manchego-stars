  # #303: the difficulty-mode oracle. A probe, not a gate -- it REPORTS the red force's
  # stats in whichever mode PT_DIFFICULTY selected, and the comparison across the three
  # runs is the verdict. Runs on any hosted chapter, since every one declares a triple.
  difficulty:
    rom: any
    host_chapter: null
    kind: diagnostic
  mapshot:                                             # "any hosted chapter" by design
    rom: any
    host_chapter: null
    kind: diagnostic
  mapfull:
    rom: ch03boot
    host_chapter: 4
    kind: record
  recordopening:
    rom: montage
    kind: record
  titlecard: {}
  gameover: {}
  retreat: {}
  ckpt_rbgch01: {}
  recordrbg:
    kind: record
    checkpoint: rbgch01
  recordanim:
    rom: testch
    kind: record
  recordrbgtest:                                       # back-compat alias of recordanim
    rom: testch
    kind: record
  recordenemy:
    rom: testch
    kind: record
  recordunitlist:                                      # FAILs if the SMS counters cross
    rom: testch
    headless: false     # verdict by assertion, but run.sh documents
                        # `make_gif.py recordunitlist unitlist` over its frames.
  recordcast:                                          # PT_CHAR=<id>: bust + map sprite (#25)
    rom: testch
    kind: record        # a capture for a human look-test, same as recordanim -- not a machine
                        # verdict. Its PASS is still gated on gProcScr_StatScreen actually
                        # being live, so it cannot green-light a frame that never opened.
  ckpt_ch02start: {}
  ch03midmap:
    rom: ch03boot
    host_chapter: 4
  ch03talk:
    rom: ch03boot
    host_chapter: 4
  ch03prep:
    rom: ch03boot
    host_chapter: 4
  ch03door:
    rom: ch03boot
    host_chapter: 4
  ch03chest:
    rom: ch03boot
    host_chapter: 4
  ch03tourmaline:
    rom: ch03boot
    host_chapter: 4
  koboldview:                                          # #23 art-review probe
    rom: ch03boot
    host_chapter: 4
    kind: diagnostic
  lzview:
    rom: ch03boot
    host_chapter: 4
    kind: diagnostic
  enemycheck:
    rom: ch03boot
    host_chapter: 4
    kind: diagnostic
  ch03:
    rom: ch03boot
    host_chapter: 4
  smoke_ch03:
    rom: ch03boot
    host_chapter: 4
  recordchain:
    kind: record
    checkpoint: ch02start
  ckpt_ch02intro: {}
  recordscene:                                         # PT_STATE names the checkpoint
    kind: record
    checkpoint: dynamic
  recordch02intro:
    kind: record
    checkpoint: ch02intro
  recordch03open:
    rom: ch03boot
    host_chapter: 4
    kind: record
  attackprobe:                                         # reads whatever map it lands on
    rom: any
    host_chapter: null
    kind: diagnostic
  recordch03talk:
    rom: ch03boot
    host_chapter: 4
    kind: record
  recordch03win:
    rom: ch03boot
    host_chapter: 4
    kind: record
  recordch03midmap:
    rom: ch03boot
    host_chapter: 4
    kind: record
  recordch02map:
    kind: record
    checkpoint: ch02start
  recordch02combat:
    kind: record
    checkpoint: ch02start
  recordch02ending:
    kind: record
    checkpoint: ch02start

# Named selections. `gate` is what must be green before a merge; the chapter suites are
# what you run while working one chapter (each is a single ROM build). Everything else
# is `--all` (every non-manual verdict scenario) or an explicit --scenarios list.
suites:
  # Deliberately tight: the controller contract, the ch00/ch01 spine, the SMS budget,
  # and the current chapter. ch02/ch03 stay out because their checkpoints and routs
  # cost more than a gate should -- run those with their chapter suite or --all.
  # THE MERGE GATE = the spine + the two most recently hosted chapters. It is bounded on
  # purpose: an accumulating gate is ~130 scenarios and ~18 builds by ch18, which is a gate
  # nobody runs, and an unrun gate protects nothing. Depth is not deleted when a chapter ages
  # out -- it moves to that chapter's own suite below and still runs in the `--all` sweep
  # before a playtest build. Two chapters rather than one because the CHAIN is where the
  # coupling lives (chain_ch04_to_ch05 rewrites ch04's landing; chapters share donor slots,
  # one SMS id pool and one message-id space). `check.py check_gate_chapter_window` derives
  # the window from the host registry, so HOSTING ch06 is what ages ch04 out.
  gate:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - lordfloor
    - recordunitlist
    - ch04moose
    - ch04packmath
    - ch04village
    - ch04cottage
    - ch04snag
    - clear_ch04_parley
    - ch05village
    - ch05reliquaries
    - ch05arena
    - ch05recruit
    # ch05recruit alone only ever walks the no-Lupin arm (the gate ROM has no wolf), so an
    # inverted BEQ or a swapped pair of message ids would pass it. This is the run that
    # walks the OTHER arm, and it is the only one that does.
    - ch05lupinbenched
    - ch05raid
    - ch05crest

  ch01:
    - controller_turn
    - win
    - gameover
    - retreat
    - ch01
    - ch01win
    - ch01lord
    - lordfloor
    - clearprobe
    - titlecard
    - goodberry
    - smoke_ch01
    - clear_ch01


  ch03:
    - ch03
    - ch03prep
    - ch03talk
    - ch03door
    - ch03chest
    - ch03tourmaline
    - ch03midmap
    - smoke_ch03



  sandbox:
    - recordunitlist
